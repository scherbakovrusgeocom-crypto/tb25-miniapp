<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Прогнозы ТБ 2.5</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
            --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 12px 16px 100px 16px;
            min-height: 100vh;
        }
        .header { text-align: center; margin-bottom: 16px; padding-top: 4px; }
        .header h1 { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
        .header p { color: var(--hint-color); font-size: 13px; }
        .tabs {
            display: flex;
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 14px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 9px;
            border-radius: 9px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .tab.active {
            background: var(--button-color);
            color: var(--button-text-color);
            font-weight: 700;
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card .match {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .card .league {
            font-size: 12px;
            color: var(--hint-color);
            margin-bottom: 10px;
        }
        .card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 5px;
        }
        .card .label { color: var(--hint-color); }
        .prob-badge {
            font-weight: 700;
            font-size: 14px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }
        .odd-value {
            font-weight: 700;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }
        .progress-bar {
            height: 5px;
            background: var(--bg-color);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #84cc16);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .btn {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            padding: 14px;
            background: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .btn:active { opacity: 0.85; }
        .loading {
            text-align: center;
            color: var(--hint-color);
            padding: 40px 20px;
            font-size: 14px;
        }
        .loading::before {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            margin: 0 auto 12px;
            border: 3px solid var(--secondary-bg);
            border-top-color: var(--button-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            text-align: center;
            color: #ef4444;
            padding: 20px;
            font-size: 14px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 12px;
        }
        .stats-container { padding: 10px 0; }
        .stats-big {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #22c55e, #84cc16);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .stats-label {
            text-align: center;
            color: var(--hint-color);
            font-size: 13px;
            margin-bottom: 24px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .stats-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }
        .stats-box .num {
            font-size: 22px;
            font-weight: 800;
            display: block;
            margin-bottom: 2px;
        }
        .stats-box .name {
            font-size: 12px;
            color: var(--hint-color);
        }
        .stats-box.win .num { color: #22c55e; }
        .stats-box.lose .num { color: #ef4444; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚽ Прогнозы ТБ 2.5</h1>
        <p id="subtitle">Загрузка...</p>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-matches" onclick="switchTab('matches')">📈 Прогнозы</div>
        <div class="tab" id="tab-stats" onclick="switchTab('stats')">📊 Статистика</div>
    </div>

    <div id="content">
        <div class="loading">Загрузка данных</div>
    </div>

    <button class="btn" onclick="loadData()">🔄 Обновить</button>

    <script>
        // ⚠️ ЗАМЕНИТЕ НА URL ВАШЕГО ВЕБ-ПРИЛОЖЕНИЯ APPS SCRIPT
        const API_URL = 'https://script.google.com/macros/s/AKfycbxkhesCYdzNhVrygfjdrsn6xnDdv5JgpprDe3nyxUAZchlSFoVBs7iet6mLvG-SC8OB/exec';

        let currentTab = 'matches';

        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            const userName = tg.initDataUnsafe?.user?.first_name || 'друг';
            document.getElementById('subtitle').textContent = `Привет, ${userName}!`;
        } else {
            document.getElementById('subtitle').textContent = 'Открыто вне Telegram';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            loadData();
        }

        async function loadData() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Загрузка данных</div>';

            try {
                const url = `${API_URL}?action=${currentTab}`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();

                if (currentTab === 'matches') renderMatches(data);
                else renderStats(data);
            } catch (e) {
                content.innerHTML = `<div class="error">❌ Ошибка: ${e.message}</div>`;
            }
        }

        function renderMatches(data) {
            if (!Array.isArray(data) || data.length === 0) {
                document.getElementById('content').innerHTML = 
                    '<div class="loading">📭 Матчей пока нет</div>';
                return;
            }

            const medals = ['🥇', '🥈', '🥉'];
            let html = '';

            data.forEach((m, i) => {
                const prefix = i < 3 ? medals[i] : `${i + 1}.`;
                const prob = parseInt(m.probability) || 0;
                const trend = m.trend || '';

                html += `
                    <div class="card">
                        <div class="match">${prefix} ${m.home} — ${m.away}</div>
                        <div class="league">🏆 ${m.league} • 🕐 ${m.time}</div>
                        <div class="row">
                            <span class="label">📊 Тотал</span>
                            <span><b>${m.total}</b></span>
                        </div>
                        <div class="row">
                            <span class="label">🎯 Вероятность</span>
                            <span class="prob-badge">${prob}%</span>
                        </div>
                        <div class="row">
                            <span class="label">💰 Кэф</span>
                            <span class="odd-value">${m.odd} ${trend}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-bar-fill" style="width: ${prob}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('content').innerHTML = html;
        }

        function renderStats(data) {
            if (!data) {
                document.getElementById('content').innerHTML = 
                    '<div class="loading">📊 Статистики пока нет</div>';
                return;
            }

            const html = `
                <div class="stats-container">
                    <div class="stats-big">${data.accuracy}%</div>
                    <div class="stats-label">🎯 Точность прогнозов</div>
                    
                    <div class="stats-grid">
                        <div class="stats-box win">
                            <span class="num">${data.wins}</span>
                            <span class="name">✅ Зашло</span>
                        </div>
                        <div class="stats-box lose">
                            <span class="num">${data.loses}</span>
                            <span class="name">❌ Не зашло</span>
                        </div>
                    </div>

                    <div class="stats-box">
                        <span class="num">${data.total}</span>
                        <span class="name">📈 Всего матчей</span>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        // Автозагрузка
        loadData();
    </script>
</body>
</html>
