<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Прогнозы ТБ 2.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  /* Aurora Premium Palette */
  --bg-1: #0b0d17;
  --bg-2: #111428;
  --card-1: #161a2e;
  --card-2: #1c2138;
  --glass: rgba(22, 26, 46, 0.78);
  --border: rgba(148, 163, 184, 0.12);
  --border-mid: rgba(148, 163, 184, 0.2);
  --border-strong: rgba(129, 140, 248, 0.4);

  --text: #f8fafc;
  --text-dim: #a8b2c9;
  --text-mute: #6b7590;

  --indigo: #818cf8;
  --indigo-soft: rgba(129, 140, 248, 0.15);
  --indigo-glow: rgba(129, 140, 248, 0.35);

  --lavender: #c084fc;
  --lavender-soft: rgba(192, 132, 252, 0.15);
  --lavender-glow: rgba(192, 132, 252, 0.35);

  --green: #4ade80;
  --green-soft: rgba(74, 222, 128, 0.15);
  --green-glow: rgba(74, 222, 128, 0.35);

  --gold: #fcd34d;
  --gold-soft: rgba(252, 211, 77, 0.15);
  --gold-glow: rgba(252, 211, 77, 0.35);

  --red: #f87171;
  --red-soft: rgba(248, 113, 113, 0.15);
  --red-glow: rgba(248, 113, 113, 0.35);
}
body.light-theme {
  --bg-1: #f8fafc;
  --bg-2: #eef2f7;
  --card-1: #ffffff;
  --card-2: #f8fafc;
  --glass: rgba(255, 255, 255, 0.9);
  --border: rgba(15, 23, 42, 0.08);
  --border-mid: rgba(15, 23, 42, 0.15);
  --border-strong: rgba(99, 102, 241, 0.4);
  --text: #0f172a;
  --text-dim: #475569;
  --text-mute: #94a3b8;
  --indigo: #6366f1;
  --lavender: #a855f7;
  --green: #16a34a;
  --gold: #d97706;
  --red: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-1);
  color: var(--text);
  padding: 0 0 30px;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: background 0.4s ease, color 0.4s ease;
  font-feature-settings: "cv11";
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(129, 140, 248, 0.18), transparent 55%),
    radial-gradient(ellipse at 85% 30%, rgba(192, 132, 252, 0.14), transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(59, 130, 246, 0.1), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  pointer-events: none;
  z-index: 0;
}
body.light-theme::before { opacity: 0.5; }

/* ===== ШАПКА ===== */
.header {
  position: relative;
  padding: 26px 20px 22px;
  text-align: center;
  z-index: 1;
}
.header-top {
  position: absolute;
  top: 16px; right: 16px;
  z-index: 5;
}
.theme-btn {
  width: 40px; height: 40px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-mid);
  border-radius: 50%;
  color: var(--indigo);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}
.theme-btn:active { transform: scale(0.9) rotate(20deg); border-color: var(--indigo); }
.theme-btn svg { width: 18px; height: 18px; stroke-width: 2; }

.ball-wrap {
  width: 76px; height: 76px;
  margin: 0 auto 14px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  animation: ballPulse 2.6s ease-in-out infinite;
}
.ball-wrap::before {
  content: '';
  position: absolute;
  inset: -14px;
  background: radial-gradient(circle, rgba(129, 140, 248, 0.4), transparent 70%);
  border-radius: 50%;
  filter: blur(16px);
  animation: ballGlow 3.2s ease-in-out infinite;
}
@keyframes ballPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes ballGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.12); }
}
.ball-emoji {
  font-size: 54px;
  line-height: 1;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 4px 24px rgba(129, 140, 248, 0.8));
  animation: ballRotate 6s ease-in-out infinite;
}
@keyframes ballRotate {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
.header h1 {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--indigo) 0%, var(--lavender) 50%, var(--indigo) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShimmer 5s linear infinite;
  line-height: 1.1;
}
@keyframes titleShimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.header .sub {
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--text-dim);
  margin-top: 8px;
  text-transform: uppercase;
  font-weight: 700;
}

/* ===== ЧИПЫ ===== */
.header-chips {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
}
.header-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-mid);
  border-radius: 24px;
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
}
.header-chip svg { width: 15px; height: 15px; stroke-width: 2.2; color: var(--indigo); }
.header-chip:active { transform: scale(0.95); border-color: var(--indigo); }
.header-chip.bonus-chip {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg,
    rgba(252, 211, 77, 0.18) 0%,
    rgba(192, 132, 252, 0.12) 50%,
    rgba(252, 211, 77, 0.18) 100%);
  border: 1px solid rgba(252, 211, 77, 0.35);
  box-shadow: 0 0 20px rgba(252, 211, 77, 0.15);
}
.header-chip.bonus-chip::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
  animation: glassShimmer 8s ease-in-out infinite;
}
@keyframes glassShimmer {
  0%, 75% { left: -100%; }
  85% { left: 100%; }
  100% { left: 100%; }
}
.header-chip.bonus-chip svg { color: var(--gold); }
.header-chip.bonus-chip svg, .header-chip.bonus-chip span { position: relative; z-index: 1; }

/* ===== ТАБЫ ===== */
.tabs-wrap {
  position: sticky;
  top: 0;
  background: rgba(11, 13, 23, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 12px 14px;
  z-index: 10;
  border-bottom: 1px solid var(--border);
  transition: background 0.4s ease;
}
body.light-theme .tabs-wrap { background: rgba(248, 250, 252, 0.9); }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: space-between; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px;
  border-radius: 14px;
  font-size: 10px;
  font-weight: 800;
  color: var(--text-dim);
  border: 1px solid transparent;
  transition: all 0.3s;
  cursor: pointer;
  letter-spacing: 0.3px;
}
.tab svg { width: 20px; height: 20px; stroke-width: 2.2; }
.tab.active {
  background: linear-gradient(135deg, var(--indigo-soft), var(--lavender-soft));
  border-color: var(--indigo);
  color: var(--indigo);
}

#content { padding: 18px 16px; position: relative; z-index: 1; }

/* ===== КАРТОЧКА ===== */
.card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 16px;
  position: relative;
  animation: cardSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow:
    0 10px 40px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition: all 0.4s ease;
  overflow: hidden;
}
body.light-theme .card {
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
}

.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(90deg, transparent, var(--indigo), var(--lavender), var(--indigo), transparent);
  opacity: 0.85;
}
.card.card-hot::before {
  background: linear-gradient(90deg, transparent, var(--gold), #f59e0b, var(--gold), transparent);
  opacity: 1;
}
.card.card-mid::before {
  background: linear-gradient(90deg, transparent, var(--green), #10b981, var(--green), transparent);
}
.card.card-live::before {
  background: linear-gradient(90deg, transparent, var(--red), #f43f5e, var(--red), transparent);
  animation: liveFlash 2s ease-in-out infinite;
}
@keyframes liveFlash {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

@keyframes cardSlideIn {
  0% { opacity: 0; transform: translateY(20px) scale(0.97); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.005); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ЗАГОЛОВОК КАРТОЧКИ (медаль + команды) */
.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 14px;
}
.card-medal-badge {
  flex-shrink: 0;
  width: 32px; height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  line-height: 1;
}
.card-medal-badge.gold { filter: drop-shadow(0 0 10px var(--gold-glow)); }
.card-medal-badge.silver { filter: drop-shadow(0 0 10px rgba(203, 213, 225, 0.5)); }
.card-medal-badge.bronze { filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.5)); }

.card-num-badge {
  flex-shrink: 0;
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--indigo-soft);
  border: 1px solid rgba(129, 140, 248, 0.3);
  border-radius: 50%;
  color: var(--indigo);
  font-size: 12px;
  font-weight: 800;
  margin-top: 2px;
}

.card-teams-block {
  flex: 1;
  min-width: 0;
}
.card-team {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.35;
  word-break: break-word;
  overflow-wrap: break-word;
  color: var(--text);
}
.card-team + .card-team {
  margin-top: 2px;
  color: var(--text-dim);
  font-weight: 700;
}

/* Мета-информация */
.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 14px;
  font-weight: 600;
  flex-wrap: wrap;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.card-meta .meta-item {
  display: flex; align-items: center; gap: 5px;
}
.card-meta .meta-item.league {
  color: var(--lavender);
  font-weight: 700;
}

/* СТАТЫ */
.card-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.stat-box {
  background: rgba(11, 13, 23, 0.4);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 6px;
  text-align: center;
  transition: all 0.3s;
}
body.light-theme .stat-box { background: rgba(99, 102, 241, 0.05); }
.stat-box .label {
  font-size: 10px;
  color: var(--text-mute);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.stat-box .value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -0.5px;
}
.stat-box.blue .value {
  color: var(--indigo);
  text-shadow: 0 0 16px var(--indigo-glow);
}
.stat-box.green .value {
  color: var(--green);
  text-shadow: 0 0 16px var(--green-glow);
}
.stat-box.gold .value {
  color: var(--gold);
  text-shadow: 0 0 16px var(--gold-glow);
}

/* Прогноз */
.outcome-line {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px;
  background: var(--indigo-soft);
  border: 1px solid rgba(129, 140, 248, 0.2);
  border-radius: 12px;
  font-size: 13px;
  margin-bottom: 8px;
}
.outcome-line:last-child { margin-bottom: 0; }
.outcome-line.double {
  background: var(--lavender-soft);
  border-color: rgba(192, 132, 252, 0.2);
}
.outcome-line .label {
  color: var(--text-dim);
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.outcome-line .fav {
  color: var(--indigo);
  font-weight: 900;
  font-size: 14px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.3px;
}
.outcome-line.double .fav { color: var(--lavender); }

.live-badge {
  display: inline-block;
  padding: 3px 9px;
  background: var(--red);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  border-radius: 6px;
  letter-spacing: 0.5px;
  animation: livePulse 1.5s infinite;
}
@keyframes livePulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ===== СКЕЛЕТОНЫ ===== */
.skeleton-card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 16px;
  overflow: hidden;
  position: relative;
}
.skeleton-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(129, 140, 248, 0.1) 50%, transparent 100%);
  animation: skeletonShimmer 1.8s ease-in-out infinite;
}
@keyframes skeletonShimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}
.skeleton-line {
  height: 14px;
  background: rgba(129, 140, 248, 0.12);
  border-radius: 7px;
  margin-bottom: 14px;
}
.skeleton-line.w-70 { width: 70%; }
.skeleton-line.w-50 { width: 50%; }
.skeleton-line.w-100 { width: 100%; }
.skeleton-line.h-18 { height: 18px; }
.skeleton-balls {
  display: flex; justify-content: center; gap: 12px;
  padding: 20px 0;
}
.skeleton-ball {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(129, 140, 248, 0.3), rgba(129, 140, 248, 0.1));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  animation: ballBounce 1.4s ease-in-out infinite;
}
.skeleton-ball:nth-child(2) { animation-delay: 0.2s; }
.skeleton-ball:nth-child(3) { animation-delay: 0.4s; }
@keyframes ballBounce {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-12px); opacity: 1; }
}

/* ===== СВОДКА ВЧЕРА ===== */
.yesterday-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.yesterday-stat {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 10px;
  text-align: center;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.yesterday-stat .ys-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 30px;
  font-weight: 900;
  display: block;
  margin-bottom: 5px;
  line-height: 1;
}
.yesterday-stat .ys-label {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 800;
}
.yesterday-stat.win { border-color: rgba(74, 222, 128, 0.35); }
.yesterday-stat.win .ys-num { color: var(--green); text-shadow: 0 0 16px var(--green-glow); }
.yesterday-stat.lose { border-color: rgba(248, 113, 113, 0.35); }
.yesterday-stat.lose .ys-num { color: var(--red); text-shadow: 0 0 16px var(--red-glow); }
.yesterday-stat.acc .ys-num { color: var(--gold); text-shadow: 0 0 16px var(--gold-glow); }

/* ===== ЭКСПРЕСС ===== */
.express-hero {
  background: linear-gradient(135deg, #78350f 0%, #b45309 50%, #d97706 100%);
  border-radius: 24px;
  padding: 30px 22px;
  color: #fff;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 14px 50px rgba(217, 119, 6, 0.4);
  animation: cardSlideIn 0.6s ease;
}
.express-hero-title {
  font-size: 22px; font-weight: 900; letter-spacing: 2px;
}
.express-hero-sub { font-size: 11px; opacity: 0.9; margin-top: 6px; letter-spacing: 1.5px; }
.express-hero-odd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 64px; font-weight: 900; margin-top: 16px;
  background: linear-gradient(180deg, #fef9c3, #fcd34d, #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
}
.express-hero-label {
  font-size: 10px; opacity: 0.9; letter-spacing: 3px; margin-top: 10px;
  text-transform: uppercase; font-weight: 700;
}
.express-items-title {
  text-align: center; font-size: 13px; color: var(--text-dim);
  margin-bottom: 16px; font-weight: 800; letter-spacing: 1.5px;
}
.express-card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px 20px;
  margin-bottom: 12px;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
}
.express-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.express-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--indigo), var(--lavender));
  color: #fff; font-size: 14px; font-weight: 900;
  border-radius: 50%; flex-shrink: 0;
}
.express-match { font-size: 15px; font-weight: 800; }
.express-league { font-size: 11px; color: var(--text-dim); margin-left: 42px; margin-bottom: 14px; }
.express-card-body {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; background: rgba(11, 13, 23, 0.4);
  border-radius: 12px; padding: 12px 8px;
}
body.light-theme .express-card-body { background: rgba(99, 102, 241, 0.05); }
.express-stat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.express-stat-label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
.express-stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; font-weight: 800;
}
.express-odd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 12px var(--gold-glow);
}
.express-footer {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border-strong);
  border-radius: 20px;
  padding: 20px 22px;
  margin-top: 18px;
}
.express-footer-row {
  display: flex; justify-content: space-between;
  font-size: 14px; padding: 9px 0;
  color: var(--text-dim); font-weight: 600;
}
.express-footer-row:last-child {
  margin-top: 8px; padding-top: 16px;
  border-top: 1px solid var(--border);
  color: var(--text); font-size: 15px;
}
.express-footer-odd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 30px; font-weight: 900; color: var(--gold);
  text-shadow: 0 0 24px var(--gold-glow);
}

/* ===== СТАТИСТИКА ===== */
.stats-wrap { padding: 10px 0; }
.stats-big {
  font-family: 'JetBrains Mono', monospace;
  text-align: center; font-size: 88px; font-weight: 900;
  background: linear-gradient(135deg, var(--indigo), var(--lavender), var(--indigo));
  background-size: 200% 100%;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
  margin-bottom: 10px;
  animation: titleShimmer 5s linear infinite;
}
.stats-label {
  text-align: center; color: var(--text-dim);
  font-size: 12px; letter-spacing: 3px;
  text-transform: uppercase; font-weight: 800;
  margin-bottom: 30px;
}
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.stats-box {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 18px;
  text-align: center;
  animation: cardSlideIn 0.5s ease;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
}
.stats-box.clickable:active { transform: scale(0.97); }
.stats-box .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px; font-weight: 900;
  display: block; margin-bottom: 5px;
  line-height: 1;
}
.stats-box .name { font-size: 12px; color: var(--text-dim); font-weight: 800; }
.stats-box.win { border-color: rgba(74, 222, 128, 0.35); }
.stats-box.win .num { color: var(--green); text-shadow: 0 0 20px var(--green-glow); }
.stats-box.lose { border-color: rgba(248, 113, 113, 0.35); }
.stats-box.lose .num { color: var(--red); text-shadow: 0 0 20px var(--red-glow); }

/* ===== ЛИГИ ===== */
.leagues-title {
  font-size: 14px;
  font-weight: 900;
  color: var(--indigo);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  margin-bottom: 14px;
  margin-top: 30px;
}
.league-item {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: cardSlideIn 0.5s ease;
}
.league-name {
  flex: 1;
  font-size: 13px;
  font-weight: 800;
}
.league-stats {
  display: flex; gap: 12px; align-items: center;
  font-size: 13px; font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
}
.league-win { color: var(--green); }
.league-lose { color: var(--red); }
.league-acc {
  background: var(--indigo-soft);
  color: var(--indigo);
  padding: 4px 10px;
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
}

/* ===== FAQ ===== */
.faq-header { text-align: center; padding: 20px 0 26px; }
.faq-header-icon {
  width: 68px; height: 68px;
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--indigo-soft), var(--lavender-soft));
  border: 2px solid var(--indigo);
  border-radius: 50%;
  font-size: 34px;
  animation: ballPulse 3s ease-in-out infinite;
}
.faq-header-title {
  font-size: 26px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(135deg, var(--indigo), var(--lavender));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 5px;
}
.faq-header-sub {
  font-size: 12px; color: var(--text-dim);
  letter-spacing: 2px; text-transform: uppercase; font-weight: 700;
}
.faq-section { margin-bottom: 24px; }
.faq-section-title {
  font-size: 12px; font-weight: 900;
  color: var(--indigo);
  text-transform: uppercase; letter-spacing: 2px;
  margin-bottom: 12px;
}
.faq-item {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 12px;
  animation: cardSlideIn 0.5s ease;
}
.faq-q {
  font-size: 14px; font-weight: 800;
  margin-bottom: 10px;
  display: flex; align-items: flex-start; gap: 10px;
  line-height: 1.35;
}
.faq-q-icon {
  flex-shrink: 0;
  width: 24px; height: 24px;
  background: linear-gradient(135deg, var(--indigo), var(--lavender));
  color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
}
.faq-a {
  font-size: 13px; color: var(--text-dim);
  line-height: 1.6; padding-left: 34px;
}
.faq-a strong { color: var(--indigo); font-weight: 800; }
.faq-a ul { margin-top: 8px; padding-left: 18px; }
.faq-a li { margin-bottom: 6px; }
.faq-stat {
  display: inline-block; padding: 2px 10px;
  background: var(--indigo-soft);
  color: var(--indigo);
  border-radius: 6px; font-size: 12px; font-weight: 800;
  margin: 0 3px;
}
.faq-highlight {
  background: linear-gradient(135deg, var(--indigo-soft), var(--lavender-soft));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px; margin-top: 12px;
  font-size: 13px; line-height: 1.55;
}

/* ===== ДИСКЛЕЙМЕР ===== */
.disclaimer {
  background: linear-gradient(160deg, rgba(252, 211, 77, 0.08), rgba(248, 113, 113, 0.04));
  border: 1px solid rgba(252, 211, 77, 0.3);
  border-radius: 18px;
  padding: 18px 20px;
  margin-top: 18px;
}
.disclaimer-title {
  font-size: 13px;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.disclaimer-title::before { content: '⚠️'; font-size: 18px; }
.disclaimer-text {
  font-size: 12px;
  color: var(--text);
  line-height: 1.7;
}
.disclaimer-text strong { color: var(--gold); }

/* ===== БОНУС ===== */
.bonus-card {
  background: linear-gradient(135deg, #7c2d12 0%, #b45309 50%, #d97706 100%);
  border-radius: 24px;
  padding: 30px 24px;
  color: #fff;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 16px 50px rgba(217, 119, 6, 0.4);
  animation: cardSlideIn 0.6s ease;
}
.bonus-card::before {
  content: '🎁';
  position: absolute;
  top: 16px; right: 20px;
  font-size: 44px;
  opacity: 0.4;
  animation: ballRotate 4s ease-in-out infinite;
}
.bonus-title {
  font-size: 24px; font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 14px;
}
.bonus-text {
  font-size: 14px;
  opacity: 0.95;
  line-height: 1.65;
  margin-bottom: 22px;
}
.bonus-btn {
  display: inline-block;
  padding: 15px 38px;
  background: linear-gradient(135deg, #fcd34d, #f59e0b);
  color: #78350f;
  text-decoration: none;
  border-radius: 32px;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 1px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  border: none;
  cursor: pointer;
  transition: 0.3s;
}
.bonus-btn:active { transform: scale(0.96); }

/* ===== EMPTY / ERROR ===== */
.empty {
  text-align: center; color: var(--text-mute);
  padding: 80px 20px; font-size: 14px; font-weight: 700;
}
.empty::before {
  content: '⚽'; font-size: 64px;
  display: block; margin-bottom: 16px; opacity: 0.3;
}
.error {
  text-align: center; color: var(--red);
  padding: 22px; font-size: 14px;
  background: var(--red-soft);
  border: 1px solid rgba(248, 113, 113, 0.3);
  border-radius: 16px; font-weight: 600;
}

.winner-badge {
  display: inline-block;
  padding: 5px 12px;
  background: var(--green-soft);
  border: 1px solid rgba(74, 222, 128, 0.3);
  color: var(--green);
  border-radius: 10px;
  font-size: 12px; font-weight: 800;
  margin-top: 8px;
}

.sync-line {
  text-align: center;
  font-size: 11px;
  color: var(--text-mute);
  padding: 20px 16px 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.section-title {
  font-size: 22px; font-weight: 900;
  text-align: center; margin-bottom: 5px;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--indigo), var(--lavender));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.section-sub {
  font-size: 12px; color: var(--text-dim);
  text-align: center; margin-bottom: 20px;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="theme-btn" onclick="toggleTheme()" title="Сменить тему">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </div>
  </div>

  <div class="ball-wrap">
    <div class="ball-emoji">⚽</div>
  </div>
  <h1>ПРОГНОЗЫ</h1>
  <div class="sub">ТОТАЛ БОЛЬШЕ 2.5</div>

  <div class="header-chips">
    <div class="header-chip bonus-chip" onclick="switchTabDirect('bonus')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="13" rx="2"/>
        <path d="M12 8v13M3 12h18"/>
        <path d="M7.5 8a2.5 2.5 0 010-5c1.5 0 2.5 1 4.5 5"/>
        <path d="M16.5 8a2.5 2.5 0 000-5c-1.5 0-2.5 1-4.5 5"/>
      </svg>
      <span>Бонус</span>
    </div>
    <div class="header-chip" onclick="switchTabDirect('faq')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
        <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
      </svg>
      FAQ
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Сегодня
    </div>
    <div class="tab" data-tab="tomorrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Завтра
    </div>
    <div class="tab" data-tab="yesterday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Вчера
    </div>
    <div class="tab" data-tab="express">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Экспресс
    </div>
    <div class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 12l4-4 4 4 5-5"/></svg>
      Стата
    </div>
  </div>
</div>

<div id="content"></div>
<div class="sync-line" id="syncLine"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';
const AD_URL = 'https://baltbet.ru/account/register?refpromo=1221753';

const CACHE_TTL = 30 * 60 * 1000;
let currentTab = 'today';

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function initTheme() {
  const saved = localStorage.getItem('tb25_theme') || 'dark';
  if (saved === 'light') document.body.classList.add('light-theme');
  updateThemeIcon(saved);
}
function toggleTheme() {
  haptic('medium');
  const isLight = document.body.classList.toggle('light-theme');
  const theme = isLight ? 'light' : 'dark';
  localStorage.setItem('tb25_theme', theme);
  updateThemeIcon(theme);
}
function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  if (theme === 'light') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }
}
initTheme();

function haptic(s) {
  if (tg?.HapticFeedback) try {
    if (s === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (s === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e){}
}

function switchTabDirect(tabName) {
  haptic('medium');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });
  currentTab = tabName;
  loadData();
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  haptic('medium');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTab = tab.dataset.tab;
  loadData();
});

function getCache(tab) {
  try { const r = localStorage.getItem(`tb25_v23_${tab}`); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function setCache(tab, version, data) {
  try {
    localStorage.setItem(`tb25_v23_${tab}`, JSON.stringify({ version, data, ts: Date.now() }));
    localStorage.setItem('tb25_last_update', new Date().toISOString());
  } catch(e){}
}

function updateSyncLine() {
  const el = document.getElementById('syncLine');
  if (!el) return;
  try {
    const iso = localStorage.getItem('tb25_last_update');
    if (!iso) { el.textContent = ''; return; }
    const d = new Date(iso);
    const now = new Date();
    const diffMin = Math.floor((now - d) / 60000);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    let ago = '';
    if (diffMin < 1) ago = 'только что';
    else if (diffMin < 60) ago = `${diffMin} мин назад`;
    else if (diffMin < 1440) ago = `${Math.floor(diffMin / 60)} ч назад`;
    else ago = `${Math.floor(diffMin / 1440)} дн назад`;
    el.textContent = `🕐 Обновлено: ${hh}:${mm} · ${day}.${month} (${ago})`;
  } catch (e) { el.textContent = ''; }
}

function showSkeleton() {
  return `
    <div class="skeleton-card">
      <div class="skeleton-balls">
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
      </div>
      <div class="skeleton-line w-70 h-18"></div>
      <div class="skeleton-line w-50"></div>
      <div class="skeleton-line w-100"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-balls">
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
      </div>
      <div class="skeleton-line w-70 h-18"></div>
      <div class="skeleton-line w-50"></div>
      <div class="skeleton-line w-100"></div>
    </div>
  `;
}

async function loadData() {
  const content = document.getElementById('content');

  if (currentTab === 'faq') { renderFaq(); updateSyncLine(); return; }
  if (currentTab === 'bonus') { renderBonus(); updateSyncLine(); return; }

  const cached = getCache(currentTab);

  if (cached) {
    renderTab(currentTab, cached.data);
    updateSyncLine();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = showSkeleton();
  }

  try {
    const resp = await fetch(`${API_URL}?action=${currentTab}`);
    const result = await resp.json();
    if (result.error) throw new Error(result.error);
    const serverVersion = result.version || '1';
    const serverData = result.data !== undefined ? result.data : result;
    if (!cached || cached.version !== serverVersion) {
      setCache(currentTab, serverVersion, serverData);
      renderTab(currentTab, serverData);
      updateSyncLine();
    } else {
      setCache(currentTab, serverVersion, serverData);
      updateSyncLine();
    }
  } catch (e) {
    if (!cached) content.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

function renderTab(tab, data) {
  if (tab === 'today' || tab === 'tomorrow') {
    renderMatches(Array.isArray(data) ? data : []);
  }
  else if (tab === 'yesterday') renderYesterday(data);
  else if (tab === 'express') renderExpress(data);
  else if (tab === 'stats') renderStats(data);
  else if (tab === 'faq') renderFaq();
  else if (tab === 'bonus') renderBonus();
}

function cardClass(p) { return p >= 70 ? 'card-hot' : p >= 65 ? 'card-mid' : ''; }

function getMedalClass(idx) {
  if (idx === 0) return 'card-medal-badge gold';
  if (idx === 1) return 'card-medal-badge silver';
  if (idx === 2) return 'card-medal-badge bronze';
  return 'card-num-badge';
}
function getMedalText(idx) {
  if (idx === 0) return '🥇';
  if (idx === 1) return '🥈';
  if (idx === 2) return '🥉';
  return String(idx + 1);
}

function renderMatches(data) {
  const content = document.getElementById('content');
  if (!Array.isArray(data) || !data.length) {
    content.innerHTML = '<div class="empty">Нет матчей</div>';
    return;
  }

  let html = '';
  data.forEach((m, idx) => {
    const prob = parseInt(m.probability) || 0;
    const live = String(m.result || '').includes('Live');
    const medalClass = getMedalClass(idx);
    const medalText = getMedalText(idx);

    let outcomeHtml = '';
    if (m.outcome) {
      const o = m.outcome;
      const p1 = o.p1 || 0, px = o.x || 0, p2 = o.p2 || 0;
      const best = Math.max(p1, px, p2);
      let mainLabel = 'X';
      if (best === p1) mainLabel = 'П1';
      else if (best === p2) mainLabel = 'П2';

      const chance1X = p1 + px;
      const chance2X = p2 + px;
      const chance12 = p1 + p2;
      let doubleLabel = '1X';
      let bestDouble = chance1X;
      if (chance2X > bestDouble) { doubleLabel = '2X'; bestDouble = chance2X; }
      if (chance12 > bestDouble) { doubleLabel = '12'; bestDouble = chance12; }

      outcomeHtml = `
        <div class="outcome-line">
          <span class="label">🏆 Прогноз</span>
          <span class="fav">${mainLabel} · ${best}%</span>
        </div>
        <div class="outcome-line double" style="margin-bottom:0;">
          <span class="label">🎯 Двойной шанс</span>
          <span class="fav">${doubleLabel} · ${bestDouble}%</span>
        </div>
      `;
    }

    html += `
      <div class="card ${cardClass(prob)} ${live ? 'card-live' : ''}" style="animation-delay: ${idx * 0.06}s;">
        <div class="card-header">
          <span class="${medalClass}">${medalText}</span>
          <div class="card-teams-block">
            <div class="card-team">${m.home}</div>
            <div class="card-team">${m.away}</div>
          </div>
        </div>
        <div class="card-meta">
          <div class="meta-item league">🏆 ${m.league}</div>
          <div class="meta-item">📅 ${m.time}</div>
          ${live ? '<div class="meta-item"><span class="live-badge">LIVE</span></div>' : ''}
        </div>
        <div class="card-stats">
          <div class="stat-box blue"><div class="label">Тотал</div><div class="value">${m.total}</div></div>
          <div class="stat-box green"><div class="label">Вероят.</div><div class="value">${prob}%</div></div>
          <div class="stat-box gold"><div class="label">Кэф</div><div class="value">${m.odd}</div></div>
        </div>
        ${outcomeHtml}
      </div>
    `;
  });
  content.innerHTML = html;
}

function renderYesterday(data) {
  const content = document.getElementById('content');

  let matches = [];
  let wins = 0, loses = 0, accuracy = 0, total = 0;
  let dateStr = '';
  let isYesterday = true;

  if (Array.isArray(data)) {
    matches = data;
    matches.forEach(m => { if (m.status === 'win') wins++; else if (m.status === 'lose') loses++; });
    total = wins + loses;
    accuracy = total > 0 ? Math.round(wins / total * 100) : 0;
  } else if (data && data.matches) {
    matches = data.matches || [];
    wins = data.wins || 0;
    loses = data.loses || 0;
    accuracy = data.accuracy || 0;
    total = data.total || 0;
    dateStr = data.date || '';
    isYesterday = data.isYesterday !== false;
  }

  if (!matches.length) {
    content.innerHTML = '<div class="empty">Вчера матчей не было</div>';
    return;
  }

  const titleText = isYesterday ? '✅ ВЧЕРА' : '📅 ПОСЛЕДНИЕ МАТЧИ';
  const subtitleText = isYesterday
    ? `${dateStr} · ${total} матчей`
    : `Последние ${total} матчей из архива`;

  let html = `
    <div class="section-title">${titleText}</div>
    <div class="section-sub">${subtitleText}</div>

    <div class="yesterday-summary">
      <div class="yesterday-stat win">
        <div class="ys-num">${wins}</div>
        <div class="ys-label">✅ Зашло</div>
      </div>
      <div class="yesterday-stat lose">
        <div class="ys-num">${loses}</div>
        <div class="ys-label">❌ Не зашло</div>
      </div>
      <div class="yesterday-stat acc">
        <div class="ys-num">${accuracy}%</div>
        <div class="ys-label">🎯 Точность</div>
      </div>
    </div>
  `;

  matches.forEach((m, idx) => {
    const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
    const cls = m.status === 'win' ? 'card-win' : m.status === 'lose' ? 'card-lose' : '';
    const winnerHtml = m.winner ? `<div class="winner-badge">🏆 ${m.winner}</div>` : '';

    html += `
      <div class="card ${cls}" style="animation-delay: ${idx * 0.06}s;">
        <div class="card-header">
          <div class="card-teams-block" style="padding-left:4px;">
            <div class="card-team">${m.home}</div>
            <div class="card-team">${m.away}</div>
          </div>
          <span style="font-size:20px;font-weight:900;font-family:'JetBrains Mono',monospace;color:var(--text);">${m.score || '—'}</span>
        </div>
        <div class="card-meta">
          <div class="meta-item league">🏆 ${m.league}</div>
          <div class="meta-item">⚽ ${m.total} голов</div>
          ${m.date ? `<div class="meta-item">📅 ${m.date}${m.time ? ' · ' + m.time : ''}</div>` : ''}
        </div>
        <div class="outcome-line" style="margin-bottom:0;">
          <span class="label">${emoji} Прогноз</span>
          <span class="fav">${m.prediction}</span>
        </div>
        ${winnerHtml}
      </div>
    `;
  });

  content.innerHTML = html;
}

function renderExpress(data) {
  const content = document.getElementById('content');
  if (!data || !data.matches || !data.matches.length) {
    content.innerHTML = '<div class="empty">Экспресс ещё не собран</div>';
    return;
  }
  let html = `
    <div class="express-hero">
      <div class="express-hero-title">🔥 ТОП-ЭКСПРЕСС</div>
      <div class="express-hero-sub">🎯 Все события на ТБ 2.5</div>
      <div class="express-hero-odd">${data.totalOdd}</div>
      <div class="express-hero-label">итоговый коэффициент</div>
    </div>
    <div class="express-items-title">📊 СОБЫТИЯ (${data.count})</div>
  `;
  data.matches.forEach((m, i) => {
    const prob = parseInt(m.probability) || 0;
    const oddNum = parseFloat(m.odd) || 1;
    html += `
      <div class="express-card" style="animation-delay: ${i * 0.08}s;">
        <div class="express-card-head">
          <span class="express-num">${i + 1}</span>
          <span class="express-match">${m.home} — ${m.away}</span>
        </div>
        <div class="express-league">🏆 ${m.league}</div>
        <div class="express-card-body">
          <div class="express-stat"><div class="express-stat-label">Тотал</div><div class="express-stat-value">${m.total}</div></div>
          <div class="express-stat"><div class="express-stat-label">Вероят.</div><div class="express-stat-value" style="color:${prob>=65?'var(--green)':'var(--gold)'}">${prob}%</div></div>
          <div class="express-stat"><div class="express-stat-label">Кэф</div><div class="express-odd">${oddNum.toFixed(2)}</div></div>
        </div>
      </div>
    `;
  });
  html += `
    <div class="express-footer">
      <div class="express-footer-row"><span>🎯 Стратегия</span><span>Тотал Больше 2.5</span></div>
      <div class="express-footer-row"><span>📊 Событий</span><span>${data.count}</span></div>
      <div class="express-footer-row"><span>💰 Общий кэф</span><span class="express-footer-odd">${data.totalOdd}</span></div>
    </div>
  `;
  content.innerHTML = html;
}

function renderStats(data) {
  if (!data) { document.getElementById('content').innerHTML = '<div class="empty">Статистики пока нет</div>'; return; }

  let html = `
    <div class="stats-wrap">
      <div class="stats-big">${data.accuracy}%</div>
      <div class="stats-label">Точность прогнозов</div>
      <div class="stats-grid">
        <div class="stats-box win clickable" onclick="openHistory('wins')">
          <span class="num">${data.wins}</span>
          <span class="name">✅ Зашло →</span>
        </div>
        <div class="stats-box lose clickable" onclick="openHistory('loses')">
          <span class="num">${data.loses}</span>
          <span class="name">❌ Не зашло →</span>
        </div>
      </div>
      <div class="stats-box clickable" onclick="openHistory('all')" style="margin-top:14px;">
        <span class="num">${data.total}</span>
        <span class="name">📈 Всего матчей →</span>
      </div>
  `;

  if (data.leagues && data.leagues.length) {
    html += `<div class="leagues-title">📊 ПО ЛИГАМ</div>`;
    data.leagues.forEach((lg, i) => {
      html += `
        <div class="league-item" style="animation-delay: ${i * 0.05}s;">
          <div class="league-name">🏆 ${lg.name}</div>
          <div class="league-stats">
            <span class="league-win">✅ ${lg.wins}</span>
            <span class="league-lose">❌ ${lg.loses}</span>
            <span class="league-acc">${lg.accuracy}%</span>
          </div>
        </div>
      `;
    });
  }

  html += `
      <div class="disclaimer">
        <div class="disclaimer-title">Важно</div>
        <div class="disclaimer-text">
          Все прогнозы — это <strong>сбор информации и аналитика</strong>. Они <strong>не являются гарантией победы</strong>. Играйте ответственно.
        </div>
      </div>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
}

async function openHistory(filter) {
  haptic('medium');
  const content = document.getElementById('content');
  content.innerHTML = showSkeleton();
  const titles = { wins: '✅ ЗАШЕДШИЕ', loses: '❌ НЕЗАШЕДШИЕ', all: '📋 ВСЕ МАТЧИ' };
  try {
    const resp = await fetch(`${API_URL}?action=history&filter=${filter}`);
    const raw = await resp.json();
    const data = Array.isArray(raw) ? raw : (raw.data || []);
    let html = `<button style="margin-bottom:16px;padding:9px 18px;border-radius:22px;font-size:12px;font-weight:700;background:var(--glass);color:var(--text-dim);border:1px solid var(--border-mid);cursor:pointer;font-family:inherit;backdrop-filter:blur(12px);" onclick="loadData()">← Назад</button>`;
    html += `<div class="section-title">${titles[filter]}</div>`;
    html += `<div class="section-sub">Найдено: ${data.length}</div>`;
    if (!data.length) {
      html += '<div class="empty">Пока нет матчей</div>';
    } else {
      data.forEach((m, idx) => {
        const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
        const winnerHtml = m.winner ? `<div class="winner-badge">🏆 ${m.winner}</div>` : '';
        html += `
          <div class="card" style="animation-delay: ${idx * 0.05}s;">
            <div class="card-header">
              <div class="card-teams-block" style="padding-left:4px;">
                <div class="card-team">${m.home}</div>
                <div class="card-team">${m.away}</div>
              </div>
              <span style="font-size:20px;font-weight:900;font-family:'JetBrains Mono',monospace;">${m.score || '—'}</span>
            </div>
            <div class="card-meta">
              <div class="meta-item league">🏆 ${m.league}</div>
              ${m.date ? `<div class="meta-item">📅 ${m.date}${m.time ? ' · ' + m.time : ''}</div>` : ''}
              <div class="meta-item">⚽ ${m.total}</div>
            </div>
            <div class="outcome-line" style="margin-bottom:0;">
              <span class="label">${emoji} ${m.prediction}</span>
              <span class="fav">${emoji}</span>
            </div>
            ${winnerHtml}
          </div>
        `;
      });
    }
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

loadData();
