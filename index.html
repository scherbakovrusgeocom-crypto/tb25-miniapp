<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOTAL 2.5 PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #050811;
    --bg-card: rgba(14, 22, 38, 0.85);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --neon-green: #00f59b;
    --neon-amber: #ffb800;
    --neon-rose: #ff3366;
    --radius-card: 20px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 90px;
    background-image: 
      radial-gradient(circle at 10% 0%, rgba(0, 245, 155, 0.1) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255, 184, 0, 0.08) 0%, transparent 40%);
    background-attachment: fixed;
  }

  /* Загрузка */
  #loader {
    position: fixed;
    inset: 0;
    background: var(--bg-main);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.3s;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(0, 245, 155, 0.2);
    border-top-color: var(--neon-green);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Шапка */
  header {
    padding: 24px 20px 16px;
  }
  .brand-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--neon-green);
    background: rgba(0, 245, 155, 0.1);
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid rgba(0, 245, 155, 0.3);
    margin-bottom: 12px;
  }
  .brand-dot {
    width: 6px; height: 6px; background: var(--neon-green); border-radius: 50%;
    box-shadow: 0 0 8px var(--neon-green);
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 40%, var(--neon-green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Кнопка бонуса */
  .bonus-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 16px 20px;
    padding: 16px;
    background: linear-gradient(135deg, #ffb800, #ff8800);
    color: #050811;
    font-weight: 900;
    font-size: 13px;
    text-decoration: none;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(255, 184, 0, 0.3);
  }
  .bonus-btn:active { transform: scale(0.97); }

  /* Контент */
  main {
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Карточка матча */
  .match-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    animation: slideUp 0.4s ease both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .league-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.05);
    padding: 4px 10px;
    border-radius: 8px;
  }
  .match-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--neon-amber);
  }

  .teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 10px;
  }
  .team {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.2;
    flex: 1;
  }
  .team.home { text-align: left; }
  .team.away { text-align: right; }
  .vs {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    padding: 4px 8px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 6px;
  }

  .prob-section {
    margin-bottom: 14px;
  }
  .prob-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .prob-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 800;
    color: var(--neon-green);
  }
  .prob-bar-bg {
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 100px;
    overflow: hidden;
  }
  .prob-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ba78, var(--neon-green));
    border-radius: 100px;
    transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 14px;
    border-top: 1px solid var(--border-color);
  }
  .odd-display {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .odd-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
  }
  .odd-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 900;
    color: var(--neon-green);
  }

  /* Навигация снизу */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(5, 8, 17, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-color);
    display: flex;
    padding: 10px 10px 20px;
    z-index: 100;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
    transition: color 0.2s;
  }
  .nav-item.active { color: var(--neon-green); }
  .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }

  /* Пустое состояние */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>

<header>
  <div class="brand-tag"><div class="brand-dot"></div> AI PREDICTION HUB</div>
  <h1>TOTAL 2.5 PRO</h1>
</header>

<a href="https://baltbet.ru/account/register?refpromo=1221753" target="_blank" class="bonus-btn">
  🎁 ЗАБРАТЬ БОНУС ДНЯ
</a>

<main id="app">
  <!-- Сюда рендерятся матчи -->
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="today" onclick="switchTab('today')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <span>Сегодня</span>
  </button>
  <button class="nav-item" data-tab="express" onclick="switchTab('express')">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <span>Экспресс</span>
  </button>
  <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span>Вчера</span>
  </button>
</nav>

<script>
// === НАСТРОЙКИ ===
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';
const MIN_PROBABILITY = 57;
let currentTab = 'today';

// Инициализация Telegram WebApp
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Словарь перевода команд
const TEAM_TRANSLATIONS = {
  'arsenal': 'Арсенал', 'chelsea': 'Челси', 'liverpool': 'Ливерпуль', 'manchester city': 'Манчестер Сити',
  'manchester united': 'Манчестер Юнайтед', 'tottenham': 'Тоттенхэм', 'newcastle': 'Ньюкасл',
  'real madrid': 'Реал Мадрид', 'barcelona': 'Барселона', 'atletico madrid': 'Атлетико Мадрид',
  'bayern munich': 'Бавария', 'borussia dortmund': 'Боруссия Дортмунд', 'bayer leverkusen': 'Байер',
  'juventus': 'Ювентус', 'inter': 'Интер', 'milan': 'Милан', 'napoli': 'Наполи', 'roma': 'Рома',
  'psg': 'ПСЖ', 'marseille': 'Марсель', 'monaco': 'Монако', 'sporting': 'Спортинг', 'benfica': 'Бенфика', 'porto': 'Порту'
};

function translateTeam(name) {
  if (!name) return '';
  const key = String(name).trim().toLowerCase();
  return TEAM_TRANSLATIONS[key] || name;
}

// === ЛОГИКА ===
async function loadData() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="empty">Загрузка данных...</div>';

  const action = currentTab === 'stats' ? 'yesterday' : currentTab;
  
  try {
    const response = await fetch(`${API_URL}?action=${action}&_t=${Date.now()}`);
    const result = await response.json();
    const data = result.data !== undefined ? result.data : result;
    
    render(data);
  } catch (error) {
    app.innerHTML = '<div class="empty">⚠️ Ошибка сети. Проверьте соединение.</div>';
  }
}

function render(data) {
  const app = document.getElementById('app');
  
  if (currentTab === 'today') {
    const matches = Array.isArray(data) ? data : [];
    const filtered = matches.filter(m => parseInt(m.probability) >= MIN_PROBABILITY);
    
    if (!filtered.length) {
      app.innerHTML = '<div class="empty">На сегодня нет подходящих матчей (ТБ > 2.5).</div>';
      return;
    }

    app.innerHTML = filtered.map((m, i) => {
      const prob = parseInt(m.probability) || 0;
      return `
        <div class="match-card" style="animation-delay: ${i * 0.05}s">
          <div class="card-header">
            <span class="league-name">${m.league || 'Турнир'}</span>
            <span class="match-time">${m.time || 'Сегодня'}</span>
          </div>
          <div class="teams">
            <div class="team home">${translateTeam(m.home)}</div>
            <div class="vs">VS</div>
            <div class="team away">${translateTeam(m.away)}</div>
          </div>
          <div class="prob-section">
            <div class="prob-labels">
              <span>Вероятность ТБ 2.5</span>
              <span class="prob-value">${prob}%</span>
            </div>
            <div class="prob-bar-bg">
              <div class="prob-bar-fill" style="width: ${prob}%"></div>
            </div>
          </div>
          <div class="card-footer">
            <div class="odd-display">
              <span class="odd-label">КФ:</span>
              <span class="odd-value">${m.odd || '1.80'}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }
  
  else if (currentTab === 'express') {
    const matches = data.matches || [];
    if (!matches.length) {
      app.innerHTML = '<div class="empty">Экспресс на сегодня еще не сформирован.</div>';
      return;
    }
    
    let totalOdd = 1;
    matches.forEach(m => totalOdd *= parseFloat(m.odd || 1));
    
    app.innerHTML = `
      <div class="match-card" style="background: linear-gradient(135deg, rgba(255,184,0,0.1), var(--bg-card));">
        <div style="text-align: center; margin-bottom: 15px;">
          <div style="font-size: 12px; color: var(--neon-amber); font-weight: 800; letter-spacing: 1px;">ЭКСПРЕСС ДНЯ</div>
          <div style="font-size: 42px; font-weight: 900; font-family: 'JetBrains Mono'; color: #fff;">${totalOdd.toFixed(2)}</div>
        </div>
        ${matches.map(m => `
          <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px;">
            <div>
              <div style="font-weight: 800;">${translateTeam(m.home)} — ${translateTeam(m.away)}</div>
              <div style="font-size: 10px; color: var(--text-muted);">${m.league}</div>
            </div>
            <div style="font-weight: 800; color: var(--neon-green);">${m.odd}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  else if (currentTab === 'stats') {
    const wins = data.wins || 0;
    const loses = data.loses || 0;
    const accuracy = data.accuracy || 0;
    
    app.innerHTML = `
      <div class="match-card" style="text-align: center; padding: 30px 20px;">
        <div style="font-size: 48px; font-weight: 900; font-family: 'JetBrains Mono'; color: var(--neon-green);">${accuracy}%</div>
        <div style="font-size: 12px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-top: 5px;">Точность</div>
        
        <div style="display: flex; gap: 10px; margin-top: 25px;">
          <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px;">
            <div style="font-size: 20px; font-weight: 800; color: var(--neon-green);">${wins}</div>
            <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">ЗАШЛО</div>
          </div>
          <div style="flex: 1; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px;">
            <div style="font-size: 20px; font-weight: 800; color: var(--neon-rose);">${loses}</div>
            <div style="font-size: 10px; color: var(--text-muted); margin-top: 4px;">НЕ ЗАШЛО</div>
          </div>
        </div>
      </div>
    `;
  }
}

function switchTab(tab) {
  if (tg) tg.HapticFeedback.impactOccurred('light');
  currentTab = tab;
  
  // Меняем активную кнопку
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  
  loadData();
}

// Запуск
window.addEventListener('load', () => {
  // Скрываем лоадер
  setTimeout(() => {
    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    setTimeout(() => loader.remove(), 300);
  }, 500);

  loadData();
});
</script>

</body>
</html>
