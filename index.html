<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Аналитика Total 2.5 PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #03060a;
  --surface: rgba(15, 23, 42, 0.5);
  --surface-solid: #0f172a;
  --surface-hi: rgba(30, 41, 59, 0.7);
  --border: rgba(255, 255, 255, 0.05);
  --border-hi: rgba(16, 185, 129, 0.3);
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-mute: #64748b;
  --mint: #10b981;
  --mint-glow: rgba(16, 185, 129, 0.35);
  --gold: #fbbf24;
  --gold-glow: rgba(251, 191, 36, 0.35);
  --danger: #f43f5e;
  --danger-glow: rgba(244, 63, 94, 0.3);
  --radius: 24px;
  --radius-sm: 16px;
  --nav-h: 76px;
}
body.light-theme {
  --bg: #f1f5f9;
  --surface: rgba(255, 255, 255, 0.7);
  --surface-solid: #ffffff;
  --surface-hi: rgba(241, 245, 249, 0.9);
  --border: rgba(0, 0, 0, 0.05);
  --text: #0f172a;
  --text-dim: #475569;
  --text-mute: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 0 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
  transition: background 0.3s ease, color 0.3s ease;
  background-image: 
    radial-gradient(circle at 15% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(251, 191, 36, 0.05) 0%, transparent 40%);
}
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-mute); border-radius: 10px; opacity: 0.3; }

/* ---------- ШАПКА ---------- */
.header { position: relative; padding: 36px 20px 16px; text-align: center; }
.header-top { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
.icon-btn {
  width: 44px; height: 44px;
  background: var(--surface); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: 50%;
  color: var(--text-dim); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s ease;
}
.icon-btn:active { transform: scale(0.92); color: var(--mint); border-color: var(--mint); }
.icon-btn svg { width: 20px; height: 20px; stroke-width: 2.5; }
.icon-btn.spinning svg { animation: spin 0.9s linear infinite; color: var(--mint); }
@keyframes spin { 100% { transform: rotate(360deg); } }

.header-title {
  font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1.15;
  background: linear-gradient(135deg, #34d399 0%, var(--mint) 40%, var(--gold) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.header-sub {
  font-size: 11px; letter-spacing: 4px; color: var(--text-mute);
  text-transform: uppercase; font-weight: 800;
}

/* СЧЕТЧИК БЕЗ ПРОЦЕНТОВ */
.daily-summary {
  margin-top: 20px; font-size: 13px; font-weight: 600; color: var(--text-dim);
  background: var(--surface); padding: 12px 20px; border-radius: 100px; display: inline-block; border: 1px solid var(--border);
  backdrop-filter: blur(10px);
}
.daily-summary b { color: var(--mint); font-family: 'JetBrains Mono', monospace; font-size: 16px; margin: 0 4px; }

/* Чипы лиг */
.league-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px 16px; scrollbar-width: none; }
.league-chips::-webkit-scrollbar { display: none; }
.league-chip {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px; font-size: 12px; font-weight: 700; color: var(--text-dim);
  cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
  backdrop-filter: blur(10px);
}
.league-chip.active { background: var(--mint); color: #fff; border-color: var(--mint); box-shadow: 0 4px 15px var(--mint-glow); }

#content { padding: 0 20px 20px; }

/* ---------- КАРТОЧКА МАТЧА ---------- */
.match-card {
  background: var(--surface); backdrop-filter: blur(24px);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
  position: relative; overflow: hidden;
  animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.match-card.is-top {
  background: linear-gradient(180deg, rgba(251, 191, 36, 0.1) 0%, var(--surface) 100%);
  border-color: rgba(251, 191, 36, 0.4);
  box-shadow: 0 8px 40px rgba(251, 191, 36, 0.15);
}
.match-card.is-top::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), #fcd34d); }
.match-card.is-mid::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--mint); }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.card-teams { display: flex; flex-direction: column; gap: 6px; }
.team-name { font-size: 16px; font-weight: 800; line-height: 1.3; letter-spacing: -0.3px; }
.team-name.away { color: var(--text-dim); }

.card-prob-block { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
.card-prob-val { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 900; line-height: 1; }
.is-top .card-prob-val { color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
.is-mid .card-prob-val { color: var(--mint); text-shadow: 0 0 20px var(--mint-glow); }
.card-prob-label { font-size: 10px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

/* СВЕТОФОР */
.traffic-light { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-hi); }
.tl-dot.active-green { background: var(--mint); box-shadow: 0 0 10px var(--mint-glow); }
.tl-dot.active-yellow { background: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
.tl-dot.active-red { background: var(--danger); box-shadow: 0 0 10px var(--danger-glow); }
.tl-text { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

.card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.meta-item { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 8px; background: var(--surface-hi); color: var(--text-dim); border: 1px solid var(--border); }
.meta-item.league { color: var(--mint); background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); }
.meta-item.time { color: var(--gold); font-family: 'JetBrains Mono', monospace; }
.meta-item.live { color: var(--danger); background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3); animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

.card-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
.card-odd-block { display: flex; align-items: center; gap: 8px; }
.odd-label { font-size: 11px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; }
.odd-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 900; color: var(--gold); }

.action-btn {
  background: var(--surface-hi); border: 1px solid var(--border);
  color: var(--text-dim); width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.2s; margin-left: auto;
}
.action-btn:active { transform: scale(0.9); color: var(--mint); border-color: var(--mint); }
.action-btn svg { width: 18px; height: 18px; }

/* Бонус */
.bonus-btn {
  display: block; width: 100%; padding: 16px; background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #000; font-weight: 900; text-align: center; border-radius: 16px; margin: 24px 0 10px;
  text-decoration: none; box-shadow: 0 8px 25px rgba(251, 191, 36, 0.3);
  font-size: 15px; letter-spacing: 0.5px;
}

/* Лиги (Аккордеон) */
.league-accordion {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); margin-bottom: 14px; overflow: hidden;
  backdrop-filter: blur(20px);
}
.league-acc-header {
  padding: 18px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: background 0.2s;
}
.league-acc-header:active { background: var(--surface-hi); }
.league-acc-title { font-size: 15px; font-weight: 800; }
.league-acc-count { font-size: 12px; color: var(--text-mute); font-weight: 600; background: var(--surface-hi); padding: 4px 10px; border-radius: 8px; }
.league-acc-content {
  display: none; padding: 0 18px 18px; border-top: 1px solid var(--border);
}
.league-acc-content.open { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.league-acc-match {
  display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border);
}
.league-acc-match:last-child { border-bottom: none; }
.acc-match-teams { font-size: 13px; font-weight: 700; color: var(--text); }
.acc-match-prob { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 900; color: var(--mint); }

/* Экспресс */
.express-hero {
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  border-radius: var(--radius); padding: 36px 20px; text-align: center; margin-bottom: 24px;
  border: 1px solid rgba(99, 102, 241, 0.4); box-shadow: 0 15px 50px rgba(99, 102, 241, 0.25);
}
.express-title { font-size: 13px; font-weight: 800; color: #a5b4fc; letter-spacing: 4px; text-transform: uppercase; }
.express-odd { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 900; color: #fff; line-height: 1; margin: 16px 0; }
.express-sub { font-size: 13px; color: #818cf8; font-weight: 700; }

.express-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 18px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.express-item-left { display: flex; flex-direction: column; gap: 4px; }
.express-item-teams { font-weight: 800; font-size: 14px; }
.express-item-league { font-size: 11px; color: var(--text-mute); font-weight: 600; }
.express-item-right { text-align: right; }
.express-item-prob { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 900; color: var(--mint); }
.express-item-odd { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 800; color: var(--gold); margin-top: 4px; }

/* Статистика */
.stats-hero { text-align: center; margin: 24px 0 32px; }
.stats-big { font-family: 'JetBrains Mono', monospace; font-size: 72px; font-weight: 900; line-height: 1; color: var(--text); }
.stats-sub { font-size: 12px; color: var(--text-dim); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px; }

.week-block {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.week-date { font-size: 15px; font-weight: 800; color: var(--mint); }
.week-count { font-size: 12px; color: var(--text-mute); font-weight: 600; }
.week-stats-row { display: flex; gap: 10px; margin-bottom: 14px; }
.week-stat-box { flex: 1; background: var(--surface-hi); border-radius: 12px; padding: 12px; text-align: center; border: 1px solid var(--border); }
.week-stat-label { font-size: 10px; font-weight: 800; color: var(--text-mute); text-transform: uppercase; }
.week-stat-val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 800; margin-top: 4px; }
.week-match-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 10px 0; border-bottom: 1px solid var(--border); color: var(--text-dim); }
.week-match-row:last-child { border-bottom: none; }
.week-match-score { font-family: 'JetBrains Mono', monospace; font-weight: 800; color: var(--text); }

/* Скелетон */
.skeleton { background: var(--surface); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; height: 160px; position: relative; overflow: hidden; }
.skeleton::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent); animation: shimmer 1.5s infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.empty { text-align: center; padding: 60px 20px; color: var(--text-mute); font-weight: 600; }
.empty-icon { font-size: 52px; margin-bottom: 20px; opacity: 0.3; }
.empty-btn { margin-top: 24px; padding: 16px 32px; background: var(--mint); color: #fff; border: none; border-radius: 100px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; }
.empty-btn:active { transform: scale(0.96); }

.sync-line { text-align: center; font-size: 11px; color: var(--text-mute); font-weight: 600; margin-top: 24px; padding: 0 20px; line-height: 1.6; }

/* Нижняя навигация */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
  background: rgba(3, 6, 10, 0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-top: 1px solid var(--border); display: flex; align-items: stretch; z-index: 50;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body.light-theme .bottom-nav { background: rgba(255, 255, 255, 0.9); }
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  padding: 8px 2px; background: none; border: none; color: var(--text-mute); font-size: 10px; font-weight: 800;
  cursor: pointer; transition: color 0.2s; font-family: inherit;
}
.nav-btn svg { width: 22px; height: 22px; stroke-width: 2.2; transition: transform 0.2s; }
.nav-btn.active { color: var(--mint); }
.nav-btn.active svg { transform: translateY(-2px); filter: drop-shadow(0 0 8px var(--mint-glow)); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="icon-btn" id="refreshBtn" onclick="manualRefresh()" title="Обновить данные">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </div>
    <div class="icon-btn" onclick="toggleTheme()" title="Тема">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </div>
  </div>
  
  <div class="header-title">АНАЛИТИКА TOTAL 2.5 PRO</div>

  <!-- СЧЕТЧИК БЕЗ ПРОЦЕНТОВ -->
  <div class="daily-summary" id="dailySummary" style="display:none;">
    Сегодня найдено <b id="summaryCount">0</b> матчей
  </div>
</div>

<div class="league-chips" id="leagueChips" style="display:none;"></div>

<div id="content"></div>
<div class="sync-line" id="syncLine"></div>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn active" data-nav="matches">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>

  </button>
  <button class="nav-btn" data-nav="leagues">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>

  <button class="nav-btn" data-nav="express">

    <span>Экспресс</span>
  </button>
</nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';
const BONUS_URL = 'https://baltbet.ru/account/register?refpromo=1221753';
const CACHE_VERSION = 'v97'; // Сброс кэша
const CACHE_TTL = 5 * 60 * 1000;
const MIN_PROBABILITY = 57;

let currentNav = 'matches';
let currentLeague = 'all';
let todayData = [];

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- ТЕМА ---------- */
function initTheme() {
  var saved = localStorage.getItem('tb25_theme') || 'dark';
  if (saved === 'light') document.body.classList.add('light-theme');
  updateThemeIcon(saved);
}
function toggleTheme() {
  haptic('medium');
  var isLight = document.body.classList.toggle('light-theme');
  var theme = isLight ? 'light' : 'dark';
  localStorage.setItem('tb25_theme', theme);
  updateThemeIcon(theme);
}
function updateThemeIcon(theme) {
  var icon = document.getElementById('themeIcon');
  if (!icon) return;
  if (theme === 'light') icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  else icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}
initTheme();

function haptic(s) {
  if (tg && tg.HapticFeedback) try {
    if (s === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (s === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e){}
}

function showToast(text) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:calc(var(--nav-h) + 20px);left:20px;right:20px;background:var(--surface-solid);color:var(--text);padding:16px 20px;border-radius:16px;font-size:13px;font-weight:600;text-align:center;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,0.3);border:1px solid var(--border);';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function() { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; }, 2700);
  setTimeout(function() { el.remove(); }, 3000);
}

/* ---------- ФОРМАТ ---------- */
function formatDate(d) {
  if (!d) return '';
  if (d instanceof Date) {
    if (isNaN(d.getTime())) return '';
    return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear();
  }
  var s = String(d).trim();
  if (!s) return '';
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[3] + '.' + m[2] + '.' + m[1];
  m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})/);
  if (m) return m[1] + '.' + m[2] + '.' + m[3];
  return s;
}
function formatShortDate(d) {
  if (!d) return '';
  var s = formatDate(d);
  var m = s.match(/^(\d{2}\.\d{2})/);
  return m ? m[1] : s;
}
function todayShort() { return formatShortDate(new Date()); }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  if (str instanceof Date) {
    if (isNaN(str.getTime())) return '';
    return String(str.getDate()).padStart(2, '0') + '.' + String(str.getMonth() + 1).padStart(2, '0') + '.' + str.getFullYear();
  }
  return String(str).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function escapeAttr(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

/* ---------- НАВИГАЦИЯ ---------- */
function switchNav(nav) {
  haptic('medium');
  currentNav = nav;
  currentLeague = 'all';
  document.querySelectorAll('.nav-btn').forEach(function(n) { n.classList.toggle('active', n.dataset.nav === nav); });
  
  document.getElementById('dailySummary').style.display = (nav === 'matches') ? 'inline-block' : 'none';
  document.getElementById('leagueChips').style.display = (nav === 'matches') ? 'flex' : 'none';
  
  loadData();
}

function switchLeague(league) {
  haptic('light');
  currentLeague = league;
  if (currentNav === 'matches') renderMatchesList();
}

document.getElementById('bottomNav').addEventListener('click', function(e) {
  var btn = e.target.closest('.nav-btn');
  if (btn) switchNav(btn.dataset.nav);
});

/* ---------- КЭШ ---------- */
function getCache(key) {
  try { var r = localStorage.getItem('tb25_' + CACHE_VERSION + '_' + key); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function setCache(key, version, data) {
  try {
    localStorage.setItem('tb25_' + CACHE_VERSION + '_' + key, JSON.stringify({ version: version, data: data, ts: Date.now() }));
    localStorage.setItem('tb25_last_update', new Date().toISOString());
  } catch(e){}
}
function updateSyncLine() {
  var el = document.getElementById('syncLine');
  if (!el) return;
  try {
    var iso = localStorage.getItem('tb25_last_update');
    if (!iso) { el.innerHTML = '🕐 Новые матчи — ежедневно ~01:00 МСК'; return; }
    var d = new Date(iso);
    var diffMin = Math.floor((new Date() - d) / 60000);
    var ago = diffMin < 1 ? 'только что' : diffMin < 60 ? diffMin + ' мин назад' : Math.floor(diffMin / 60) + ' ч назад';
    el.innerHTML = '🕐 Обновлено: ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' (' + ago + ')<br><span style="opacity:0.6;font-size:10px;">Новые матчи — ежедневно ~01:00 МСК</span>';
  } catch(e) { el.textContent = ''; }
}

/* ---------- ЗАГРУЗКА ---------- */
function showSkeleton() {
  return '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
}

async function fetchAction(action) {
  var url = API_URL + '?action=' + action + '&_t=' + Date.now();
  var resp = await fetch(url, { cache: 'no-store' });
  var text = await resp.text();
  var result;
  try { result = JSON.parse(text); }
  catch (e) { throw new Error('Сервер вернул не JSON'); }
  if (result.error) throw new Error(result.error);
  return result.data !== undefined ? result.data : result;
}

async function loadData(forceNetwork) {
  if (forceNetwork === undefined) forceNetwork = false;
  var content = document.getElementById('content');
  var key = currentNav;
  // ✅ ИСПРАВЛЕНИЕ: для 'stats' запрашиваем 'yesterday', для 'leagues' — 'leagues'
  var action = currentNav === 'stats' ? 'yesterday' : (currentNav === 'leagues' ? 'leagues' : currentNav);

  var cached = !forceNetwork ? getCache(key) : null;
  if (cached) {
    renderByNav(cached.data);
    updateSyncLine();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = showSkeleton();
  }
  
  try {
    var data = await fetchAction(action);
    setCache(key, '1', data);
    renderByNav(data);
    updateSyncLine();
  } catch (e) {
    console.error('Error ->', e);
    if (!cached) {
      content.innerHTML = '<div class="empty"><div class="empty-icon">⚠</div>Не удалось загрузить данные<br><div style="font-size:11px;margin-top:8px;opacity:0.6;">' + escapeHtml(e.message) + '</div><button class="empty-btn" onclick="manualRefresh()">Повторить</button></div>';
    }
  }
}

async function updateCounters() {
  try {
    var results = await Promise.all([ fetchAction('today').catch(function() { return []; }) ]);
    var fetchedData = Array.isArray(results[0]) ? results[0] : [];
    var cntT = fetchedData.filter(function(m) { return (parseInt(m.probability) || 0) >= MIN_PROBABILITY; }).length;
    document.getElementById('summaryCount').textContent = cntT;
    document.getElementById('dailySummary').style.display = 'inline-block';
  } catch(e) { console.warn('counters error', e); }
}

function renderByNav(data) {
  if (currentNav === 'matches') {
    var arr = Array.isArray(data) ? data : [];
    todayData = arr;
    renderMatchesList();
  }
  else if (currentNav === 'leagues') renderLeagues(data);
  else if (currentNav === 'stats') renderStats(data);
  else if (currentNav === 'express') renderExpress(data);
}

function manualRefresh() {
  haptic('medium');
  var btn = document.getElementById('refreshBtn');
  if (btn) btn.classList.add('spinning');
  try {
    Object.keys(localStorage).forEach(function(k) { if (k.indexOf('tb25_' + CACHE_VERSION + '_') === 0) localStorage.removeItem(k); });
  } catch(e){}
  loadData(true).finally(function() {
    updateCounters();
    if (btn) setTimeout(function() { btn.classList.remove('spinning'); }, 500);
    showToast('🔄 Данные перечитаны');
  });
}

/* ---------- СВЕТОФОР ---------- */
function getTrafficLight(prob) {
  if (prob >= 75) return { color: 'green', text: 'Сильный' };
  if (prob >= 65) return { color: 'yellow', text: 'Хороший' };
  return { color: 'red', text: 'Базовый' };
}

/* ---------- МАТЧИ ---------- */
function renderMatchesList() {
  var content = document.getElementById('content');
  var chipsEl = document.getElementById('leagueChips');
  var raw = todayData;
  
  var filtered = raw.filter(function(m) { return (parseInt(m.probability) || 0) >= MIN_PROBABILITY; });

  var leagueCounts = {};
  filtered.forEach(function(m) {
    var lg = m.league || 'Лига';
    leagueCounts[lg] = (leagueCounts[lg] || 0) + 1;
  });
  var leagues = Object.keys(leagueCounts).sort(function(a, b) { return leagueCounts[b] - leagueCounts[a]; });

  if (leagues.length > 1) {
    chipsEl.style.display = 'flex';
    var chipsHtml = '<div class="league-chip ' + (currentLeague === 'all' ? 'active' : '') + '" onclick="switchLeague(\'all\')">Все<span class="cnt">' + filtered.length + '</span></div>';
    leagues.forEach(function(lg) {
      chipsHtml += '<div class="league-chip ' + (currentLeague === lg ? 'active' : '') + '" onclick="switchLeague(\'' + escapeAttr(lg) + '\')">' + escapeHtml(lg) + '<span class="cnt">' + leagueCounts[lg] + '</span></div>';
    });
    chipsEl.innerHTML = chipsHtml;
  } else {
    chipsEl.style.display = 'none';
  }

  var list = currentLeague === 'all' ? filtered : filtered.filter(function(m) { return (m.league || 'Лига') === currentLeague; });

  if (!list.length) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">⚽</div>Нет матчей с вероятностью не ниже ' + MIN_PROBABILITY + '%<br><div style="font-size:12px;margin-top:10px;opacity:0.6;">Попробуйте «Обновить» или загляните позже</div><button class="empty-btn" onclick="manualRefresh()">Обновить</button></div>';
    return;
  }

  var sorted = list.sort(function(a, b) { return (parseInt(b.probability) || 0) - (parseInt(a.probability) || 0); });
  var html = '';
  
  sorted.forEach(function(m, i) {
    var prob = parseInt(m.probability) || 0;
    var isTop = prob >= 75;
    var cardClass = isTop ? 'is-top' : 'is-mid';
    var shortDate = formatShortDate(m.date);
    var isLive = String(m.result || '').toLowerCase().indexOf('live') >= 0;
    var tl = getTrafficLight(prob);

    html += '<div class="match-card ' + cardClass + '" style="animation-delay:' + (i * 0.05) + 's">';
    
    html += '<div class="card-top">';
    html += '<div class="card-teams">';
    html += '<div class="team-name">' + escapeHtml(m.home) + '</div>';
    html += '<div class="team-name away">' + escapeHtml(m.away) + '</div>';
    html += '</div>';
    
    html += '<div class="card-prob-block">';
    html += '<div class="card-prob-val">' + prob + '%</div>';
    html += '<div class="traffic-light"><div class="tl-dot active-' + tl.color + '"></div><span class="tl-text" style="color:var(--' + (tl.color === 'green' ? 'mint' : tl.color === 'yellow' ? 'gold' : 'danger') + ')">' + tl.text + '</span></div>';
    html += '</div>';
    html += '</div>';

    html += '<div class="card-meta">';
    html += '<div class="meta-item league">' + escapeHtml(m.league || 'Лига') + '</div>';
    html += '<div class="meta-item">' + escapeHtml(m.source || 'API') + '</div>';
    if (shortDate) html += '<div class="meta-item">' + escapeHtml(shortDate) + '</div>';
    if (isLive) html += '<div class="meta-item live">🔴 LIVE</div>';
    else if (m.time) html += '<div class="meta-item time">' + escapeHtml(m.time) + '</div>';
    html += '</div>';

    html += '<div class="card-bottom">';
    html += '<div class="card-odd-block"><span class="odd-label">Кэф</span><span class="odd-value">' + escapeHtml(m.odd || '—') + '</span></div>';
    html += '<div class="action-btn" onclick="shareMatch(\'' + escapeAttr(JSON.stringify({h: m.home, a: m.away, p: prob, o: m.odd})) + '\')">';
    html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
    html += '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  content.innerHTML = html;
}

function shareMatch(jsonStr) {
  haptic('medium');
  try {
    var m = JSON.parse(jsonStr);
    var text = '🔥 Прогноз на ТБ 2.5:\n' + m.h + ' — ' + m.a + '\nВероятность: ' + m.p + '%\nКэф: ' + m.o;
    if (tg) {
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/total25_signals_bot') + '&text=' + encodeURIComponent(text));
    } else {
      window.open('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/total25_signals_bot') + '&text=' + encodeURIComponent(text), '_blank');
    }
  } catch(e) {}
}

/* ---------- ЛИГИ (АККОРДЕОН) ---------- */
function renderLeagues(data) {
  var content = document.getElementById('content');
  var list = Array.isArray(data) ? data : [];

  if (!list.length) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">🏆</div>Пока нет лиг с матчами не ниже ' + MIN_PROBABILITY + '%<br><button class="empty-btn" onclick="manualRefresh()">Обновить</button></div>';
    return;
  }

  var html = '<div class="stats-hero"><div class="stats-big" style="font-size:56px">' + list.length + '</div><div class="stats-sub">Активных лиг</div></div>';
  
  list.forEach(function(lg, idx) {
    html += '<div class="league-accordion">';
    html += '<div class="league-acc-header" onclick="toggleLeagueAccordion(' + idx + ')">';
    html += '<div style="display:flex; align-items:center; gap:8px;">';
    html += '<div class="league-acc-title">' + escapeHtml(lg.name) + '</div>';
    html += '<div class="league-acc-count">' + lg.total + ' матчей</div>';
    html += '</div>';
    html += '<svg id="arrow_' + idx + '" style="width:20px; height:20px; transition:transform 0.2s;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
    html += '</div>';
    
    html += '<div class="league-acc-content" id="content_' + idx + '">';
    (lg.matches || []).sort((a, b) => b.prob - a.prob).forEach(function(m) {
      html += '<div class="league-acc-match">';
      html += '<div><div class="acc-match-teams">' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div><div class="acc-match-time">' + escapeHtml(m.time) + '</div></div>';
      html += '<div style="text-align:right;"><div class="acc-match-prob">' + m.prob + '%</div><div style="font-size:11px; color:var(--gold); font-family:JetBrains Mono; font-weight:800;">' + escapeHtml(m.odd || '—') + '</div></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
  });
  
  content.innerHTML = html;
}

function toggleLeagueAccordion(idx) {
  haptic('light');
  var content = document.getElementById('content_' + idx);
  var arrow = document.getElementById('arrow_' + idx);
  if (!content) return;
  if (content.classList.contains('open')) {
    content.classList.remove('open');
    arrow.style.transform = 'rotate(0deg)';
  } else {
    content.classList.add('open');
    arrow.style.transform = 'rotate(180deg)';
  }
}

/* ---------- СТАТИСТИКА ---------- */
function renderStats(data) {
  var content = document.getElementById('content');
  if (!data || (!data.matches && !data.weeks)) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">📊</div>Пока нет завершенных матчей для статистики</div>';
    return;
  }
  
  var wins = data.wins || 0, loses = data.loses || 0, accuracy = data.accuracy || 0;
  var html = '<div class="stats-hero"><div class="stats-big">' + accuracy + '%</div><div class="stats-sub">Общая точность</div></div>';
  
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;">';
  html += '<div class="league-accordion" style="align-items:center;padding:20px;text-align:center;"><div style="font-size:32px;font-weight:900;color:var(--mint);font-family:JetBrains Mono">' + wins + '</div><div style="font-size:11px;color:var(--text-mute);font-weight:800;letter-spacing:1px;margin-top:6px;">ЗАШЛО</div></div>';
  html += '<div class="league-accordion" style="align-items:center;padding:20px;text-align:center;"><div style="font-size:32px;font-weight:900;color:var(--danger);font-family:JetBrains Mono">' + loses + '</div><div style="font-size:11px;color:var(--text-mute);font-weight:800;letter-spacing:1px;margin-top:6px;">НЕ ЗАШЛО</div></div>';
  html += '</div>';

  html += '<a href="' + BONUS_URL + '" target="_blank" class="bonus-btn">🎁 ПОЛУЧИТЬ БОНУС</a>';

  if (data.weeks && Array.isArray(data.weeks)) {
    data.weeks.forEach(function(wk) {
      html += '<div class="week-block">';
      html += '<div class="week-header"><div class="week-date">📅 ' + wk.dateRange + '</div><div class="week-count">Матчей: ' + wk.total + '</div></div>';
      html += '<div class="week-stats-row">';
      html += '<div class="week-stat-box"><div class="week-stat-label">Винрейт</div><div class="week-stat-val">' + wk.accuracy + '%</div></div>';
      html += '<div class="week-stat-box"><div class="week-stat-label">Ср.Кэф</div><div class="week-stat-val">' + wk.avgOdd + '</div></div>';
      html += '<div class="week-stat-box"><div class="week-stat-label">Профит</div><div class="week-stat-val" style="color:' + (wk.profit >= 0 ? 'var(--mint)' : 'var(--danger)') + '">' + wk.profitStr + '</div></div>';
      html += '</div>';
      
      wk.matches.forEach(function(m) {
        var emoji = m.status === 'win' ? '✅' : '❌';
        html += '<div class="week-match-row">';
        html += '<div>' + emoji + ' ' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div>';
        html += '<div class="week-match-score">' + escapeHtml(m.score) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });
  } else {
    html += '<div class="week-block"><div class="week-header"><div class="week-date">📅 Последние матчи</div></div>';
    data.matches.forEach(function(m) {
      var emoji = m.status === 'win' ? '✅' : '❌';
      html += '<div class="week-match-row">';
      html += '<div>' + emoji + ' ' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div>';
      html += '<div class="week-match-score">' + escapeHtml(m.score) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  content.innerHTML = html;
}

/* ---------- ЭКСПРЕСС ---------- */
function renderExpress(data) {
  var content = document.getElementById('content');
  if (!data || !Array.isArray(data.matches) || !data.matches.length) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">🔥</div>Экспресс ещё не собран<br><div style="font-size:12px;margin-top:10px;opacity:0.6;">Загляните позже или нажмите «Обновить»</div><button class="empty-btn" onclick="manualRefresh()">Обновить</button></div>';
    return;
  }
  var items = data.matches.filter(function(m) { return (parseInt(m.probability) || 0) >= MIN_PROBABILITY; });
  if (!items.length) { content.innerHTML = '<div class="empty"><div class="empty-icon">🔥</div>Нет событий не ниже ' + MIN_PROBABILITY + '% для экспресса</div>'; return; }
  
  var totalOdd = 1;
  items.forEach(function(m) { totalOdd *= (parseFloat(m.odd) || 1); });
  totalOdd = totalOdd.toFixed(2);
  
  var html = '<div class="express-hero"><div class="express-title">ТОП-ЭКСПРЕСС ДНЯ</div><div class="express-odd">' + totalOdd + '</div><div class="express-sub">Итоговый коэффициент · ' + items.length + ' событий</div></div>';
  
  items.forEach(function(m, i) {
    var prob = parseInt(m.probability) || 0;
    var odd = parseFloat(m.odd) || 1;
    html += '<div class="express-item">';
    html += '<div class="express-item-left">';
    html += '<div class="express-item-teams">' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div>';
    html += '<div class="express-item-league">' + escapeHtml(m.league || 'Лига') + '</div>';
    html += '</div>';
    html += '<div class="express-item-right">';
    html += '<div class="express-item-prob">' + prob + '%</div>';
    html += '<div class="express-item-odd">' + odd.toFixed(2) + '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  content.innerHTML = html;
}

/* ---------- СТАРТ ---------- */
document.getElementById('leagueChips').style.display = 'flex';
document.getElementById('cntTodayDate').textContent = todayShort();
loadData();
updateCounters();
</script>
