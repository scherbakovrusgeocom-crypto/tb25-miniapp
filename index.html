<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Total 2.5 PRO · Аналитика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-primary: #07090e;
  --bg-subtle: #0d121c;
  --surface: rgba(18, 26, 41, 0.65);
  --surface-solid: #111928;
  --surface-hover: rgba(30, 41, 59, 0.8);
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(0, 245, 155, 0.4);
  
  --text-main: #ffffff;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  
  --neon-green: #00f59b;
  --neon-green-glow: rgba(0, 245, 155, 0.25);
  --neon-amber: #ffb800;
  --neon-amber-glow: rgba(255, 184, 0, 0.25);
  --neon-rose: #ff3366;
  --neon-rose-glow: rgba(255, 51, 102, 0.25);
  --neon-indigo: #6366f1;
  --neon-indigo-glow: rgba(99, 102, 241, 0.3);
  
  --radius-xl: 22px;
  --radius-lg: 16px;
  --radius-sm: 10px;
  --nav-height: 68px;
}

body.light-theme {
  --bg-primary: #f8fafc;
  --bg-subtle: #f1f5f9;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --surface-hover: rgba(241, 245, 249, 1);
  --border: rgba(15, 23, 42, 0.08);
  --border-focus: rgba(0, 200, 120, 0.4);
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-dim: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  min-height: 100vh;
  padding-bottom: calc(var(--nav-height) + 36px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
  transition: background 0.3s ease, color 0.3s ease;
  background-image: 
    radial-gradient(circle at 10% 0%, rgba(0, 245, 155, 0.06) 0%, transparent 45%),
    radial-gradient(circle at 90% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(255, 184, 0, 0.05) 0%, transparent 50%);
  background-attachment: fixed;
}

/* ---------- ХЕДЕР ---------- */
.app-header {
  position: relative;
  padding: 24px 20px 14px;
}
.header-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 12px;
}
.hud-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--surface);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.hud-btn:active {
  transform: scale(0.92);
  color: var(--neon-green);
  border-color: var(--neon-green);
}
.hud-btn svg { width: 18px; height: 18px; stroke-width: 2.2; }
.hud-btn.spinning svg { animation: spin 0.8s linear infinite; color: var(--neon-green); }
@keyframes spin { 100% { transform: rotate(360deg); } }

.brand-wrapper {
  text-align: left;
}
.brand-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--neon-green);
  background: rgba(0, 245, 155, 0.1);
  padding: 4px 10px;
  border-radius: 100px;
  border: 1px solid rgba(0, 245, 155, 0.25);
  margin-bottom: 8px;
}
.brand-tag-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 8px var(--neon-green);
}
.brand-title {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.6px;
  line-height: 1.1;
  background: linear-gradient(135deg, #ffffff 30%, var(--text-muted) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
body.light-theme .brand-title {
  background: linear-gradient(135deg, #0f172a 40%, #334155 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ИНФО-ПАНЕЛЬ СЕГОДНЯ */
.hero-counter-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 14px;
  padding: 12px 16px;
  background: var(--surface);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}
.counter-left {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}
.counter-left b {
  color: var(--text-main);
  font-weight: 800;
}
.counter-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 800;
  color: var(--neon-green);
  background: rgba(0, 245, 155, 0.12);
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid rgba(0, 245, 155, 0.25);
}

/* ФИЛЬТР ЛИГ */
.league-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 20px 16px;
  scrollbar-width: none;
}
.league-chips::-webkit-scrollbar { display: none; }
.league-chip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--surface);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
}
.league-chip span.cnt {
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 6px;
  border-radius: 10px;
  color: var(--text-dim);
}
.league-chip.active {
  background: linear-gradient(135deg, var(--neon-green), #00c77b);
  color: #05140d;
  border-color: var(--neon-green);
  box-shadow: 0 4px 16px var(--neon-green-glow);
}
.league-chip.active span.cnt {
  background: rgba(0, 0, 0, 0.2);
  color: #05140d;
}

#content { padding: 0 20px; }

/* ---------- СТИЛИ КАРТОЧКИ МАТЧА ---------- */
.match-card {
  position: relative;
  background: var(--surface);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 18px;
  margin-bottom: 14px;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  animation: cardFadeUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}
@keyframes cardFadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.match-card.is-top {
  border-color: rgba(255, 184, 0, 0.4);
  background: linear-gradient(180deg, rgba(255, 184, 0, 0.07) 0%, var(--surface) 100%);
  box-shadow: 0 8px 30px rgba(255, 184, 0, 0.12);
}
.match-card.is-top::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--neon-amber), #ffe066);
}
.match-card.is-mid::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--neon-green), #38ef7d);
}

.card-hud-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.hud-meta-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.badge-league {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.05);
  padding: 4px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.badge-time {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--neon-amber);
  background: rgba(255, 184, 0, 0.1);
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid rgba(255, 184, 0, 0.2);
}
.badge-live {
  font-size: 10px;
  font-weight: 800;
  color: #fff;
  background: var(--neon-rose);
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
  box-shadow: 0 0 10px var(--neon-rose-glow);
  animation: liveBlink 1.4s infinite;
}
@keyframes liveBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

.signal-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 100px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.signal-pill.green {
  background: rgba(0, 245, 155, 0.12);
  color: var(--neon-green);
  border: 1px solid rgba(0, 245, 155, 0.3);
}
.signal-pill.yellow {
  background: rgba(255, 184, 0, 0.12);
  color: var(--neon-amber);
  border: 1px solid rgba(255, 184, 0, 0.3);
}
.signal-pill.red {
  background: rgba(255, 51, 102, 0.12);
  color: var(--neon-rose);
  border: 1px solid rgba(255, 51, 102, 0.3);
}
.signal-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 6px currentColor;
}

/* СЕТКА КОМАНД */
.card-teams-arena {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0 12px;
}
.team-item {
  flex: 1;
}
.team-item.home { text-align: left; }
.team-item.away { text-align: right; }
.team-title {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.2px;
}
.team-role {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 3px;
  letter-spacing: 0.5px;
}
.arena-vs {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 800;
  color: var(--text-dim);
  background: rgba(255, 255, 255, 0.04);
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

/* ПРОГРЕСС-БАР ВЕРОЯТНОСТИ */
.prob-meter-wrapper {
  margin: 8px 0 16px;
}
.prob-meter-labels {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 6px;
}
.prob-tag-text {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
}
.prob-tag-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 900;
}
.is-top .prob-tag-val { color: var(--neon-amber); text-shadow: 0 0 12px var(--neon-amber-glow); }
.is-mid .prob-tag-val { color: var(--neon-green); text-shadow: 0 0 12px var(--neon-green-glow); }

.prob-meter-track {
  width: 100%;
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 100px;
  overflow: hidden;
  position: relative;
}
.prob-meter-bar {
  height: 100%;
  border-radius: 100px;
  transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}
.is-top .prob-meter-bar { background: linear-gradient(90deg, #ff9900, var(--neon-amber)); }
.is-mid .prob-meter-bar { background: linear-gradient(90deg, #00ba78, var(--neon-green)); }

/* НИЖНЯЯ ПАНЕЛЬ С КЭФОМ И КНОПКОЙ */
.card-hud-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.odd-display {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.odd-target {
  font-size: 11px;
  font-weight: 800;
  color: var(--text-muted);
  background: var(--surface-hover);
  padding: 4px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}
.odd-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 900;
  color: var(--neon-green);
}

.share-action-btn {
  background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.share-action-btn:active {
  transform: scale(0.94);
  color: var(--neon-green);
  border-color: var(--neon-green);
  background: rgba(0, 245, 155, 0.1);
}
.share-action-btn svg { width: 15px; height: 15px; stroke-width: 2.2; }

/* ---------- АККОРДЕОН ЛИГ ---------- */
.league-accordion {
  background: var(--surface);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.league-acc-header {
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.league-acc-header:active { background: var(--surface-hover); }
.acc-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.acc-title { font-size: 15px; font-weight: 800; }
.acc-count-pill {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--neon-green);
  background: rgba(0, 245, 155, 0.1);
  padding: 3px 8px;
  border-radius: 6px;
  font-weight: 700;
}
.acc-chevron {
  width: 20px;
  height: 20px;
  stroke-width: 2.2;
  color: var(--text-dim);
  transition: transform 0.25s ease;
}
.league-acc-content {
  display: none;
  padding: 4px 18px 14px;
  border-top: 1px solid var(--border);
}
.league-acc-content.open { display: block; animation: fadeIn 0.25s ease; }
.league-match-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.league-match-row:last-child { border-bottom: none; }
.lmr-teams { font-size: 13px; font-weight: 700; }
.lmr-time { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); margin-top: 2px; }

/* ---------- БИЛЕТ ЭКСПРЕССА ---------- */
.ticket-wrapper {
  background: linear-gradient(135deg, #111827, #1f2937);
  border-radius: var(--radius-xl);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 24px 20px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,0.4);
}
.ticket-wrapper::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--neon-indigo), var(--neon-green));
}
.ticket-header {
  text-align: center;
}
.ticket-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--neon-green);
}
.ticket-multiplier {
  font-family: 'JetBrains Mono', monospace;
  font-size: 58px;
  font-weight: 900;
  line-height: 1.05;
  margin: 12px 0;
  background: linear-gradient(135deg, #ffffff 40%, var(--neon-green) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ticket-meta {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.ticket-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.ti-teams { font-size: 13px; font-weight: 800; }
.ti-league { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.ti-prob {
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 800;
  color: var(--neon-green);
}
.ti-odd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--neon-amber);
  margin-top: 2px;
}

/* ---------- СТАТИСТИКА И ROI ---------- */
.stats-overview {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card-mega {
  grid-column: span 2;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 24px 20px;
  text-align: center;
}
.mega-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 56px;
  font-weight: 900;
  line-height: 1;
  color: var(--text-main);
}
.mega-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 8px;
}

.stat-card-mini {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  text-align: center;
}
.mini-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 800;
}
.mini-num.win { color: var(--neon-green); }
.mini-num.lose { color: var(--neon-rose); }
.mini-label {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-top: 4px;
}

.bonus-banner-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--neon-amber), #ea580c);
  color: #07090e;
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 0.5px;
  text-decoration: none;
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 25px var(--neon-amber-glow);
  margin-bottom: 24px;
  transition: transform 0.2s;
}
.bonus-banner-btn:active { transform: scale(0.97); }

/* ---------- ПЛАВАЮЩИЙ НАВИГАЦИОННЫЙ ОСТРОВ ---------- */
.bottom-dock-container {
  position: fixed;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: 16px;
  right: 16px;
  z-index: 100;
}
.bottom-dock {
  background: rgba(13, 18, 28, 0.88);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  height: var(--nav-height);
  display: flex;
  align-items: stretch;
  padding: 6px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
}
body.light-theme .bottom-dock {
  background: rgba(255, 255, 255, 0.9);
  border-color: rgba(0, 0, 0, 0.08);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.1);
}

.dock-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 10px;
  font-weight: 800;
  cursor: pointer;
  border-radius: 14px;
  transition: all 0.2s ease;
  font-family: inherit;
}
.dock-btn svg { width: 20px; height: 20px; stroke-width: 2.2; }
.dock-btn.active {
  color: var(--neon-green);
  background: rgba(0, 245, 155, 0.1);
}
body.light-theme .dock-btn.active {
  background: rgba(0, 200, 120, 0.12);
  color: #059669;
}

/* СКЕЛЕТОН */
.skeleton {
  background: var(--surface);
  border-radius: var(--radius-xl);
  height: 180px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.skeleton::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-action-btn {
  margin-top: 20px;
  padding: 14px 28px;
  background: var(--neon-green);
  color: #07090e;
  border: none;
  border-radius: 100px;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 4px 20px var(--neon-green-glow);
}
.empty-action-btn:active { transform: scale(0.96); }

.sync-footer-line {
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
  margin: 20px 0 10px;
  line-height: 1.6;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="header-actions">
    <button class="hud-btn" id="refreshBtn" onclick="manualRefresh()" title="Обновить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
    <button class="hud-btn" onclick="toggleTheme()" title="Сменить тему">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>

  <div class="brand-wrapper">
    <div class="brand-tag"><div class="brand-tag-dot"></div> AI PREDICTION HUB</div>
    <div class="brand-title">TOTAL 2.5 PRO</div>
  </div>

  <div class="hero-counter-strip" id="dailySummary" style="display:none;">
    <div class="counter-left">Отобрано сигналов на сегодня:</div>
    <div class="counter-badge" id="summaryCount">0</div>
  </div>
</header>

<div class="league-chips" id="leagueChips" style="display:none;"></div>

<main id="content"></main>

<div class="sync-footer-line" id="syncLine"></div>

<!-- ПЛАВАЮЩИЙ НАВИГАЦИОННЫЙ ДОК -->
<div class="bottom-dock-container">
  <nav class="bottom-dock" id="bottomNav">
    <button class="dock-btn active" data-nav="matches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>Матчи</span>
    </button>
    <button class="dock-btn" data-nav="leagues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>
      <span>Лиги</span>
    </button>
    <button class="dock-btn" data-nav="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span>Статистика</span>
    </button>
    <button class="dock-btn" data-nav="express">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <span>Экспресс</span>
    </button>
  </nav>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';
const BONUS_URL = 'https://baltbet.ru/account/register?refpromo=1221753';
const CACHE_VERSION = 'v102';
const CACHE_TTL = 5 * 60 * 1000;
const MIN_PROBABILITY = 57;

let currentNav = 'matches';
let currentLeague = 'all';
let todayData = [];

const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- ТЕМА ---------- */
function initTheme() {
  var saved = localStorage.getItem('tb25_theme') || 'dark';
  if (saved === 'light') document.body.classList.add('light-theme');
  updateThemeIcon(saved);
}
function toggleTheme() {
  haptic('medium');
  var isLight = document.body.classList.toggle('light-theme');
  var theme = isLight ? 'light' : 'dark';
  localStorage.setItem('tb25_theme', theme);
  updateThemeIcon(theme);
}
function updateThemeIcon(theme) {
  var icon = document.getElementById('themeIcon');
  if (!icon) return;
  if (theme === 'light') icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  else icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}
initTheme();

function haptic(s) {
  if (tg && tg.HapticFeedback) try {
    if (s === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (s === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e){}
}

function showToast(text) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;bottom:calc(var(--nav-height) + 26px);left:20px;right:20px;background:var(--surface-solid);color:var(--text-main);padding:14px 20px;border-radius:14px;font-size:13px;font-weight:700;text-align:center;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,0.5);border:1px solid var(--border);';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(function() { el.style.transition = 'opacity 0.3s'; el.style.opacity = '0'; }, 2400);
  setTimeout(function() { el.remove(); }, 2700);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function escapeAttr(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

/* ---------- СИГНАЛЫ (СВЕТОФОР) ---------- */
function getSignalBadge(prob) {
  if (prob >= 75) return { color: 'green', text: 'Топ сигнал' };
  if (prob >= 65) return { color: 'yellow', text: 'Уверенный' };
  return { color: 'red', text: 'Базовый' };
}

/* ---------- НАВИГАЦИЯ ---------- */
function switchNav(nav) {
  haptic('medium');
  currentNav = nav;
  currentLeague = 'all';
  document.querySelectorAll('.dock-btn').forEach(function(n) { n.classList.toggle('active', n.dataset.nav === nav); });
  
  document.getElementById('dailySummary').style.display = (nav === 'matches') ? 'flex' : 'none';
  document.getElementById('leagueChips').style.display = (nav === 'matches') ? 'flex' : 'none';
  
  loadData();
}

function switchLeague(league) {
  haptic('light');
  currentLeague = league;
  if (currentNav === 'matches') renderMatchesList();
}

document.getElementById('bottomNav').addEventListener('click', function(e) {
  var btn = e.target.closest('.dock-btn');
  if (btn) switchNav(btn.dataset.nav);
});

/* ---------- КЭШ ---------- */
function getCache(key) {
  try { var r = localStorage.getItem('tb25_' + CACHE_VERSION + '_' + key); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function setCache(key, data) {
  try {
    localStorage.setItem('tb25_' + CACHE_VERSION + '_' + key, JSON.stringify({ data: data, ts: Date.now() }));
    localStorage.setItem('tb25_last_update', new Date().toISOString());
  } catch(e){}
}
function updateSyncLine() {
  var el = document.getElementById('syncLine');
  if (!el) return;
  try {
    var iso = localStorage.getItem('tb25_last_update');
    if (!iso) { el.innerHTML = '⚡ Автоматическое обновление каждый день ~01:00 МСК'; return; }
    var d = new Date(iso);
    var diffMin = Math.floor((new Date() - d) / 60000);
    var ago = diffMin < 1 ? 'только что' : diffMin < 60 ? diffMin + ' мин назад' : Math.floor(diffMin / 60) + ' ч назад';
    el.innerHTML = '⚡ Обновлено: ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' (' + ago + ')<br><span style="opacity:0.6;font-size:10px;">Синхронизация с серверами 3 API</span>';
  } catch(e) { el.textContent = ''; }
}

/* ---------- СЕТЬ ---------- */
function showSkeleton() {
  return '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
}

async function fetchAction(action) {
  var url = API_URL + '?action=' + action + '&_t=' + Date.now();
  var resp = await fetch(url, { cache: 'no-store' });
  var text = await resp.text();
  var result;
  try { result = JSON.parse(text); }
  catch (e) { throw new Error('Сервер вернул не JSON'); }
  if (result.error) throw new Error(result.error);
  return result.data !== undefined ? result.data : result;
}

async function loadData(forceNetwork) {
  if (forceNetwork === undefined) forceNetwork = false;
  var content = document.getElementById('content');
  var key = currentNav;
  var action = currentNav === 'stats' ? 'yesterday' : (currentNav === 'leagues' ? 'leagues' : currentNav);

  var cached = !forceNetwork ? getCache(key) : null;
  if (cached) {
    renderByNav(cached.data);
    updateSyncLine();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = showSkeleton();
  }
  
  try {
    var data = await fetchAction(action);
    setCache(key, data);
    renderByNav(data);
    updateSyncLine();
  } catch (e) {
    console.error('Error ->', e);
    if (!cached) {
      content.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div>Не удалось получить котировки<br><div style="font-size:12px;margin-top:8px;opacity:0.6;">' + escapeHtml(e.message) + '</div><button class="empty-action-btn" onclick="manualRefresh()">Повторить попытку</button></div>';
    }
  }
}

async function updateCounters() {
  try {
    var res = await fetchAction('today').catch(function() { return []; });
    var fetchedData = Array.isArray(res) ? res : [];
    var count = fetchedData.filter(function(m) { return (parseInt(m.probability) || 0) >= MIN_PROBABILITY; }).length;
    document.getElementById('summaryCount').textContent = count;
    document.getElementById('dailySummary').style.display = 'flex';
  } catch(e) {}
}

function renderByNav(data) {
  if (currentNav === 'matches') {
    todayData = Array.isArray(data) ? data : [];
    renderMatchesList();
  }
  else if (currentNav === 'leagues') renderLeagues(data);
  else if (currentNav === 'stats') renderStats(data);
  else if (currentNav === 'express') renderExpress(data);
}

function manualRefresh() {
  haptic('medium');
  var btn = document.getElementById('refreshBtn');
  if (btn) btn.classList.add('spinning');
  try {
    Object.keys(localStorage).forEach(function(k) { if (k.indexOf('tb25_' + CACHE_VERSION + '_') === 0) localStorage.removeItem(k); });
  } catch(e){}
  loadData(true).finally(function() {
    updateCounters();
    if (btn) setTimeout(function() { btn.classList.remove('spinning'); }, 500);
    showToast('Данные актуализированы');
  });
}

/* ---------- ОТРИСОВКА: МАТЧИ ---------- */
function renderMatchesList() {
  var content = document.getElementById('content');
  var chipsEl = document.getElementById('leagueChips');
  var raw = todayData;
  
  var filtered = raw.filter(function(m) { return (parseInt(m.probability) || 0) >= MIN_PROBABILITY; });

  var leagueCounts = {};
  filtered.forEach(function(m) {
    var lg = m.league || 'Лига';
    leagueCounts[lg] = (leagueCounts[lg] || 0) + 1;
  });
  var leagues = Object.keys(leagueCounts).sort(function(a, b) { return leagueCounts[b] - leagueCounts[a]; });

  if (leagues.length > 1) {
    chipsEl.style.display = 'flex';
    var chipsHtml = '<div class="league-chip ' + (currentLeague === 'all' ? 'active' : '') + '" onclick="switchLeague(\'all\')">Все турниры<span class="cnt">' + filtered.length + '</span></div>';
    leagues.forEach(function(lg) {
      chipsHtml += '<div class="league-chip ' + (currentLeague === lg ? 'active' : '') + '" onclick="switchLeague(\'' + escapeAttr(lg) + '\')">' + escapeHtml(lg) + '<span class="cnt">' + leagueCounts[lg] + '</span></div>';
    });
    chipsEl.innerHTML = chipsHtml;
  } else {
    chipsEl.style.display = 'none';
  }

  var list = currentLeague === 'all' ? filtered : filtered.filter(function(m) { return (m.league || 'Лига') === currentLeague; });

  if (!list.length) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">⚽</div>Нет подходящих матчей под ТБ 2.5<br><div style="font-size:12px;margin-top:8px;opacity:0.6;">Фильтр исключил матчи с вероятностью ниже ' + MIN_PROBABILITY + '%</div><button class="empty-action-btn" onclick="manualRefresh()">Обновить</button></div>';
    return;
  }

  var sorted = list.sort(function(a, b) { return (parseInt(b.probability) || 0) - (parseInt(a.probability) || 0); });
  var html = '';
  
  sorted.forEach(function(m, i) {
    var prob = parseInt(m.probability) || 0;
    var isTop = prob >= 75;
    var cardClass = isTop ? 'is-top' : 'is-mid';
    var isLive = String(m.result || '').toLowerCase().indexOf('live') >= 0;
    var sig = getSignalBadge(prob);

    html += '<div class="match-card ' + cardClass + '" style="animation-delay:' + (i * 0.04) + 's">';
    
    html += '<div class="card-hud-top">';
    html += '<div class="hud-meta-left">';
    html += '<div class="badge-league">' + escapeHtml(m.league || 'Лига') + '</div>';
    if (isLive) html += '<div class="badge-live">LIVE</div>';
    else if (m.time) html += '<div class="badge-time">' + escapeHtml(m.time) + '</div>';
    html += '</div>';
    html += '<div class="signal-pill ' + sig.color + '"><div class="signal-dot"></div>' + sig.text + '</div>';
    html += '</div>';

    html += '<div class="card-teams-arena">';
    html += '<div class="team-item home"><div class="team-title">' + escapeHtml(m.home) + '</div><div class="team-role">Хозяева</div></div>';
    html += '<div class="arena-vs">VS</div>';
    html += '<div class="team-item away"><div class="team-title">' + escapeHtml(m.away) + '</div><div class="team-role">Гости</div></div>';
    html += '</div>';

    html += '<div class="prob-meter-wrapper">';
    html += '<div class="prob-meter-labels">';
    html += '<span class="prob-tag-text">Расчётная проходимость ТБ 2.5</span>';
    html += '<span class="prob-tag-val">' + prob + '%</span>';
    html += '</div>';
    html += '<div class="prob-meter-track"><div class="prob-meter-bar" style="width:' + prob + '%"></div></div>';
    html += '</div>';

    html += '<div class="card-hud-bottom">';
    html += '<div class="odd-display"><span class="odd-target">ТБ 2.5</span><span class="odd-num">' + escapeHtml(m.odd || '—') + '</span></div>';
    html += '<button class="share-action-btn" onclick="shareMatch(\'' + escapeAttr(JSON.stringify({h: m.home, a: m.away, p: prob, o: m.odd})) + '\')">';
    html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>';
    html += '<span>Поделиться</span>';
    html += '</button>';
    html += '</div>';

    html += '</div>';
  });
  
  content.innerHTML = html;
}

function shareMatch(jsonStr) {
  haptic('medium');
  try {
    var m = JSON.parse(jsonStr);
    var text = '🔥 СИГНАЛ НА ТБ 2.5:\n⚽ ' + m.h + ' — ' + m.a + '\n📊 Вероятность: ' + m.p + '%\n💰 Кэф: ' + m.o;
    if (tg) {
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/total25_signals_bot') + '&text=' + encodeURIComponent(text));
    } else {
      window.open('https://t.me/share/url?url=' + encodeURIComponent('https://t.me/total25_signals_bot') + '&text=' + encodeURIComponent(text), '_blank');
    }
  } catch(e) {}
}

/* ---------- ОТРИСОВКА: ЛИГИ ---------- */
function renderLeagues(data) {
  var content = document.getElementById('content');
  var list = Array.isArray(data) ? data : [];

  if (!list.length) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">🏆</div>Список турниров пуст<br><button class="empty-action-btn" onclick="manualRefresh()">Обновить</button></div>';
    return;
  }

  var html = '<div class="stat-card-mega" style="margin-bottom:16px"><div class="mega-num">' + list.length + '</div><div class="mega-label">Активных турниров в сетке</div></div>';
  
  list.forEach(function(lg, idx) {
    html += '<div class="league-accordion">';
    html += '<div class="league-acc-header" onclick="toggleLeagueAccordion(' + idx + ')">';
    html += '<div class="acc-left">';
    html += '<div class="acc-title">' + escapeHtml(lg.name) + '</div>';
    html += '<div class="acc-count-pill">' + lg.total + '</div>';
    html += '</div>';
    html += '<svg class="acc-chevron" id="arrow_' + idx + '" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg>';
    html += '</div>';
    
    html += '<div class="league-acc-content" id="content_' + idx + '">';
    (lg.matches || []).sort((a, b) => b.prob - a.prob).forEach(function(m) {
      html += '<div class="league-match-row">';
      html += '<div><div class="lmr-teams">' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div><div class="lmr-time">' + escapeHtml(m.time || 'Сегодня') + '</div></div>';
      html += '<div style="text-align:right;"><div style="font-family:JetBrains Mono;font-size:15px;font-weight:900;color:var(--neon-green)">' + m.prob + '%</div><div style="font-size:11px;color:var(--neon-amber);font-family:JetBrains Mono;font-weight:700;">' + escapeHtml(m.odd || '—') + '</div></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';
  });
  
  content.innerHTML = html;
}

function toggleLeagueAccordion(idx) {
  haptic('light');
  var content = document.getElementById('content_' + idx);
  var arrow = document.getElementById('arrow_' + idx);
  if (!content) return;
  var isOpen = content.classList.toggle('open');
  arrow.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
}

/* ---------- ОТРИСОВКА: СТАТИСТИКА ---------- */
function renderStats(data) {
  var content = document.getElementById('content');
  if (!data || (!data.matches && !data.weeks)) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">📊</div>Нет данных по завершённым матчам</div>';
    return;
  }
  
  var wins = data.wins || 0, loses = data.loses || 0, accuracy = data.accuracy || 0;
  
  var html = '<div class="stats-overview">';
  html += '<div class="stat-card-mega"><div class="mega-num">' + accuracy + '%</div><div class="mega-label">Точность алгоритма</div></div>';
  html += '<div class="stat-card-mini"><div class="mini-num win">' + wins + '</div><div class="mini-label">Зашло (ТБ 2.5)</div></div>';
  html += '<div class="stat-card-mini"><div class="mini-num lose">' + loses + '</div><div class="mini-label">Не зашло</div></div>';
  html += '</div>';

  html += '<a href="' + BONUS_URL + '" target="_blank" class="bonus-banner-btn">🎁 ПОЛУЧИТЬ ПРИВЕТСТВЕННЫЙ БОНУС</a>';

  if (data.matches && Array.isArray(data.matches)) {
    html += '<div class="stat-card-mega" style="text-align:left;padding:16px;">';
    html += '<div class="mega-label" style="margin-bottom:12px;text-align:left;">История последних исходов:</div>';
    data.matches.slice(0, 15).forEach(function(m) {
      var isWin = m.status === 'win';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;">';
      html += '<div style="font-weight:700">' + (isWin ? '✅' : '❌') + ' ' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div>';
      html += '<div style="font-family:JetBrains Mono;font-weight:800;color:var(--text-main)">' + escapeHtml(m.score || '—') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  content.innerHTML = html;
}

/* ---------- ОТРИСОВКА: ЭКСПРЕСС ---------- */
function renderExpress(data) {
  var content = document.getElementById('content');
  if (!data || !Array.isArray(data.matches) || !data.matches.length) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">🔥</div>ТОП-Экспресс формируется...<br><div style="font-size:12px;margin-top:8px;opacity:0.6;">Алгоритм подбирает исходы с максимальной корреляцией</div><button class="empty-action-btn" onclick="manualRefresh()">Обновить</button></div>';
    return;
  }
  var items = data.matches.filter(function(m) { return (parseInt(m.probability) || 0) >= MIN_PROBABILITY; });
  if (!items.length) {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">🔥</div>Недостаточно событий высокой проходимости</div>';
    return;
  }
  
  var totalOdd = 1;
  items.forEach(function(m) { totalOdd *= (parseFloat(m.odd) || 1); });
  totalOdd = totalOdd.toFixed(2);
  
  var html = '<div class="ticket-wrapper">';
  html += '<div class="ticket-header">';
  html += '<div class="ticket-label">Сгенерированный экспресс</div>';
  html += '<div class="ticket-multiplier">' + totalOdd + '</div>';
  html += '<div class="ticket-meta">Итоговый множитель купона · ' + items.length + ' матча</div>';
  html += '</div>';
  html += '</div>';
  
  items.forEach(function(m) {
    var prob = parseInt(m.probability) || 0;
    var odd = parseFloat(m.odd) || 1;
    html += '<div class="ticket-item">';
    html += '<div>';
    html += '<div class="ti-teams">' + escapeHtml(m.home) + ' — ' + escapeHtml(m.away) + '</div>';
    html += '<div class="ti-league">' + escapeHtml(m.league || 'Лига') + ' · Исход: ТБ 2.5</div>';
    html += '</div>';
    html += '<div style="text-align:right;">';
    html += '<div class="ti-prob">' + prob + '%</div>';
    html += '<div class="ti-odd">' + odd.toFixed(2) + '</div>';
    html += '</div>';
    html += '</div>';
  });
  
  content.innerHTML = html;
}

/* ---------- СТАРТ ---------- */
loadData();
updateCounters();
</script>
</body>
</html>
