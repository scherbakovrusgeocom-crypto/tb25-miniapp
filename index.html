<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Прогнозы ТБ 2.5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #05140a;
  --bg2: #0a2412;
  --field: #0d2818;
  --field-light: #143d24;
  --card: #0e2916;
  --card2: #123821;
  --border: rgba(74, 222, 128, 0.15);
  --border-strong: rgba(74, 222, 128, 0.35);
  --text: #ffffff;
  --text-dim: #86efac;
  --text-mute: #65a30d;
  --green: #22c55e;
  --green-bright: #4ade80;
  --green-glow: #86efac;
  --gold: #f59e0b;
  --gold-bright: #fbbf24;
  --red: #ef4444;
  --cyan: #06b6d4;
  --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 0 0 40px;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    repeating-linear-gradient(90deg,
      rgba(34, 197, 94, 0.025) 0px,
      rgba(34, 197, 94, 0.025) 60px,
      transparent 60px,
      transparent 120px),
    radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(34, 197, 94, 0.08) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
}

/* ===== ШАПКА ===== */
.header {
  position: relative;
  padding: 28px 20px 24px;
  text-align: center;
  background: linear-gradient(180deg, #0a2412 0%, #05140a 100%);
  border-bottom: 2px solid var(--green);
  overflow: hidden;
  z-index: 1;
  box-shadow: 0 4px 30px rgba(34, 197, 94, 0.2);
}
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(90deg,
    rgba(34, 197, 94, 0.06) 0px,
    rgba(34, 197, 94, 0.06) 40px,
    transparent 40px,
    transparent 80px);
  pointer-events: none;
}
.header::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 200px; height: 200px;
  transform: translate(-50%, -50%);
  border: 2px solid rgba(34, 197, 94, 0.15);
  border-radius: 50%;
  pointer-events: none;
  animation: centerCircle 8s ease-in-out infinite;
}
@keyframes centerCircle {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
  50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.15; }
}
.header-logo {
  width: 62px; height: 62px;
  margin: 0 auto 10px;
  display: block;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 25px rgba(34, 197, 94, 0.7));
  animation: ballSpin 12s linear infinite;
}
@keyframes ballSpin {
  0% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(90deg) translateY(-3px); }
  50% { transform: rotate(180deg) translateY(0); }
  75% { transform: rotate(270deg) translateY(-3px); }
  100% { transform: rotate(360deg) translateY(0); }
}
.header h1 {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 3px;
  color: var(--green-bright);
  text-shadow: 0 0 20px rgba(34, 197, 94, 0.8), 0 0 40px rgba(34, 197, 94, 0.4), 2px 2px 0 rgba(0, 0, 0, 0.5);
  position: relative;
  z-index: 2;
  font-family: 'Arial Black', 'Impact', sans-serif;
}
.header .sub {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-dim);
  margin-top: 6px;
  text-transform: uppercase;
  font-weight: 800;
  position: relative;
  z-index: 2;
}
.header .live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  padding: 5px 14px;
  background: rgba(34, 197, 94, 0.2);
  border: 1px solid var(--green);
  color: var(--green-bright);
  font-size: 10px;
  font-weight: 900;
  border-radius: 20px;
  letter-spacing: 2px;
  position: relative;
  z-index: 2;
  text-transform: uppercase;
  box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
}
.header .live-badge::before {
  content: '';
  width: 7px; height: 7px;
  background: var(--green-bright);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green-bright);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

/* ===== ТАБЫ ===== */
.tabs-wrap {
  position: sticky;
  top: 0;
  background: rgba(5, 20, 10, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 12px;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  transition: all 0.25s;
  white-space: nowrap;
  cursor: pointer;
  min-width: 62px;
}
.tab svg { width: 18px; height: 18px; stroke-width: 2.2; }
.tab.active {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(74, 222, 128, 0.15));
  border-color: var(--green);
  color: var(--green-bright);
  box-shadow: 0 0 20px rgba(34, 197, 94, 0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}

/* ===== ФИЛЬТРЫ ===== */
.filters-wrap { padding: 12px 16px 0; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-radius: 18px;
  font-size: 11px;
  font-weight: 700;
  background: var(--card);
  color: var(--text-dim);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.filter.active {
  background: linear-gradient(135deg, var(--green), #16a34a);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
}

/* ===== КОНТЕНТ ===== */
#content { padding: 14px 16px; position: relative; z-index: 1; }

/* ===== КАРТОЧКА МАТЧА ===== */
.card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.4);
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green), var(--green-bright), var(--green));
  background-size: 200% 100%;
  animation: shimmerBar 3s linear infinite;
  box-shadow: 0 0 15px var(--green);
}
@keyframes shimmerBar {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.card.card-hot::before { background: linear-gradient(90deg, var(--gold), var(--gold-bright), var(--gold)); background-size: 200% 100%; box-shadow: 0 0 15px var(--gold); }
.card.card-mid::before { background: linear-gradient(90deg, var(--green), var(--cyan)); }
.card.card-live::before { background: linear-gradient(90deg, var(--red), #f43f5e); box-shadow: 0 0 15px var(--red); animation: none; }

.card-teams {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  padding-right: 44px;
}
.team {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.team.right { flex-direction: row-reverse; text-align: right; }
.team-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: 900;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
  border: 2px solid rgba(34, 197, 94, 0.4);
}
.team-name {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.vs {
  font-size: 10px;
  font-weight: 900;
  color: var(--green-bright);
  padding: 4px 8px;
  flex-shrink: 0;
  background: rgba(34, 197, 94, 0.15);
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 8px;
  letter-spacing: 1px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11px;
  color: var(--text-dim);
  padding: 8px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
  font-weight: 600;
}
.card-meta .meta-item { display: flex; align-items: center; gap: 4px; }

.card-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.stat-box {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 6px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.stat-box::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%; height: 2px;
  border-radius: 1px;
}
.stat-box.blue::before { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.stat-box.green::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
.stat-box.gold::before { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.stat-box .label {
  font-size: 9px;
  color: var(--text-mute);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stat-box .value {
  font-size: 16px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.stat-box.blue .value { color: #22d3ee; }
.stat-box.green .value { color: var(--green-bright); }
.stat-box.gold .value { color: var(--gold-bright); }

.outcome-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  background: linear-gradient(90deg, rgba(34, 197, 94, 0.12), rgba(74, 222, 128, 0.06));
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 12px;
  font-size: 12px;
  margin-bottom: 8px;
}
.outcome-line .label { color: var(--text-dim); font-weight: 700; letter-spacing: 0.3px; }
.outcome-line .fav {
  color: var(--green-bright);
  font-weight: 900;
  text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
}

.card-actions {
  position: absolute;
  top: 12px; right: 12px;
  display: flex;
  gap: 6px;
  z-index: 2;
}
.icon-btn {
  width: 32px; height: 32px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.icon-btn.active {
  color: var(--gold-bright);
  border-color: var(--gold-bright);
  background: rgba(245, 158, 11, 0.2);
  box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
}
.icon-btn:active { transform: scale(0.9); }

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--red);
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  border-radius: 6px;
  letter-spacing: 0.5px;
  box-shadow: 0 0 10px var(--red);
}

/* ===== ЭКСПРЕСС ===== */
.express-hero {
  background: linear-gradient(135deg, #78350f 0%, #b45309 50%, #d97706 100%);
  border-radius: 22px;
  padding: 28px 20px;
  color: #fff;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 12px 50px rgba(217, 119, 6, 0.5);
  border: 1px solid rgba(251, 191, 36, 0.3);
}
.express-hero::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
  animation: rotate 12s linear infinite;
}
@keyframes rotate { to { transform: rotate(360deg); } }
.express-hero::after {
  content: '🏆';
  position: absolute;
  top: 12px; right: 16px;
  font-size: 40px;
  opacity: 0.4;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.express-hero-title {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 1px;
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
}
.express-hero-sub {
  font-size: 11px;
  opacity: 0.9;
  margin-top: 6px;
  letter-spacing: 1px;
  position: relative;
  z-index: 1;
}
.express-hero-odd {
  font-size: 62px;
  font-weight: 900;
  margin-top: 16px;
  position: relative;
  z-index: 1;
  background: linear-gradient(180deg, #fef9c3, #fbbf24, #f59e0b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
  line-height: 1;
}
.express-hero-label {
  font-size: 10px;
  opacity: 0.85;
  letter-spacing: 3px;
  margin-top: 8px;
  text-transform: uppercase;
  font-weight: 700;
  position: relative;
  z-index: 1;
}
.express-items-title {
  text-align: center;
  font-size: 13px;
  color: var(--text-dim);
  margin-bottom: 14px;
  font-weight: 800;
  letter-spacing: 1.5px;
}
.express-card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 4px;
  position: relative;
  overflow: hidden;
  animation: slideIn 0.4s ease;
}
.express-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--green), var(--green-bright));
  box-shadow: 0 0 10px var(--green);
}
.express-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.express-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--green), #16a34a);
  color: #fff;
  font-size: 13px;
  font-weight: 900;
  border-radius: 50%;
  flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(34, 197, 94, 0.6);
}
.express-match {
  font-size: 14px;
  font-weight: 800;
  line-height: 1.25;
}
.express-league {
  font-size: 11px;
  color: var(--text-dim);
  margin-left: 38px;
  margin-bottom: 10px;
  font-weight: 600;
}
.express-card-body {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: rgba(0, 0, 0, 0.35);
  border-radius: 10px;
  padding: 10px 6px;
}
.express-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-align: center;
}
.express-stat-label {
  font-size: 9px;
  color: var(--text-mute);
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  font-weight: 800;
}
.express-stat-value {
  font-size: 14px;
  font-weight: 900;
}
.express-odd {
  font-size: 16px;
  font-weight: 900;
  color: var(--gold-bright);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
}
.express-divider {
  text-align: center;
  font-size: 18px;
  color: var(--green);
  margin: 6px 0;
  opacity: 0.7;
  font-weight: 900;
  text-shadow: 0 0 10px var(--green);
}
.express-footer {
  background: linear-gradient(135deg, #0a2412, #143d24);
  border: 1px solid var(--border-strong);
  border-radius: 18px;
  padding: 18px 20px;
  margin-top: 20px;
  box-shadow: 0 8px 35px rgba(34, 197, 94, 0.2);
  position: relative;
  overflow: hidden;
}
.express-footer::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green), var(--gold-bright), var(--green));
  background-size: 200% 100%;
  animation: shimmerBar 3s linear infinite;
}
.express-footer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  font-weight: 600;
}
.express-footer-row:last-child {
  border-bottom: none;
  margin-top: 6px;
  padding-top: 14px;
  border-top: 1px solid rgba(34, 197, 94, 0.4);
  color: var(--text);
  font-size: 14px;
}
.express-footer-odd {
  font-size: 30px;
  font-weight: 900;
  color: var(--gold-bright);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 25px rgba(251, 191, 36, 0.6);
}

/* ===== СТАТИСТИКА ===== */
.stats-wrap { padding: 10px 0; }
.stats-big {
  text-align: center;
  font-size: 78px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--green-bright), var(--green), #16a34a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  filter: drop-shadow(0 8px 30px rgba(34, 197, 94, 0.5));
  margin-bottom: 6px;
}
.stats-label {
  text-align: center;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 32px;
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.stats-box {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 16px;
  text-align: center;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.stats-box.clickable:active { transform: scale(0.96); }
.stats-box .num {
  font-size: 32px;
  font-weight: 900;
  display: block;
  margin-bottom: 6px;
}
.stats-box .name {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.stats-box.win {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(74, 222, 128, 0.08));
  border-color: rgba(34, 197, 94, 0.4);
}
.stats-box.win .num { color: var(--green-bright); text-shadow: 0 0 20px rgba(74, 222, 128, 0.5); }
.stats-box.lose {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(244, 63, 94, 0.08));
  border-color: rgba(239, 68, 68, 0.4);
}
.stats-box.lose .num { color: #f87171; text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

/* ===== FAQ ===== */
.faq-header {
  text-align: center;
  padding: 20px 0 24px;
  position: relative;
}
.faq-header-icon {
  width: 64px; height: 64px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(74, 222, 128, 0.1));
  border: 2px solid var(--green);
  border-radius: 50%;
  font-size: 32px;
  box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
  animation: float 3s ease-in-out infinite;
}
.faq-header-title {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 2px;
  color: var(--green-bright);
  text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
  margin-bottom: 6px;
}
.faq-header-sub {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
}
.faq-section { margin-bottom: 20px; }
.faq-section-title {
  font-size: 11px;
  font-weight: 900;
  color: var(--green-bright);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.faq-section-title::before {
  content: '';
  width: 4px; height: 4px;
  background: var(--green-bright);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--green-bright);
}
.faq-item {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  transition: 0.2s;
}
.faq-item::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, var(--green), var(--green-bright));
  box-shadow: 0 0 10px var(--green);
}
.faq-q {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.3;
}
.faq-q-icon {
  flex-shrink: 0;
  width: 22px; height: 22px;
  background: linear-gradient(135deg, var(--green), #16a34a);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
  margin-top: 1px;
  box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
}
.faq-a {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.55;
  padding-left: 30px;
  font-weight: 500;
}
.faq-a strong { color: var(--green-bright); font-weight: 800; }
.faq-a ul { margin-top: 6px; padding-left: 16px; }
.faq-a li { margin-bottom: 4px; }
.faq-stat {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(34, 197, 94, 0.15);
  color: var(--green-bright);
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  margin: 0 2px;
}
.faq-highlight {
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(34, 197, 94, 0.25);
  border-radius: 10px;
  padding: 12px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text);
  line-height: 1.5;
}
.faq-cta {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(74, 222, 128, 0.08));
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  margin-top: 20px;
}
.faq-cta-text {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--green-bright);
}
.faq-cta-btn {
  display: inline-block;
  padding: 10px 24px;
  background: linear-gradient(135deg, var(--green), #16a34a);
  color: #fff;
  text-decoration: none;
  border-radius: 25px;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
  border: none;
  cursor: pointer;
  transition: 0.2s;
}
.faq-cta-btn:active { transform: scale(0.96); }

/* ===== EMPTY / ERROR / SKELETON ===== */
.empty {
  text-align: center;
  color: var(--text-mute);
  padding: 80px 20px;
  font-size: 13px;
  font-weight: 700;
}
.empty::before {
  content: '⚽';
  font-size: 64px;
  display: block;
  margin-bottom: 16px;
  opacity: 0.4;
  animation: float 2s ease-in-out infinite;
}
.error {
  text-align: center;
  color: #f87171;
  padding: 20px;
  font-size: 13px;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 14px;
  font-weight: 600;
}
.skeleton {
  background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 18px;
  height: 140px;
  margin-bottom: 12px;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.card-win::before { background: linear-gradient(90deg, var(--green), #16a34a) !important; animation: none; }
.card-lose::before { background: linear-gradient(90deg, var(--red), #f43f5e) !important; animation: none; }
.winner-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  background: rgba(34, 197, 94, 0.15);
  color: var(--green-bright);
  border: 1px solid rgba(34, 197, 94, 0.4);
  border-radius: 10px;
  font-size: 11px;
  font-weight: 800;
  margin-top: 8px;
  letter-spacing: 0.5px;
}

.sync-info {
  text-align: center;
  font-size: 10px;
  color: var(--text-mute);
  padding: 10px 16px;
  letter-spacing: 1px;
  font-weight: 700;
}
.section-title {
  font-size: 22px;
  font-weight: 900;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 1px;
  color: var(--green-bright);
  text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
}
.section-sub {
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 18px;
  font-weight: 700;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="header">
  <svg class="header-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <path d="M32 12 L40 22 L36 32 L28 32 L24 22 Z" fill="#000000"/>
    <path d="M12 32 L20 36 L18 46 L8 44 Z" fill="#000000"/>
    <path d="M52 32 L56 44 L46 46 L44 36 Z" fill="#000000"/>
    <path d="M32 52 L38 48 L42 52 L40 60 L24 60 L22 52 L26 48 Z" fill="#000000"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  </svg>
  <h1>ПРОГНОЗЫ</h1>
  <div class="sub">⚽ ТОТАЛ БОЛЬШЕ 2.5 ⚽</div>
  <div class="live-badge">на поле</div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Сегодня
    </div>
    <div class="tab" data-tab="tomorrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Завтра
    </div>
    <div class="tab" data-tab="yesterday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Вчера
    </div>
    <div class="tab" data-tab="express">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Экспресс
    </div>
    <div class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 12l4-4 4 4 5-5"/></svg>
      Стата
    </div>
    <div class="tab" data-tab="faq">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>
      FAQ
    </div>
  </div>
</div>

<div class="filters-wrap">
  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">Все</button>
    <button class="filter" data-filter="high">🔥 >70%</button>
    <button class="filter" data-filter="fav">⭐ Избранное</button>
  </div>
</div>

<div id="content"></div>
<div class="sync-info" id="syncInfo"></div>
<div class="sync-info" id="syncTime" style="padding-top: 0; margin-top: -4px;"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';

const CACHE_TTL = 30 * 60 * 1000;
let currentTab = 'today';
let currentFilter = 'all';
let allMatches = [];
let favorites = JSON.parse(localStorage.getItem('tb25_favorites') || '[]');

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

function haptic(s) { if (tg?.HapticFeedback) try { tg.HapticFeedback.impactOccurred(s || 'light'); } catch(e){} }

function teamColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  const colors = [
    'linear-gradient(135deg,#ef4444,#dc2626)',
    'linear-gradient(135deg,#3b82f6,#1d4ed8)',
    'linear-gradient(135deg,#22c55e,#15803d)',
    'linear-gradient(135deg,#f59e0b,#d97706)',
    'linear-gradient(135deg,#8b5cf6,#6d28d9)',
    'linear-gradient(135deg,#ec4899,#db2777)',
    'linear-gradient(135deg,#06b6d4,#0891b2)',
    'linear-gradient(135deg,#84cc16,#65a30d)',
    'linear-gradient(135deg,#f97316,#ea580c)',
    'linear-gradient(135deg,#14b8a6,#0d9488)'
  ];
  return colors[Math.abs(h) % colors.length];
}
function teamAvatar(name) {
  const letter = (name || '?').charAt(0).toUpperCase();
  const bg = teamColor(name || 'x');
  return `<div class="team-avatar" style="background:${bg}">${letter}</div>`;
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  haptic('light');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTab = tab.dataset.tab;
  document.querySelector('.filters-wrap').style.display = (currentTab === 'today' || currentTab === 'tomorrow') ? 'block' : 'none';
  loadData();
});

document.getElementById('filters').addEventListener('click', e => {
  const f = e.target.closest('.filter');
  if (!f) return;
  haptic('light');
  document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
  f.classList.add('active');
  currentFilter = f.dataset.filter;
  if (currentTab === 'today' || currentTab === 'tomorrow') renderMatches(allMatches);
});

function getCache(tab) {
  try { const r = localStorage.getItem(`tb25_v11_${tab}`); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function setCache(tab, version, data) {
  try {
    localStorage.setItem(`tb25_v11_${tab}`, JSON.stringify({ version, data, ts: Date.now() }));
    localStorage.setItem('tb25_last_update', new Date().toISOString());
  } catch(e){}
}

function updateSyncTime() {
  const el = document.getElementById('syncTime');
  if (!el) return;
  try {
    const iso = localStorage.getItem('tb25_last_update');
    if (!iso) { el.textContent = ''; return; }
    const d = new Date(iso);
    const now = new Date();
    const diffMin = Math.floor((now - d) / 60000);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');

    let ago = '';
    if (diffMin < 1) ago = 'только что';
    else if (diffMin < 60) ago = `${diffMin} мин назад`;
    else if (diffMin < 1440) ago = `${Math.floor(diffMin / 60)} ч назад`;
    else ago = `${Math.floor(diffMin / 1440)} дн назад`;

    el.textContent = `🕐 Обновлено: ${hh}:${mm} · ${day}.${month} (${ago})`;
  } catch (e) {
    el.textContent = '';
  }
}

async function loadData() {
  const content = document.getElementById('content');

  if (currentTab === 'faq') {
    renderFaq();
    updateSyncTime();
    return;
  }

  const cached = getCache(currentTab);

  if (cached) {
    renderTab(currentTab, cached.data);
    document.getElementById('syncInfo').textContent = '✅ Данные актуальны';
    updateSyncTime();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  }

  try {
    const resp = await fetch(`${API_URL}?action=${currentTab}`);
    const result = await resp.json();
    if (result.error) throw new Error(result.error);
    const serverVersion = result.version || '1';
    const serverData = result.data !== undefined ? result.data : result;
    if (!cached || cached.version !== serverVersion) {
      setCache(currentTab, serverVersion, serverData);
      renderTab(currentTab, serverData);
      document.getElementById('syncInfo').textContent = '🔄 Данные обновлены';
      updateSyncTime();
    } else {
      setCache(currentTab, serverVersion, serverData);
      updateSyncTime();
    }
  } catch (e) {
    if (!cached) content.innerHTML = `<div class="error">❌ ${e.message}</div>`;
    else document.getElementById('syncInfo').textContent = '⚠️ Показан кэш';
  }
}

function renderTab(tab, data) {
  if (tab === 'today' || tab === 'tomorrow') {
    allMatches = Array.isArray(data) ? data : [];
    renderMatches(allMatches);
  }
  else if (tab === 'yesterday') renderYesterday(data);
  else if (tab === 'express') renderExpress(data);
  else if (tab === 'stats') renderStats(data);
  else if (tab === 'faq') renderFaq();
}

function probClass(p) { return p >= 65 ? 'prob-high' : p >= 60 ? 'prob-mid' : 'prob-low'; }
function cardClass(p) { return p >= 70 ? 'card-hot' : p >= 65 ? 'card-mid' : ''; }

function renderMatches(data) {
  const content = document.getElementById('content');
  if (!Array.isArray(data)) { content.innerHTML = '<div class="empty">Нет данных</div>'; return; }
  let filtered = data.slice();
  if (currentFilter === 'high') filtered = filtered.filter(m => m.probability >= 70);
  else if (currentFilter === 'fav') filtered = filtered.filter(m => favorites.includes(`${m.home}_${m.away}`));

  if (!filtered.length) {
    const msg = currentFilter === 'fav' ? 'В избранном пусто' : 'Нет матчей';
    content.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  let html = '';
  filtered.forEach((m) => {
    const prob = parseInt(m.probability) || 0;
    const trend = m.trend || '';
    const fav = favorites.includes(`${m.home}_${m.away}`);
    const live = String(m.result || '').includes('Live');

    let outcomeHtml = '';
    if (m.outcome && m.outcome.favorite) {
      outcomeHtml = `<div class="outcome-line">
        <span class="label">🏆 Прогноз</span>
        <span class="fav">${m.outcome.favorite} · ${m.outcome.favoriteProb}%</span>
      </div>`;
    }

    html += `
      <div class="card ${cardClass(prob)} ${live ? 'card-live' : ''}">
        <div class="card-actions">
          <button class="icon-btn ${fav ? 'active' : ''}" onclick="toggleFav('${esc(m.home)}','${esc(m.away)}')">${fav ? '⭐' : '☆'}</button>
        </div>
        <div class="card-teams">
          <div class="team">${teamAvatar(m.home)}<div class="team-name">${m.home}</div></div>
          <div class="vs">VS</div>
          <div class="team right">${teamAvatar(m.away)}<div class="team-name">${m.away}</div></div>
        </div>
        <div class="card-meta">
          <div class="meta-item">🏆 ${m.league}</div>
          <div class="meta-item">🕐 ${m.time}</div>
        </div>
        <div class="card-stats">
          <div class="stat-box blue"><div class="label">📊 Тотал</div><div class="value">${m.total}</div></div>
          <div class="stat-box green"><div class="label">🎯 Вероят.</div><div class="value">${prob}%</div></div>
          <div class="stat-box gold"><div class="label">💰 Кэф</div><div class="value">${m.odd} ${trend}</div></div>
        </div>
        ${outcomeHtml}
      </div>
    `;
  });
  content.innerHTML = html;
}

function renderYesterday(data) {
  const content = document.getElementById('content');
  const arr = Array.isArray(data) ? data.slice() : [];
  if (!arr.length) { content.innerHTML = '<div class="empty">Вчера матчей не было</div>'; return; }
  let wins = 0, loses = 0;
  arr.forEach(m => { if (m.status === 'win') wins++; else if (m.status === 'lose') loses++; });
  const total = wins + loses;
  const acc = total > 0 ? Math.round(wins / total * 100) : 0;

  let html = `<div class="section-title">✅ ВЧЕРА</div>
    <div class="section-sub">${wins} зашло · ${loses} не зашло · ${acc}%</div>`;

  arr.forEach(m => {
    const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
    const cls = m.status === 'win' ? 'card-win' : m.status === 'lose' ? 'card-lose' : '';
    const winnerHtml = m.winner ? `<div class="winner-badge">🏆 ${m.winner}</div>` : '';
    html += `
      <div class="card ${cls}">
        <div class="card-teams">
          <div class="team">${teamAvatar(m.home)}<div class="team-name">${m.home}</div></div>
          <div class="vs">${m.score || '—'}</div>
          <div class="team right">${teamAvatar(m.away)}<div class="team-name">${m.away}</div></div>
        </div>
        <div class="card-meta">
          <div class="meta-item">🏆 ${m.league}</div>
          <div class="meta-item">⚽ ${m.total} голов</div>
        </div>
        <div class="outcome-line">
          <span class="label">${emoji} Прогноз</span>
          <span class="fav">${m.prediction}</span>
        </div>
        ${winnerHtml}
      </div>
    `;
  });
  content.innerHTML = html;
}

function renderExpress(data) {
  const content = document.getElementById('content');
  if (!data || !data.matches || !data.matches.length) {
    content.innerHTML = '<div class="empty">Экспресс ещё не собран</div>';
    return;
  }
  let html = `
    <div class="express-hero">
      <div class="express-hero-title">🔥 ТОП-ЭКСПРЕСС</div>
      <div class="express-hero-sub">🎯 Все события на ТБ 2.5</div>
      <div class="express-hero-odd">${data.totalOdd}</div>
      <div class="express-hero-label">итоговый коэффициент</div>
    </div>
    <div class="express-items-title">📊 СОБЫТИЯ (${data.count})</div>
  `;
  data.matches.forEach((m, i) => {
    const prob = parseInt(m.probability) || 0;
    const oddNum = parseFloat(m.odd) || 1;
    html += `
      <div class="express-card">
        <div class="express-card-head">
          <span class="express-num">${i + 1}</span>
          <span class="express-match">${m.home} — ${m.away}</span>
        </div>
        <div class="express-league">🏆 ${m.league}</div>
        <div class="express-card-body">
          <div class="express-stat"><div class="express-stat-label">📊 Тотал</div><div class="express-stat-value">${m.total}</div></div>
          <div class="express-stat"><div class="express-stat-label">🎯 Вероят.</div><div class="express-stat-value" style="color:${prob>=65?'#4ade80':'#fbbf24'}">${prob}%</div></div>
          <div class="express-stat"><div class="express-stat-label">💰 Кэф</div><div class="express-odd">${oddNum.toFixed(2)}</div></div>
        </div>
      </div>
    `;
    if (i < data.matches.length - 1) html += `<div class="express-divider">⚽</div>`;
  });
  html += `
    <div class="express-footer">
      <div class="express-footer-row"><span>🎯 Стратегия</span><span>Тотал Больше 2.5</span></div>
      <div class="express-footer-row"><span>📊 Событий</span><span>${data.count}</span></div>
      <div class="express-footer-row"><span>💰 Общий кэф</span><span class="express-footer-odd">${data.totalOdd}</span></div>
    </div>
  `;
  content.innerHTML = html;
}

function renderStats(data) {
  if (!data) { document.getElementById('content').innerHTML = '<div class="empty">Статистики пока нет</div>'; return; }
  document.getElementById('content').innerHTML = `
    <div class="stats-wrap">
      <div class="stats-big">${data.accuracy}%</div>
      <div class="stats-label">Точность прогнозов</div>
      <div class="stats-grid">
        <div class="stats-box win clickable" onclick="openHistory('wins')">
          <span class="num">${data.wins}</span>
          <span class="name">✅ Зашло →</span>
        </div>
        <div class="stats-box lose clickable" onclick="openHistory('loses')">
          <span class="num">${data.loses}</span>
          <span class="name">❌ Не зашло →</span>
        </div>
      </div>
      <div class="stats-box clickable" onclick="openHistory('all')" style="margin-top:12px;">
        <span class="num">${data.total}</span>
        <span class="name">📈 Всего матчей →</span>
      </div>
    </div>
  `;
}

function renderFaq() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="faq-header">
      <div class="faq-header-icon">⚽</div>
      <div class="faq-header-title">FAQ</div>
      <div class="faq-header-sub">Как работает бот</div>
    </div>

    <div class="faq-section">
      <div class="faq-section-title">🎯 Логика прогнозов</div>

function contactSupport() {
  haptic('light');
  if (tg?.openTelegramLink) {
    tg.openTelegramLink('https://t.me/total25_signals_bot');
  } else {
    window.open('https://t.me/total25_signals_bot', '_blank');
  }
}

async function openHistory(filter) {
  haptic('light');
  const content = document.getElementById('content');
  content.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  const titles = { wins: '✅ ЗАШЕДШИЕ', loses: '❌ НЕЗАШЕДШИЕ', all: '📋 ВСЕ МАТЧИ' };
  try {
    const resp = await fetch(`${API_URL}?action=history&filter=${filter}`);
    const raw = await resp.json();
    const data = Array.isArray(raw) ? raw : (raw.data || []);
    let html = `<button class="filter" onclick="loadData()" style="margin-bottom:14px;">← Назад</button>`;
    html += `<div class="section-title">${titles[filter]}</div>`;
    html += `<div class="section-sub">Найдено: ${data.length}</div>`;
    if (!data.length) {
      html += '<div class="empty">Пока нет матчей</div>';
    } else {
      data.forEach(m => {
        const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
        const cls = m.status === 'win' ? 'card-win' : m.status === 'lose' ? 'card-lose' : '';
        const winnerHtml = m.winner ? `<div class="winner-badge">🏆 ${m.winner}</div>` : '';
        html += `
          <div class="card ${cls}">
            <div class="card-teams">
              <div class="team">${teamAvatar(m.home)}<div class="team-name">${m.home}</div></div>
              <div class="vs">${m.score || '—'}</div>
              <div class="team right">${teamAvatar(m.away)}<div class="team-name">${m.away}</div></div>
            </div>
            <div class="card-meta">
              <div class="meta-item">🏆 ${m.league}</div>
              <div class="meta-item">📅 ${m.date}</div>
              <div class="meta-item">⚽ ${m.total}</div>
            </div>
            <div class="outcome-line">
              <span class="label">${emoji} ${m.prediction}</span>
              <span class="fav">${emoji}</span>
            </div>
            ${winnerHtml}
          </div>
        `;
      });
    }
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

function toggleFav(home, away) {
  haptic('medium');
  const key = `${home}_${away}`;
  const idx = favorites.indexOf(key);
  if (idx >= 0) favorites.splice(idx, 1);
  else favorites.push(key);
  localStorage.setItem('tb25_favorites', JSON.stringify(favorites));
  renderMatches(allMatches);
}
function esc(s) { return String(s).replace(/'/g, "\\'"); }

loadData();
