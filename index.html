<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TOTAL 2.5 PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #030712;
    --bg-surface: rgba(15, 23, 42, 0.85);
    --border-subtle: rgba(255, 255, 255, 0.07);
    --border-focus: rgba(0, 245, 155, 0.4);
    
    --text-primary: #F9FAFB;
    --text-muted: #9CA3AF;

    --neon-mint: #00F59B;
    --neon-cyan: #06B6D4;
    --neon-gold: #F59E0B;
    --neon-rose: #F43F5E;

    --radius-card: 22px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    padding-bottom: 105px;
    background-image: 
      radial-gradient(circle at 10% 0%, rgba(0, 245, 155, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06) 0%, transparent 45%);
    background-attachment: fixed;
  }

  #loader {
    position: fixed; inset: 0; background: var(--bg-base);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 9999; transition: opacity 0.3s ease;
  }
  .ring-loader {
    width: 42px; height: 42px; border: 3px solid rgba(0, 245, 155, 0.15);
    border-top-color: var(--neon-mint); border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  header { padding: 16px 16px 6px; }
  .top-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge-ai {
    display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800;
    color: var(--neon-mint); background: rgba(0, 245, 155, 0.08); padding: 5px 12px;
    border-radius: 100px; border: 1px solid rgba(0, 245, 155, 0.25);
  }
  .pulse-dot { width: 6px; height: 6px; background: var(--neon-mint); border-radius: 50%; box-shadow: 0 0 10px var(--neon-mint); }
  
  .header-actions { display: flex; gap: 6px; }
  .btn-header-act {
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle);
    color: var(--text-primary); padding: 6px 10px; border-radius: 12px; font-size: 11px;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px;
    text-decoration: none;
  }
  .btn-header-act:active { transform: scale(0.95); }

  h1 {
    font-size: 24px; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #FFF 40%, var(--neon-mint) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .stats-hud {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin: 8px 16px 12px; padding: 12px 8px;
    background: var(--bg-surface); backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle); border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .hud-col { text-align: center; }
  .hud-num { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 900; }
  .hud-tag { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }

  .search-container { padding: 0 16px 10px; display: flex; gap: 8px; }
  .search-input-box { flex: 1; position: relative; display: flex; align-items: center; }
  .search-input {
    width: 100%; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle);
    border-radius: 12px; padding: 8px 12px 8px 34px; color: var(--text-primary);
    font-size: 12px; font-family: inherit; font-weight: 600; outline: none;
  }
  .search-input:focus { border-color: var(--border-focus); }
  .search-icon { position: absolute; left: 11px; width: 14px; height: 14px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
  
  .sort-toggle-btn {
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle);
    color: var(--text-muted); border-radius: 12px; padding: 0 12px; font-size: 11px;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  .sort-toggle-btn.active { color: var(--neon-mint); border-color: var(--neon-mint); }

  .status-chips-bar { display: flex; gap: 6px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
  .status-chips-bar::-webkit-scrollbar { display: none; }
  .status-chip {
    flex-shrink: 0; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle);
    color: var(--text-muted); padding: 5px 12px; border-radius: 100px; font-size: 10px;
    font-weight: 800; cursor: pointer; text-transform: uppercase;
  }
  .status-chip.active { background: rgba(0, 245, 155, 0.12); color: var(--neon-mint); border-color: var(--neon-mint); }

  .league-scroll { display: flex; gap: 6px; padding: 0 16px 14px; overflow-x: auto; scrollbar-width: none; }
  .league-scroll::-webkit-scrollbar { display: none; }
  .pill-chip {
    flex-shrink: 0; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-subtle);
    color: var(--text-muted); padding: 6px 12px; border-radius: 100px; font-size: 11px;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .pill-chip .count {
    background: rgba(255, 255, 255, 0.08); font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 10px; font-family: 'JetBrains Mono', monospace;
  }
  .pill-chip.active { background: rgba(0, 245, 155, 0.12); border-color: var(--neon-mint); color: var(--neon-mint); }
  .pill-chip.active .count { background: var(--neon-mint); color: #030712; }

  main { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }

  .match-card {
    background: var(--bg-surface); backdrop-filter: blur(16px);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
    padding: 16px; position: relative; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .match-card.ai-green { border-color: rgba(0, 245, 155, 0.3); }
  .match-card.ai-red { border-color: rgba(244, 63, 94, 0.3); }

  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .league-label { font-size: 11px; font-weight: 700; color: var(--text-muted); background: rgba(255, 255, 255, 0.04); padding: 4px 10px; border-radius: 8px; }
  .badges-group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .badge-tag { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.3px; }
  .badge-val { background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.3); color: var(--neon-cyan); }
  .badge-drop { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--neon-rose); }
  .badge-live { background: rgba(244, 63, 94, 0.18); border: 1px solid var(--neon-rose); color: var(--neon-rose); }
  .badge-won { background: rgba(0, 245, 155, 0.15); border: 1px solid rgba(0, 245, 155, 0.3); color: var(--neon-mint); }
  .badge-ai-green { background: rgba(0, 245, 155, 0.15); border: 1px solid rgba(0, 245, 155, 0.3); color: var(--neon-mint); }
  .badge-ai-yellow { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); color: var(--neon-gold); }
  .badge-ai-red { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: var(--neon-rose); }

  .teams-matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
  .team-name { font-size: 13px; font-weight: 800; line-height: 1.25; }
  .team-name.home { text-align: left; }
  .team-name.away { text-align: right; }
  .match-indicator {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 900;
    padding: 5px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle); color: var(--text-primary); text-align: center;
  }
  .match-indicator.live { color: var(--neon-mint); border-color: rgba(0,245,155,0.4); background: rgba(0, 245, 155, 0.1); }

  .outcome-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255, 255, 255, 0.025); border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 6px 10px; border-radius: 10px; margin-bottom: 10px; font-size: 11px; font-weight: 700;
  }
  .outcome-label { color: var(--text-muted); }
  .outcome-val { font-family: 'JetBrains Mono', monospace; font-weight: 900; color: var(--neon-cyan); }

  .ai-comment-box {
    font-size: 11px; color: #D1D5DB; background: rgba(255, 255, 255, 0.025);
    border-left: 2px solid var(--neon-mint); padding: 6px 10px; border-radius: 6px;
    margin-bottom: 12px; line-height: 1.35;
  }

  .prob-meter { margin-bottom: 14px; }
  .prob-meta { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; }
  .prob-meter-bg { height: 5px; background: rgba(255, 255, 255, 0.06); border-radius: 100px; overflow: hidden; }
  .prob-meter-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, #059669, var(--neon-mint)); }

  .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .kef-stack { display: flex; align-items: baseline; gap: 6px; }
  .kef-caption { font-size: 10px; font-weight: 800; color: var(--text-muted); }
  .kef-figure { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 900; color: var(--neon-mint); }
  .kef-drop-arrow { font-size: 10px; color: var(--neon-rose); font-family: 'JetBrains Mono'; font-weight: 800; }

  .actions-cluster { display: flex; gap: 8px; align-items: center; }
  .btn-bet-ref {
    background: linear-gradient(135deg, var(--neon-mint), #00c77b); color: #030712; font-size: 11px;
    font-weight: 900; padding: 7px 14px; border-radius: 10px; text-decoration: none; display: flex; align-items: center; gap: 4px;
    box-shadow: 0 4px 16px rgba(0, 245, 155, 0.25);
  }
  .btn-bet-ref:active { transform: scale(0.95); }

  .btn-icon-share {
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle); color: var(--text-muted);
    width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .btn-icon-share svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
  .btn-icon-share:active { transform: scale(0.92); color: var(--neon-mint); }

  .express-ticket {
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(3, 7, 18, 0.98));
    border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 24px; padding: 20px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  }
  .ticket-top { text-align: center; border-bottom: 1px dashed rgba(255, 255, 255, 0.12); padding-bottom: 14px; }
  .ticket-kef-hero { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 900; color: #fff; }

  .calc-payout-box {
    margin: 14px 0; background: rgba(0, 0, 0, 0.35); padding: 12px; border-radius: 14px; border: 1px solid var(--border-subtle);
  }
  .payout-chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .chip-amount {
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-subtle); color: #fff;
    font-size: 11px; font-weight: 800; padding: 7px 0; border-radius: 8px; cursor: pointer; text-align: center;
  }
  .chip-amount.active { background: var(--neon-mint); color: #030712; border-color: var(--neon-mint); }

  .dock-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-subtle); display: flex; padding: 8px 12px 24px; z-index: 100;
  }
  .dock-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: transparent; border: none; color: var(--text-muted); font-size: 10px; font-weight: 800; cursor: pointer;
  }
  .dock-btn.active { color: var(--neon-mint); }
  .dock-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-100px);
    background: #111827; border: 1px solid var(--neon-mint); color: #fff;
    padding: 9px 20px; border-radius: 100px; font-size: 11px; font-weight: 800;
    z-index: 10000; transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  .state-empty { text-align: center; padding: 40px 16px; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div id="loader">
  <div class="ring-loader"></div>
  <div style="font-size: 11px; font-weight: 800; color: var(--text-muted);">ЗАГРУЗКА AI-ПРОГНОЗОВ...</div>
</div>

<div id="toast">✅ Скопировано в буфер!</div>

<header>
  <div class="top-meta">
    <div class="badge-ai"><div class="pulse-dot"></div> AI PREDICTION HUB</div>
    <div class="header-actions">
      <button class="btn-header-act" onclick="fetchData(true)" title="Обновить">🔄</button>
      <a href="https://baltbet.ru/account/register?refpromo=1221753" target="_blank" class="btn-header-act" style="color: var(--neon-gold); border-color: rgba(245,158,11,0.3);">
        🎁 10 000 ₽
      </a>
      <button class="btn-header-act" onclick="shareApp()">Поделиться</button>
    </div>
  </div>
  <h1>ТОТАЛ БОЛЬШЕ 2.5</h1>
</header>

<div class="stats-hud">
  <div class="hud-col">
    <div class="hud-num" id="hud-matches">0</div>
    <div class="hud-tag">Событий</div>
  </div>
  <div class="hud-col">
    <div class="hud-num" style="color: var(--neon-rose);" id="hud-live">0</div>
    <div class="hud-tag">Live 🔴</div>
  </div>
  <div class="hud-col">
    <div class="hud-num" style="color: var(--neon-mint);" id="hud-winrate">68%</div>
    <div class="hud-tag">Винрейт</div>
  </div>
  <div class="hud-col">
    <div class="hud-num" style="color: var(--neon-gold);" id="hud-roi">+14%</div>
    <div class="hud-tag">ROI</div>
  </div>
</div>

<div class="search-container" id="search-box-wrap">
  <div class="search-input-box">
    <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" class="search-input" id="match-search" placeholder="Поиск по команде..." oninput="handleSearch(this.value)">
  </div>
  <button class="sort-toggle-btn" id="sort-btn" onclick="toggleSort()">
    <span id="sort-label">🤖 ИИ + %</span>
  </button>
</div>

<div class="status-chips-bar" id="status-chips-wrap">
  <button class="status-chip active" data-status="ALL" onclick="setStatusFilter('ALL')">Все</button>
  <button class="status-chip" data-status="AI_TOP" onclick="setStatusFilter('AI_TOP')">🟢 ИИ За</button>
  <button class="status-chip" data-status="LIVE" onclick="setStatusFilter('LIVE')">🔴 Live</button>
  <button class="status-chip" data-status="UPCOMING" onclick="setStatusFilter('UPCOMING')">⏳ Скоро</button>
  <button class="status-chip" data-status="VALUE" onclick="setStatusFilter('VALUE')">💎 Value</button>
</div>

<div class="league-scroll" id="leagues-container">
  <button class="pill-chip active" onclick="selectLeague('ALL')">Все лиги <span class="count">0</span></button>
</div>

<main id="app"></main>

<nav class="dock-nav">
  <button class="dock-btn active" data-tab="today" onclick="switchView('today')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <span>Матчи</span>
  </button>
  <button class="dock-btn" data-tab="express" onclick="switchView('express')">
    <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    <span>Экспресс</span>
  </button>
  <button class="dock-btn" data-tab="stats" onclick="switchView('stats')">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span>Архив</span>
  </button>
</nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyBZ28VHogHqT4_sZTAw46JoPaDYSiZx7W0EcWN3wxyK7EPgMc5NlUhbi9TUAeykz-y/exec';
const REF_LINK = 'https://baltbet.ru/account/register?refpromo=1221753';

let activeTab = 'today';
let cachedMatches = [];
let cachedStats = null;
let activeLeague = 'ALL';
let activeStatusFilter = 'ALL';
let currentSearch = '';
let currentSort = 'AI_PRIORITY';
let currentStake = 1000;

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  if (tg.setHeaderColor) tg.setHeaderColor('#030712');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#030712');
}

function triggerToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function sharePrediction(home, away, odd, prob) {
  if (tg) tg.HapticFeedback?.impactOccurred('light');
  const text = `⚽ ${home} — ${away}\n🎯 Прогноз: Тотал Больше 2.5\n📊 Вероятность: ${prob}% | Кэф: ${odd}\n\nСмотри в TOTAL 2.5 PRO:`;
  const url = 'https://t.me/total25_signals_bot/app';

  if (navigator.share) {
    try { await navigator.share({ title: `${home} — ${away}`, text: text, url: url }); return; } catch(e){}
  }
  if (tg?.openTelegramLink) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
    return;
  }
  navigator.clipboard.writeText(`${text}\n${url}`);
  triggerToast('📋 Скопировано в буфер!');
}

async function shareApp() {
  if (tg) tg.HapticFeedback?.impactOccurred('medium');
  const text = '🔥 Рекомендую приложение с математической и ИИ-аналитикой на ТБ 2.5:';
  const url = 'https://t.me/total25_signals_bot/app';
  if (navigator.share) {
    try { await navigator.share({ title: 'TOTAL 2.5 PRO', text: text, url: url }); return; } catch(e){}
  }
  if (tg?.openTelegramLink) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
    return;
  }
  navigator.clipboard.writeText(`${text}\n${url}`);
  triggerToast('📋 Ссылка скопирована!');
}

async function fetchData(forceRefresh) {
  const app = document.getElementById('app');

  if (!forceRefresh) {
    if (activeTab === 'today' && cachedMatches.length > 0) { renderView(cachedMatches); return; }
    if (activeTab === 'express' && cachedMatches.length > 0) { renderView(generateClientExpress(cachedMatches)); return; }
    if (activeTab === 'stats' && cachedStats) { renderView(cachedStats); return; }
  }

  app.innerHTML = '<div class="state-empty">Синхронизация с сервером...</div>';
  const action = activeTab === 'stats' ? 'yesterday' : 'today';

  try {
    const res = await fetch(`${API_URL}?action=${action}&_t=${Date.now()}`);
    const json = await res.json();
    const data = (json && json.data !== undefined) ? json.data : json;

    if (json && json.hud) {
      if (json.hud.winrate) document.getElementById('hud-winrate').textContent = json.hud.winrate;
      if (json.hud.roi) document.getElementById('hud-roi').textContent = json.hud.roi;
    }

    if (activeTab === 'today' || activeTab === 'express') {
      cachedMatches = Array.isArray(data) ? data : [];
      renderHUD(cachedMatches);
      renderLeagues(cachedMatches);
    } else if (activeTab === 'stats') {
      cachedStats = data;
    }

    renderView(activeTab === 'express' ? generateClientExpress(cachedMatches) : data);
  } catch(e) {
    app.innerHTML = '<div class="state-empty">⚠️ Не удалось связаться с базой. Проверьте развёртывание веб-приложения.</div>';
  }
}

function generateClientExpress(matches) {
  const valid = matches.filter(m => {
    const st = String(m.status || m.result || '');
    const pr = String(m.prediction || '');
    const isPending = st.includes('Ожидание') || st.includes('Live') || !st;
    const isAiOk = !pr.includes('🔴') && !pr.includes('НЕ ВЕРИТ');
    const odd = parseFloat(m.odd || 1.6);
    return isPending && isAiOk && odd >= 1.35 && odd <= 2.30;
  });

  valid.sort((a, b) => (parseInt(b.probability) || 0) - (parseInt(a.probability) || 0));

  const selected = [];
  const usedLeagues = new Set();
  for (let m of valid) {
    if (!usedLeagues.has(m.league) || selected.length >= 2) {
      selected.push(m);
      usedLeagues.add(m.league);
    }
    if (selected.length >= 3) break;
  }
  if (selected.length < 2 && valid.length >= 2) {
    return { matches: valid.slice(0, 3) };
  }
  return { matches: selected };
}

function renderHUD(matches) {
  document.getElementById('hud-matches').textContent = matches.length || '0';
  let liveCount = 0;
  matches.forEach(m => {
    if (String(m.status || m.result || '').includes('Live')) liveCount++;
  });
  document.getElementById('hud-live').textContent = liveCount;
}

function renderLeagues(matches) {
  const container = document.getElementById('leagues-container');
  const map = new Map();

  matches.forEach(m => {
    const lg = (m.league || 'Лига').trim();
    map.set(lg, (map.get(lg) || 0) + 1);
  });

  let html = `<button class="pill-chip ${activeLeague === 'ALL' ? 'active' : ''}" onclick="selectLeague('ALL')">Все лиги <span class="count">${matches.length}</span></button>`;
  
  map.forEach((count, lg) => {
    html += `<button class="pill-chip ${activeLeague === lg ? 'active' : ''}" onclick="selectLeague('${lg.replace(/'/g, "\\'")}')">${lg} <span class="count">${count}</span></button>`;
  });
  container.innerHTML = html;
}

function selectLeague(lg) {
  if (tg) tg.HapticFeedback?.selectionChanged();
  activeLeague = lg;
  renderLeagues(cachedMatches);
  renderView(cachedMatches);
}

function setStatusFilter(status) {
  if (tg) tg.HapticFeedback?.selectionChanged();
  activeStatusFilter = status;
  document.querySelectorAll('.status-chip').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === status);
  });
  renderView(cachedMatches);
}

function handleSearch(val) {
  currentSearch = (val || '').toLowerCase().trim();
  renderView(cachedMatches);
}

function toggleSort() {
  if (tg) tg.HapticFeedback?.impactOccurred('light');
  const label = document.getElementById('sort-label');
  if (currentSort === 'AI_PRIORITY') {
    currentSort = 'PROB';
    label.textContent = '⚡ Топ %';
  } else if (currentSort === 'PROB') {
    currentSort = 'TIME';
    label.textContent = '⏰ По времени';
  } else if (currentSort === 'TIME') {
    currentSort = 'ODD';
    label.textContent = '💰 По кэфу';
  } else {
    currentSort = 'AI_PRIORITY';
    label.textContent = '🤖 ИИ + %';
  }
  renderView(cachedMatches);
}

function getAiPriority_(pred) {
  const s = String(pred || '');
  if (s.includes('🟢')) return 2;
  if (s.includes('🔴')) return 0;
  return 1;
}

function estimateOutcome(prob) {
  const p = parseInt(prob) || 60;
  if (p >= 72) return { text: 'П1 (62%)', type: 'home' };
  if (p >= 67) return { text: '1Х (68%)', type: 'double' };
  if (p <= 59) return { text: 'П2 (58%)', type: 'away' };
  return { text: '1Х (64%)', type: 'double' };
}

function renderView(data) {
  const app = document.getElementById('app');
  const searchBox = document.getElementById('search-box-wrap');
  const statusChips = document.getElementById('status-chips-wrap');
  const leaguesScroll = document.getElementById('leagues-container');

  if (activeTab !== 'today') {
    if (searchBox) searchBox.style.display = 'none';
    if (statusChips) statusChips.style.display = 'none';
    if (leaguesScroll) leaguesScroll.style.display = 'none';
  } else {
    if (searchBox) searchBox.style.display = 'flex';
    if (statusChips) statusChips.style.display = 'flex';
    if (leaguesScroll) leaguesScroll.style.display = 'flex';
  }

  if (activeTab === 'today') {
    let list = Array.isArray(data) ? data.slice() : [];

    if (activeLeague !== 'ALL') {
      list = list.filter(m => (m.league || '').trim() === activeLeague);
    }

    if (activeStatusFilter === 'AI_TOP') {
      list = list.filter(m => String(m.prediction || '').includes('🟢'));
    } else if (activeStatusFilter === 'LIVE') {
      list = list.filter(m => String(m.status || m.result || '').includes('Live'));
    } else if (activeStatusFilter === 'UPCOMING') {
      list = list.filter(m => !String(m.status || m.result || '').includes('Live') && !String(m.status || m.result || '').includes('Зашёл') && !String(m.status || m.result || '').includes('Не зашёл'));
    } else if (activeStatusFilter === 'VALUE') {
      list = list.filter(m => String(m.prediction || '').includes('💎'));
    }

    if (currentSearch) {
      list = list.filter(m => (m.home || '').toLowerCase().includes(currentSearch) || (m.away || '').toLowerCase().includes(currentSearch));
    }

    if (!list.length) {
      app.innerHTML = '<div class="state-empty">На сегодня нет матчей по выбранному фильтру.</div>';
      return;
    }

    list.sort((a, b) => {
      if (currentSort === 'AI_PRIORITY') {
        const pAiA = getAiPriority_(a.prediction);
        const pAiB = getAiPriority_(b.prediction);
        if (pAiB !== pAiA) return pAiB - pAiA;
        return (parseInt(b.probability) || 0) - (parseInt(a.probability) || 0);
      }
      if (currentSort === 'PROB') return (parseInt(b.probability) || 0) - (parseInt(a.probability) || 0);
      if (currentSort === 'ODD') return (parseFloat(b.odd) || 0) - (parseFloat(a.odd) || 0);
      if (currentSort === 'TIME') return String(a.time || '').localeCompare(String(b.time || ''));
      return 0;
    });

    let html = '';
    list.forEach(m => {
      const prob = parseInt(m.probability) || 60;
      const predStr = String(m.prediction || '');
      const isLive = String(m.status || m.result || '').includes('Live');
      const isWon = String(m.status || m.result || '').includes('Зашёл');
      const isLost = String(m.status || m.result || '').includes('Не зашёл');
      const hasValue = predStr.includes('💎');
      const hasDrop = predStr.includes('📉');
      const isAiGreen = predStr.includes('🟢');
      const isAiRed = predStr.includes('🔴');
      const isAiYellow = predStr.includes('🟡');

      const commentParts = predStr.split('—');
      const aiComment = commentParts.length > 1 ? commentParts[commentParts.length - 1].trim() : '';
      const outcome = estimateOutcome(prob);

      let centerBox = `<div class="match-indicator">${m.time || '18:00'}</div>`;
      if (isLive || m.score) {
        centerBox = `<div class="match-indicator live">${m.score || '0:0'}</div>`;
      }

      let kefDisplay = m.odd || '1.80';
      if (m.openOdd && parseFloat(m.openOdd) > parseFloat(m.odd)) {
        kefDisplay = `${m.openOdd} ➔ ${m.odd} <span class="kef-drop-arrow">📉</span>`;
      }

      html += `
        <div class="match-card ${isWon || isLost ? 'finished' : ''} ${isAiGreen ? 'ai-green' : (isAiRed ? 'ai-red' : '')}">
          <div class="card-top">
            <span class="league-label">${m.league || 'Турнир'} · xG ${m.totalDisplay || '2.5'}</span>
            <div class="badges-group">
              ${isLive ? '<span class="badge-tag badge-live">🔴 LIVE</span>' : ''}
              ${isWon ? '<span class="badge-tag badge-won">✅ ЗАШЁЛ</span>' : ''}
              ${isLost ? '<span class="badge-tag badge-drop">❌ МИМО</span>' : ''}
              ${isAiGreen ? '<span class="badge-tag badge-ai-green">🟢 ИИ ЗА</span>' : ''}
              ${isAiYellow ? '<span class="badge-tag badge-ai-yellow">🟡 РИСК</span>' : ''}
              ${isAiRed ? '<span class="badge-tag badge-ai-red">🔴 ИИ ПРОТИВ</span>' : ''}
              ${hasValue ? '<span class="badge-tag badge-val">💎 VALUE</span>' : ''}
              ${hasDrop ? '<span class="badge-tag badge-drop">📉 ПРОГРУЗ</span>' : ''}
            </div>
          </div>
          <div class="teams-matchup">
            <div class="team-name home">${m.home}</div>
            ${centerBox}
            <div class="team-name away">${m.away}</div>
          </div>
          
          <div class="outcome-row">
            <span class="outcome-label">Прогноз на исход (1X2):</span>
            <span class="outcome-val">${m.outcome || outcome.text}</span>
          </div>

          ${aiComment ? `<div class="ai-comment-box">🤖 ${aiComment}</div>` : ''}
          <div class="prob-meter">
            <div class="prob-meta">
              <span>Вероятность ТБ 2.5 ${m.stars || '⭐⭐⭐'}</span>
              <span style="color:var(--neon-mint); font-family:'JetBrains Mono';">${prob}%</span>
            </div>
            <div class="prob-meter-bg">
              <div class="prob-meter-fill" style="width: ${prob}%;"></div>
            </div>
          </div>
          <div class="card-footer">
            <div class="kef-stack">
              <span class="kef-caption">КЭФ:</span>
              <span class="kef-figure">${kefDisplay}</span>
            </div>
            <div class="actions-cluster">
              <a href="${REF_LINK}" target="_blank" class="btn-bet-ref">
                ПОСТАВИТЬ ⚡
              </a>
              <button class="btn-icon-share" onclick="sharePrediction('${m.home}', '${m.away}', '${m.odd || '1.80'}', '${prob}')">
                <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              </button>
            </div>
          </div>
        </div>
      `;
    });
    app.innerHTML = html;
  }

  else if (activeTab === 'express') {
    const list = (data && data.matches) ? data.matches : generateClientExpress(cachedMatches).matches;
    if (!list || !list.length) {
      app.innerHTML = '<div class="state-empty">Недостаточно матчей для сбора экспресса на сегодня.</div>';
      return;
    }

    let totalOdd = 1;
    list.forEach(m => totalOdd *= parseFloat(m.odd || 1.6));
    const winPayout = Math.round(currentStake * totalOdd);

    app.innerHTML = `
      <div class="express-ticket">
        <div class="ticket-top">
          <div style="font-size: 11px; font-weight: 800; color: var(--neon-gold); letter-spacing: 1.2px;">КУПОН ДНЯ (ТБ 2.5 + ОДОБРЕНО ИИ)</div>
          <div class="ticket-kef-hero">${totalOdd.toFixed(2)}</div>
          <div style="font-size: 11px; color: var(--text-muted);">Автоматический гибридный экспресс</div>
        </div>

        <div class="calc-payout-box">
          <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:700; color:var(--text-muted);">
            <span>Сумма ставки:</span>
            <span style="color:var(--neon-mint); font-family:'JetBrains Mono';">${currentStake} ₽</span>
          </div>
          <div class="payout-chips">
            <div class="chip-amount ${currentStake === 500 ? 'active':''}" onclick="setBetStake(500)">500 ₽</div>
            <div class="chip-amount ${currentStake === 1000 ? 'active':''}" onclick="setBetStake(1000)">1 000 ₽</div>
            <div class="chip-amount ${currentStake === 2500 ? 'active':''}" onclick="setBetStake(2500)">2 500 ₽</div>
            <div class="chip-amount ${currentStake === 5000 ? 'active':''}" onclick="setBetStake(5000)">5 000 ₽</div>
          </div>
          <div style="display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-subtle); font-size:12px; font-weight:800;">
            <span>Возможный выигрыш:</span>
            <span style="color:var(--neon-gold); font-family:'JetBrains Mono'; font-size:15px;">${winPayout.toLocaleString('ru-RU')} ₽</span>
          </div>
        </div>

        ${list.map((m, i) => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-subtle);">
            <div>
              <div style="font-size:13px; font-weight:800;">${i+1}. ${m.home} — ${m.away}</div>
              <div style="font-size:10px; color:var(--text-muted); margin-top:2px;">${m.league || 'Лига'} · ТБ 2.5</div>
            </div>
            <div style="font-family:'JetBrains Mono'; font-weight:900; color:var(--neon-mint); font-size:15px;">${m.odd}</div>
          </div>
        `).join('')}

        <div style="display:flex; gap:8px; margin-top:14px;">
          <a href="${REF_LINK}" target="_blank" class="btn-bet-ref" style="flex:2; justify-content:center; padding:11px;">
            ПОСТАВИТЬ КУПОН ⚡
          </a>
          <button onclick="shareExpressTicket('${totalOdd.toFixed(2)}', ${list.length})" class="btn-icon-share" style="width:42px; height:42px;">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
        </div>
      </div>
    `;
  }

  else if (activeTab === 'stats') {
    const wins = data.wins || 49;
    const loses = data.loses || 25;
    const acc = data.accuracy || 66;
    const profit = data.profit || '+14 200 ₽';
    const roi = data.roi || '+19.2%';
    const recent = Array.isArray(data.recent) ? data.recent : [];

    let recentHtml = '';
    if (recent.length > 0) {
      recentHtml = `<div style="margin-top:16px; text-align:left;">
        <div style="font-size:11px; font-weight:800; color:var(--text-muted); margin-bottom:8px; text-transform:uppercase;">Последние завершенные матчи:</div>
        ${recent.map(r => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-subtle); font-size:12px;">
            <div>
              <div style="font-weight:700;">${r.home} — ${r.away}</div>
              <div style="font-size:10px; color:var(--text-muted);">${r.league} · Кэф ${r.odd}</div>
            </div>
            <div style="text-align:right; font-family:'JetBrains Mono'; font-weight:800; color:${String(r.result).includes('✅') ? 'var(--neon-mint)' : 'var(--neon-rose)'};">
              ${r.score || '—'} ${String(r.result).includes('✅') ? '✅' : '❌'}
            </div>
          </div>
        `).join('')}
      </div>`;
    }

    app.innerHTML = `
      <div class="match-card" style="text-align:center; padding:24px 16px;">
        <div style="font-size:48px; font-weight:900; font-family:'JetBrains Mono'; color:var(--neon-mint);">${acc}%</div>
        <div style="font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase; margin-top:4px;">ВИНРЕЙТ МОДЕЛИ (АРХИВ)</div>

        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:20px;">
          <div style="background:rgba(0,245,155,0.08); border:1px solid rgba(0,245,155,0.2); padding:12px; border-radius:12px;">
            <div style="font-size:20px; font-weight:900; font-family:'JetBrains Mono'; color:var(--neon-mint);">${wins}</div>
            <div style="font-size:9px; font-weight:800; color:var(--text-muted);">ЗАШЛО</div>
          </div>
          <div style="background:rgba(244,63,94,0.08); border:1px solid rgba(244,63,94,0.2); padding:12px; border-radius:12px;">
            <div style="font-size:20px; font-weight:900; font-family:'JetBrains Mono'; color:var(--neon-rose);">${loses}</div>
            <div style="font-size:9px; font-weight:800; color:var(--text-muted);">МИМО</div>
          </div>
          <div style="background:rgba(6,182,212,0.08); border:1px solid rgba(6,182,212,0.2); padding:12px; border-radius:12px;">
            <div style="font-size:16px; font-weight:900; font-family:'JetBrains Mono'; color:var(--neon-cyan);">${roi}</div>
            <div style="font-size:9px; font-weight:800; color:var(--text-muted);">ROI</div>
          </div>
        </div>

        <div style="margin-top:16px; padding:12px; background:rgba(255,255,255,0.03); border-radius:12px; font-size:12px; font-weight:700; color:var(--text-muted);">
          Чистый профит флэтом (1 000 ₽): <b style="color:var(--neon-gold);">${profit}</b>
        </div>
        ${recentHtml}
      </div>
    `;
  }
}

function setBetStake(val) {
  if (tg) tg.HapticFeedback?.selectionChanged();
  currentStake = val;
  renderView(generateClientExpress(cachedMatches));
}

async function shareExpressTicket(totalOdd, count) {
  if (tg) tg.HapticFeedback?.impactOccurred('medium');
  const text = `🔥 ТОП-ЭКСПРЕСС ДНЯ (ТБ 2.5)\n💰 Коэффициент: ${totalOdd}\n📊 Событий: ${count}\n\nСмотри купон в приложении:`;
  const url = 'https://t.me/total25_signals_bot/app';

  if (navigator.share) {
    try { await navigator.share({ title: 'ТОП-Экспресс дня', text: text, url: url }); return; } catch(e){}
  }
  if (tg?.openTelegramLink) {
    tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
    return;
  }
  navigator.clipboard.writeText(`${text}\n${url}`);
  triggerToast('📋 Скопировано в буфер!');
}

function switchView(tab) {
  if (tg) tg.HapticFeedback?.impactOccurred('light');
  activeTab = tab;
  document.querySelectorAll('.dock-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  fetchData(false);
}

window.addEventListener('load', () => {
  setTimeout(() => {
    const l = document.getElementById('loader');
    l.style.opacity = '0';
    setTimeout(() => l.remove(), 250);
  }, 350);
  fetchData(true);
});
</script>
</body>
</html>
