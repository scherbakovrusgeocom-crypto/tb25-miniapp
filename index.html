<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Прогнозы ТБ 2.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-1: #04120e;
  --bg-2: #08201a;
  --card-1: #0c2822;
  --card-2: #103630;
  --card-hi: rgba(255, 255, 255, 0.04);
  --glass: rgba(12, 40, 34, 0.72);
  --glass-strong: rgba(12, 40, 34, 0.9);
  --border: rgba(120, 220, 180, 0.09);
  --border-mid: rgba(120, 220, 180, 0.2);
  --border-strong: rgba(45, 212, 191, 0.45);
  --text: #eefdf7;
  --text-dim: #7fe4c0;
  --text-mute: #4d8471;
  --mint: #2dd4bf;
  --mint-glow: rgba(45, 212, 191, 0.35);
  --mint-soft: rgba(45, 212, 191, 0.12);
  --emerald: #10b981;
  --emerald-glow: rgba(16, 185, 129, 0.32);
  --gold: #fbbf24;
  --gold-glow: rgba(251, 191, 36, 0.4);
  --gold-soft: rgba(251, 191, 36, 0.12);
  --success: #4ade80;
  --success-glow: rgba(74, 222, 128, 0.35);
  --success-soft: rgba(74, 222, 128, 0.12);
  --danger: #fb7185;
  --danger-glow: rgba(251, 113, 133, 0.35);
  --danger-soft: rgba(251, 113, 133, 0.12);
}
body.light-theme {
  --bg-1: #f5fffb;
  --bg-2: #e8faf1;
  --card-1: #ffffff;
  --card-2: #f5fdfa;
  --card-hi: rgba(0, 0, 0, 0.015);
  --glass: rgba(255, 255, 255, 0.86);
  --glass-strong: rgba(255, 255, 255, 0.96);
  --border: rgba(16, 185, 129, 0.14);
  --border-mid: rgba(16, 185, 129, 0.24);
  --border-strong: rgba(16, 185, 129, 0.55);
  --text: #052e26;
  --text-dim: #0f766e;
  --text-mute: #4d8471;
  --mint: #14b8a6;
  --emerald: #059669;
  --gold: #d97706;
  --success: #16a34a;
  --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-1);
  color: var(--text);
  padding: 0 0 30px;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: background 0.4s ease, color 0.4s ease;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse 100% 60% at 50% -10%, rgba(45, 212, 191, 0.18), transparent 60%),
    radial-gradient(ellipse 80% 50% at 12% 85%, rgba(16, 185, 129, 0.12), transparent 60%),
    radial-gradient(ellipse 70% 40% at 90% 65%, rgba(251, 191, 36, 0.06), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  pointer-events: none;
  z-index: 0;
}
body.light-theme::before { opacity: 0.6; }
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 50% 50%, transparent 118px, rgba(45, 212, 191, 0.22) 118px, rgba(45, 212, 191, 0.22) 119px, transparent 119px),
    radial-gradient(circle at 50% 50%, rgba(45, 212, 191, 0.45) 3px, transparent 4px),
    linear-gradient(90deg, transparent 0%, transparent 4%, rgba(45, 212, 191, 0.16) 4%, rgba(45, 212, 191, 0.16) 96%, transparent 96%),
    radial-gradient(circle at 0% 0%, transparent 75px, rgba(45, 212, 191, 0.2) 75px, rgba(45, 212, 191, 0.2) 76px, transparent 76px),
    radial-gradient(circle at 100% 0%, transparent 75px, rgba(45, 212, 191, 0.2) 75px, rgba(45, 212, 191, 0.2) 76px, transparent 76px),
    radial-gradient(circle at 0% 100%, transparent 75px, rgba(45, 212, 191, 0.2) 75px, rgba(45, 212, 191, 0.2) 76px, transparent 76px),
    radial-gradient(circle at 100% 100%, transparent 75px, rgba(45, 212, 191, 0.2) 75px, rgba(45, 212, 191, 0.2) 76px, transparent 76px);
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.45;
}
body.light-theme::after { opacity: 0.22; }
html::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    repeating-linear-gradient(90deg, rgba(45, 212, 191, 0.028) 0px, rgba(45, 212, 191, 0.028) 50px, rgba(45, 212, 191, 0.008) 50px, rgba(45, 212, 191, 0.008) 100px),
    radial-gradient(circle, rgba(45, 212, 191, 0.05) 1px, transparent 1.4px);
  background-size: 100% 100%, 16px 16px;
  opacity: 0.85;
}
html:has(body.light-theme)::before { opacity: 0.35; }
.header { position: relative; padding: 28px 20px 22px; text-align: center; z-index: 1; }
.header-top { position: absolute; top: 16px; right: 16px; z-index: 5; }
.theme-btn {
  width: 42px; height: 42px;
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-mid);
  border-radius: 50%;
  color: var(--mint);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 var(--card-hi);
}
.theme-btn:active { transform: scale(0.88) rotate(25deg); border-color: var(--mint); }
.theme-btn svg { width: 18px; height: 18px; stroke-width: 2; }
.ball-wrap {
  width: 88px; height: 88px;
  margin: 0 auto 14px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
}
.ball-wrap::before {
  content: '';
  position: absolute;
  inset: -10px;
  background: radial-gradient(circle, var(--mint-glow), transparent 70%);
  border-radius: 50%;
  filter: blur(20px);
  animation: ballGlow 3.5s ease-in-out infinite;
}
.ball-wrap::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 130px; height: 130px;
  border: 1.5px solid rgba(45, 212, 191, 0.14);
  border-radius: 50%;
  animation: circleExpand 4s ease-in-out infinite;
}
@keyframes circleExpand {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.35; }
  50% { transform: translate(-50%, -50%) scale(1.18); opacity: 0.1; }
}
@keyframes ballGlow {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}
.ball-emoji {
  font-size: 60px;
  line-height: 1;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 6px 28px var(--mint-glow));
  animation: ballRotate 7s ease-in-out infinite;
}
@keyframes ballRotate {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
.header h1 {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--mint) 0%, var(--emerald) 50%, var(--mint) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShimmer 5s linear infinite;
  line-height: 1.1;
  filter: drop-shadow(0 0 24px var(--mint-glow));
}
@keyframes titleShimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.header .sub {
  font-size: 10px;
  letter-spacing: 5px;
  color: var(--text-dim);
  margin-top: 8px;
  text-transform: uppercase;
  font-weight: 800;
}
.header-chips { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
.header-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-mid);
  border-radius: 26px;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 var(--card-hi);
}
.header-chip svg { width: 15px; height: 15px; stroke-width: 2.2; color: var(--mint); }
.header-chip:active { transform: scale(0.94); border-color: var(--mint); box-shadow: 0 4px 16px var(--mint-glow); }
.header-chip.bonus-chip {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.16) 0%, rgba(45, 212, 191, 0.1) 50%, rgba(251, 191, 36, 0.16) 100%);
  border: 1px solid rgba(251, 191, 36, 0.4);
  box-shadow: 0 8px 24px rgba(251, 191, 36, 0.18);
}
.header-chip.bonus-chip::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.35) 50%, transparent 100%);
  animation: glassShimmer 8s ease-in-out infinite;
}
@keyframes glassShimmer {
  0%, 75% { left: -100%; }
  85% { left: 100%; }
  100% { left: 100%; }
}
.header-chip.bonus-chip svg { color: var(--gold); }
.header-chip.bonus-chip svg, .header-chip.bonus-chip span { position: relative; z-index: 1; }
.tabs-wrap {
  position: sticky;
  top: 0;
  background: var(--glass-strong);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  padding: 12px 14px;
  z-index: 10;
  border-bottom: 1px solid var(--border);
  transition: background 0.4s ease;
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: space-between; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 11px 4px;
  border-radius: 14px;
  font-size: 10px;
  font-weight: 800;
  color: var(--text-dim);
  border: 1px solid transparent;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  letter-spacing: 0.4px;
}
.tab svg { width: 20px; height: 20px; stroke-width: 2.2; }
.tab:active { transform: scale(0.94); }
.tab.active {
  background: linear-gradient(135deg, var(--mint-soft), rgba(45, 212, 191, 0.08));
  border-color: var(--mint);
  color: var(--mint);
  box-shadow: 0 0 24px var(--mint-glow), inset 0 1px 0 var(--card-hi);
}
#content { padding: 18px 16px; position: relative; z-index: 1; }
.card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px;
  margin-bottom: 16px;
  position: relative;
  animation: cardSlideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 12px 44px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--card-hi);
  overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
body.light-theme .card { box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06), inset 0 1px 0 var(--card-hi); }
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 24px 24px 0 0;
  background: linear-gradient(90deg, transparent, var(--mint), var(--emerald), var(--mint), transparent);
  opacity: 0.9;
}
.card::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 3px;
  border-radius: 24px 24px 0 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
  animation: topSheen 6s ease-in-out infinite;
}
@keyframes topSheen {
  0%, 70% { left: -100%; }
  85% { left: 100%; }
  100% { left: 100%; }
}
.card.card-hot::before {
  background: linear-gradient(90deg, transparent, var(--gold), #f59e0b, var(--gold), transparent);
  box-shadow: 0 0 22px var(--gold-glow);
}
.card.card-mid::before {
  background: linear-gradient(90deg, transparent, var(--success), var(--emerald), var(--success), transparent);
}
.card.card-live::before {
  background: linear-gradient(90deg, transparent, var(--danger), #f43f5e, var(--danger), transparent);
  animation: liveFlash 2s ease-in-out infinite, topSheen 6s ease-in-out infinite;
}
@keyframes liveFlash {
  0%, 100% { opacity: 0.75; }
  50% { opacity: 1; }
}
@keyframes cardSlideIn {
  0% { opacity: 0; transform: translateY(22px) scale(0.97); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.005); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.card-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; }
.card-num-badge {
  flex-shrink: 0;
  width: 34px; height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--mint-soft), rgba(45, 212, 191, 0.06));
  border: 1px solid rgba(45, 212, 191, 0.4);
  border-radius: 50%;
  color: var(--mint);
  font-size: 14px;
  font-weight: 800;
  margin-top: 1px;
  font-family: 'JetBrains Mono', monospace;
  box-shadow: 0 0 16px rgba(45, 212, 191, 0.18), inset 0 1px 0 var(--card-hi);
}
.card-teams-block { flex: 1; min-width: 0; }
.card-team {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.35;
  word-break: break-word;
  overflow-wrap: break-word;
  color: var(--text);
}
.card-team + .card-team { margin-top: 4px; color: var(--text-dim); font-weight: 700; }
.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 16px;
  font-weight: 700;
  flex-wrap: wrap;
  padding-top: 14px;
  border-top: 1px dashed var(--border-mid);
}
.card-meta .meta-item { display: flex; align-items: center; gap: 5px; }
.card-meta .meta-item.league { color: var(--gold); font-weight: 800; }
.card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-box {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.12));
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 6px 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
body.light-theme .stat-box { background: linear-gradient(180deg, rgba(16, 185, 129, 0.05), rgba(16, 185, 129, 0.02)); }
.stat-box::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 50%; height: 2px;
  border-radius: 2px;
}
.stat-box.blue::before { background: var(--mint); box-shadow: 0 0 12px var(--mint-glow); }
.stat-box.green::before { background: var(--success); box-shadow: 0 0 12px var(--success-glow); }
.stat-box.gold::before { background: var(--gold); box-shadow: 0 0 12px var(--gold-glow); }
.stat-box .label {
  font-size: 10px;
  color: var(--text-mute);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 1.2px;
  margin-bottom: 8px;
}
.stat-box .value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 25px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -0.5px;
}
.stat-box.blue .value { color: var(--mint); text-shadow: 0 0 20px var(--mint-glow); }
.stat-box.green .value { color: var(--success); text-shadow: 0 0 20px var(--success-glow); }
.stat-box.gold .value { color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
.outcome-line {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  background: var(--mint-soft);
  border: 1px solid rgba(45, 212, 191, 0.28);
  border-radius: 14px;
  font-size: 13px;
  margin-bottom: 8px;
}
.outcome-line:last-child { margin-bottom: 0; }
.outcome-line.double { background: var(--gold-soft); border-color: rgba(251, 191, 36, 0.28); }
.outcome-line .label { color: var(--text-dim); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.outcome-line .fav {
  color: var(--mint);
  font-weight: 900;
  font-size: 14px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.4px;
  text-shadow: 0 0 12px var(--mint-glow);
}
.outcome-line.double .fav { color: var(--gold); text-shadow: 0 0 12px var(--gold-glow); }
.live-badge {
  display: inline-block;
  padding: 4px 10px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  border-radius: 8px;
  letter-spacing: 0.6px;
  animation: livePulse 1.5s infinite;
  box-shadow: 0 0 16px var(--danger-glow);
}
@keyframes livePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.75; transform: scale(1.04); }
}
.skeleton-card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 22px;
  margin-bottom: 16px;
  overflow: hidden;
  position: relative;
}
.skeleton-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(45, 212, 191, 0.12) 50%, transparent 100%);
  animation: skeletonShimmer 1.8s ease-in-out infinite;
}
@keyframes skeletonShimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}
.skeleton-line { height: 14px; background: rgba(45, 212, 191, 0.12); border-radius: 7px; margin-bottom: 14px; }
.skeleton-line.w-70 { width: 70%; }
.skeleton-line.w-50 { width: 50%; }
.skeleton-line.w-100 { width: 100%; }
.skeleton-line.h-18 { height: 18px; }
.skeleton-balls { display: flex; justify-content: center; gap: 14px; padding: 22px 0; }
.skeleton-ball {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45, 212, 191, 0.3), rgba(45, 212, 191, 0.08));
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  animation: ballBounce 1.4s ease-in-out infinite;
  box-shadow: 0 0 22px rgba(45, 212, 191, 0.3);
}
.skeleton-ball:nth-child(2) { animation-delay: 0.2s; }
.skeleton-ball:nth-child(3) { animation-delay: 0.4s; }
@keyframes ballBounce {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(-14px); opacity: 1; }
}
.yesterday-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.yesterday-stat {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px 10px;
  text-align: center;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), inset 0 1px 0 var(--card-hi);
  position: relative;
  overflow: hidden;
}
.yesterday-stat::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%; height: 2px;
  border-radius: 2px;
}
.yesterday-stat.win::before { background: var(--success); box-shadow: 0 0 12px var(--success-glow); }
.yesterday-stat.lose::before { background: var(--danger); box-shadow: 0 0 12px var(--danger-glow); }
.yesterday-stat.acc::before { background: var(--gold); box-shadow: 0 0 12px var(--gold-glow); }
.yesterday-stat .ys-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 32px;
  font-weight: 900;
  display: block;
  margin-bottom: 6px;
  line-height: 1;
}
.yesterday-stat .ys-label { font-size: 11px; color: var(--text-dim); font-weight: 800; }
.yesterday-stat.win .ys-num { color: var(--success); text-shadow: 0 0 20px var(--success-glow); }
.yesterday-stat.lose .ys-num { color: var(--danger); text-shadow: 0 0 20px var(--danger-glow); }
.yesterday-stat.acc .ys-num { color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }
.express-hero {
  background: radial-gradient(ellipse at 50% 0%, rgba(251, 191, 36, 0.35), transparent 60%), linear-gradient(135deg, #7c2d12 0%, #b45309 50%, #d97706 100%);
  border-radius: 26px;
  padding: 34px 24px;
  color: #fff;
  text-align: center;
  margin-bottom: 22px;
  position: relative;
  overflow: hidden;

    else if (diffMin < 1440) ago = Math.floor(diffMin / 60) + ' ч назад';
    else ago = Math.floor(diffMin / 1440) + ' дн назад';
    el.textContent = '🕐 Обновлено: ' + hh + ':' + mm + ' · ' + day + '.' + month + ' (' + ago + ')';
  } catch (e) { el.textContent = ''; }
}
function showSkeleton() {
  return '<div class="skeleton-card"><div class="skeleton-balls"><div class="skeleton-ball">⚽</div><div class="skeleton-ball">⚽</div><div class="skeleton-ball">⚽</div></div><div class="skeleton-line w-70 h-18"></div><div class="skeleton-line w-50"></div><div class="skeleton-line w-100"></div></div><div class="skeleton-card"><div class="skeleton-balls"><div class="skeleton-ball">⚽</div><div class="skeleton-ball">⚽</div><div class="skeleton-ball">⚽</div></div><div class="skeleton-line w-70 h-18"></div><div class="skeleton-line w-50"></div><div class="skeleton-line w-100"></div></div>';
}
async function loadData() {
  const content = document.getElementById('content');
  if (currentTab === 'faq') { renderFaq(); updateSyncLine(); return; }
  if (currentTab === 'bonus') { renderBonus(); updateSyncLine(); return; }
  const cached = getCache(currentTab);
  if (cached) {
    renderTab(currentTab, cached.data);
    updateSyncLine();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = showSkeleton();
  }
  try {
    const resp = await fetch(API_URL + '?action=' + currentTab);
    const result = await resp.json();
    if (result.error) throw new Error(result.error);
    const serverVersion = result.version || '1';
    const serverData = result.data !== undefined ? result.data : result;
    if (!cached || cached.version !== serverVersion) {
      setCache(currentTab, serverVersion, serverData);
      renderTab(currentTab, serverData);
      updateSyncLine();
    } else {
      setCache(currentTab, serverVersion, serverData);
      updateSyncLine();
    }
  } catch (e) {
    if (!cached) content.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
  }
}
function renderTab(tab, data) {
  if (tab === 'today' || tab === 'tomorrow') renderMatches(Array.isArray(data) ? data : []);
  else if (tab === 'yesterday') renderYesterday(data);
  else if (tab === 'express') renderExpress(data);
  else if (tab === 'stats') renderStats(data);
  else if (tab === 'faq') renderFaq();
  else if (tab === 'bonus') renderBonus();
}
function cardClass(p) { return p >= 70 ? 'card-hot' : p >= 65 ? 'card-mid' : ''; }
function renderMatches(data) {
  const content = document.getElementById('content');
  if (!Array.isArray(data) || !data.length) {
    content.innerHTML = '<div class="empty">Нет матчей</div>';
    return;
  }
  const sorted = data.slice().sort((a, b) => {
    const pa = parseInt(a.probability) || 0;
    const pb = parseInt(b.probability) || 0;
    if (pb !== pa) return pb - pa;
    const oa = parseFloat(a.odd) || 0;
    const ob = parseFloat(b.odd) || 0;
    return oa - ob;
  });
  let html = '';
  sorted.forEach((m, idx) => {
    const prob = parseInt(m.probability) || 0;
    const live = String(m.result || '').includes('Live');
    let outcomeHtml = '';
    if (m.outcome) {
      const o = m.outcome;
      const p1 = o.p1 || 0, px = o.x || 0, p2 = o.p2 || 0;
      const best = Math.max(p1, px, p2);
      let mainLabel = 'X';
      if (best === p1) mainLabel = 'П1';
      else if (best === p2) mainLabel = 'П2';
      const chance1X = p1 + px;
      const chance2X = p2 + px;
      const chance12 = p1 + p2;
      let doubleLabel = '1X';
      let bestDouble = chance1X;
      if (chance2X > bestDouble) { doubleLabel = '2X'; bestDouble = chance2X; }
      if (chance12 > bestDouble) { doubleLabel = '12'; bestDouble = chance12; }
      outcomeHtml = '<div class="outcome-line"><span class="label">🏆 Прогноз</span><span class="fav">' + mainLabel + ' · ' + best + '%</span></div><div class="outcome-line double" style="margin-bottom:0;"><span class="label">🎯 Двойной шанс</span><span class="fav">' + doubleLabel + ' · ' + bestDouble + '%</span></div>';
    }
    html += '<div class="card ' + cardClass(prob) + ' ' + (live ? 'card-live' : '') + '" style="animation-delay:' + (idx * 0.06) + 's;">';
    html += '<div class="card-header"><span class="card-num-badge">' + (idx + 1) + '</span><div class="card-teams-block"><div class="card-team">' + m.home + '</div><div class="card-team">' + m.away + '</div></div></div>';
    html += '<div class="card-meta"><div class="meta-item league">🏆 ' + m.league + '</div><div class="meta-item">📅 ' + (m.date || '') + (m.time ? ' · ' + m.time : '') + '</div>' + (live ? '<div class="meta-item"><span class="live-badge">LIVE</span></div>' : '') + '</div>';
    html += '<div class="card-stats"><div class="stat-box blue"><div class="label">Тотал</div><div class="value">' + m.total + '</div></div><div class="stat-box green"><div class="label">Вероят.</div><div class="value">' + prob + '%</div></div><div class="stat-box gold"><div class="label">Кэф</div><div class="value">' + m.odd + '</div></div></div>';
    html += outcomeHtml + '</div>';
  });
  content.innerHTML = html;
}
function renderYesterday(data) {
  const content = document.getElementById('content');
  let matches = [], wins = 0, loses = 0, accuracy = 0, total = 0, dateStr = '', isYesterday = true;
  if (Array.isArray(data)) {
    matches = data;
    matches.forEach(m => { if (m.status === 'win') wins++; else if (m.status === 'lose') loses++; });
    total = wins + loses;
    accuracy = total > 0 ? Math.round(wins / total * 100) : 0;
  } else if (data && data.matches) {
    matches = data.matches || [];
    wins = data.wins || 0;
    loses = data.loses || 0;
    accuracy = data.accuracy || 0;
    total = data.total || 0;
    dateStr = data.date || '';
    isYesterday = data.isYesterday !== false;
  }
  if (!matches.length) { content.innerHTML = '<div class="empty">Вчера матчей не было</div>'; return; }
  const titleText = isYesterday ? '✅ ВЧЕРА' : '📅 ПОСЛЕДНИЕ МАТЧИ';
  const subtitleText = isYesterday ? (dateStr + ' · ' + total + ' матчей') : ('Последние ' + total + ' матчей из архива');
  let html = '<div class="section-title">' + titleText + '</div><div class="section-sub">' + subtitleText + '</div>';
  html += '<div class="yesterday-summary"><div class="yesterday-stat win"><div class="ys-num">' + wins + '</div><div class="ys-label">✅ Зашло</div></div><div class="yesterday-stat lose"><div class="ys-num">' + loses + '</div><div class="ys-label">❌ Не зашло</div></div><div class="yesterday-stat acc"><div class="ys-num">' + accuracy + '%</div><div class="ys-label">🎯 Точность</div></div></div>';
  matches.forEach((m, idx) => {
    const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
    const winnerHtml = m.winner ? '<div class="winner-badge">🏆 ' + m.winner + '</div>' : '';
    html += '<div class="card" style="animation-delay:' + (idx * 0.06) + 's;">';

    html += '<div class="outcome-line" style="margin-bottom:0;"><span class="label">' + emoji + ' Прогноз</span><span class="fav">' + m.prediction + '</span></div>' + winnerHtml + '</div>';
  });
  content.innerHTML = html;
}
