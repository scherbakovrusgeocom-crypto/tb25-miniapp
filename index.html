<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Прогнозы ТБ 2.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg-0: #06090f;
  --bg-1: #0a1219;
  --bg-2: #0e1a24;
  --card-1: #0f1c26;
  --card-2: #132535;
  --card-hi: rgba(255, 255, 255, 0.03);
  --glass: rgba(15, 28, 38, 0.75);
  --glass-strong: rgba(15, 28, 38, 0.92);
  --border: rgba(140, 180, 210, 0.08);
  --border-mid: rgba(140, 180, 210, 0.16);
  --border-strong: rgba(100, 180, 220, 0.35);
  --text: #eaf2f8;
  --text-dim: #8fb5cc;
  --text-mute: #4a6577;
  --accent: #4aa8d8;
  --accent-glow: rgba(74, 168, 216, 0.35);
  --accent-soft: rgba(74, 168, 216, 0.1);
  --mint: #5ecfb1;
  --mint-glow: rgba(94, 207, 177, 0.3);
  --mint-soft: rgba(94, 207, 177, 0.1);
  --gold: #e5b96a;
  --gold-glow: rgba(229, 185, 106, 0.35);
  --gold-soft: rgba(229, 185, 106, 0.1);
  --success: #56d68f;
  --success-glow: rgba(86, 214, 143, 0.3);
  --success-soft: rgba(86, 214, 143, 0.1);
  --warn: #f0b45a;
  --warn-glow: rgba(240, 180, 90, 0.3);
  --danger: #e87a8b;
  --danger-glow: rgba(232, 122, 139, 0.3);
  --danger-soft: rgba(232, 122, 139, 0.1);
}
body.light-theme {
  --bg-0: #f2f8fb;
  --bg-1: #e9f3f8;
  --bg-2: #deedf5;
  --card-1: #ffffff;
  --card-2: #f4fafc;
  --card-hi: rgba(0, 0, 0, 0.015);
  --glass: rgba(255, 255, 255, 0.85);
  --glass-strong: rgba(255, 255, 255, 0.95);
  --border: rgba(74, 168, 216, 0.14);
  --border-mid: rgba(74, 168, 216, 0.24);
  --border-strong: rgba(74, 168, 216, 0.5);
  --text: #0a2331;
  --text-dim: #2a6d8c;
  --text-mute: #7a95a5;
  --accent: #2a7ba8;
  --mint: #3aaf90;
  --gold: #b88a3a;
  --success: #2ea66b;
  --warn: #c98a2a;
  --danger: #c85a6e;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-1);
  color: var(--text);
  padding: 0 0 30px;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  transition: background 0.4s ease, color 0.4s ease;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 100% 60% at 50% -10%, rgba(74, 168, 216, 0.12), transparent 60%),
    radial-gradient(ellipse 80% 50% at 12% 85%, rgba(94, 207, 177, 0.08), transparent 60%),
    radial-gradient(ellipse 70% 40% at 90% 65%, rgba(229, 185, 106, 0.04), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  pointer-events: none;
  z-index: 0;
}
body.light-theme::before { opacity: 0.6; }
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(circle at 50% 55%, transparent 90px, rgba(94, 207, 177, 0.14) 90px, rgba(94, 207, 177, 0.14) 92px, transparent 92px),
    radial-gradient(circle at 50% 55%, rgba(94, 207, 177, 0.3) 3px, transparent 4px),
    linear-gradient(90deg, transparent 0%, transparent 3%, rgba(94, 207, 177, 0.1) 3%, rgba(94, 207, 177, 0.1) 97%, transparent 97%),
    linear-gradient(180deg, transparent 0%, transparent 6%, rgba(94, 207, 177, 0.08) 6%, rgba(94, 207, 177, 0.08) 6.2%, transparent 6.2%),
    linear-gradient(0deg, transparent 0%, transparent 6%, rgba(94, 207, 177, 0.08) 6%, rgba(94, 207, 177, 0.08) 6.2%, transparent 6.2%);
  opacity: 0.9;
}
body.light-theme::after { opacity: 0.4; }
html::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(90deg, rgba(94, 207, 177, 0.022) 0px, rgba(94, 207, 177, 0.022) 60px, rgba(94, 207, 177, 0.008) 60px, rgba(94, 207, 177, 0.008) 120px);
  opacity: 0.85;
}
html:has(body.light-theme)::before { opacity: 0.4; }
.header { position: relative; padding: 26px 20px 20px; text-align: center; z-index: 1; }
.header-top { position: absolute; top: 14px; right: 14px; z-index: 5; display: flex; gap: 8px; }
.theme-btn {
  width: 40px; height: 40px;
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-mid);
  border-radius: 50%;
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2), inset 0 1px 0 var(--card-hi);
}
.theme-btn:active { transform: scale(0.9) rotate(20deg); border-color: var(--accent); }
.theme-btn svg { width: 17px; height: 17px; stroke-width: 2; }
.ball-wrap { width: 76px; height: 76px; margin: 0 auto 12px; position: relative; display: flex; align-items: center; justify-content: center; }
.ball-wrap::before {
  content: '';
  position: absolute;
  inset: -8px;
  background: radial-gradient(circle, var(--accent-glow), transparent 70%);
  border-radius: 50%;
  filter: blur(18px);
  animation: ballGlow 3.5s ease-in-out infinite;
}
.ball-emoji { font-size: 52px; line-height: 1; position: relative; z-index: 1; filter: drop-shadow(0 4px 22px var(--accent-glow)); animation: ballRotate 7s ease-in-out infinite; }
@keyframes ballGlow { 0%, 100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.95; transform: scale(1.1); } }
@keyframes ballRotate { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.header h1 {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--mint) 50%, var(--accent) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShimmer 5s linear infinite;
  filter: drop-shadow(0 0 20px var(--accent-glow));
}
@keyframes titleShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
.header .sub { font-size: 10px; letter-spacing: 5px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; font-weight: 800; }
.header-chips { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.header-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 9px 16px;
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border-mid);
  border-radius: 24px;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18), inset 0 1px 0 var(--card-hi);
}
.header-chip svg { width: 14px; height: 14px; stroke-width: 2.2; color: var(--accent); }
.header-chip:active { transform: scale(0.94); border-color: var(--accent); }
.header-chip.bonus-chip { background: linear-gradient(135deg, rgba(229, 185, 106, 0.14) 0%, rgba(74, 168, 216, 0.08) 50%, rgba(229, 185, 106, 0.14) 100%); border: 1px solid rgba(229, 185, 106, 0.35); }
.header-chip.bonus-chip svg { color: var(--gold); }
.header-chip.donate-chip { background: linear-gradient(135deg, rgba(229, 185, 106, 0.2) 0%, rgba(255, 215, 100, 0.1) 50%, rgba(229, 185, 106, 0.2) 100%); border: 1px solid rgba(229, 185, 106, 0.5); box-shadow: 0 6px 20px rgba(229, 185, 106, 0.2); }
.header-chip.donate-chip svg { color: var(--gold); fill: var(--gold); }
.tabs-wrap {
  position: sticky;
  top: 0;
  background: var(--glass-strong);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 10px 12px;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; justify-content: space-between; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 1 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 10px 4px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 800;
  color: var(--text-dim);
  border: 1px solid transparent;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
  letter-spacing: 0.3px;
}
.tab svg { width: 18px; height: 18px; stroke-width: 2.2; }
.tab:active { transform: scale(0.94); }
.tab.active {
  background: linear-gradient(135deg, var(--accent-soft), rgba(94, 207, 177, 0.06));
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 20px var(--accent-glow), inset 0 1px 0 var(--card-hi);
}
#content { padding: 16px 14px; position: relative; z-index: 1; }
.card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 14px;
  position: relative;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 36px rgba(0, 0, 0, 0.3), inset 0 1px 0 var(--card-hi);
  overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
body.light-theme .card { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05), inset 0 1px 0 var(--card-hi); }
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  border-radius: 20px 20px 0 0;
  background: linear-gradient(90deg, transparent, var(--accent), var(--mint), var(--accent), transparent);
  opacity: 0.85;
}
.card.card-hot::before { background: linear-gradient(90deg, transparent, var(--gold), #f0c87a, var(--gold), transparent); box-shadow: 0 0 18px var(--gold-glow); }
.card.card-mid::before { background: linear-gradient(90deg, transparent, var(--success), var(--mint), var(--success), transparent); }
.card.card-live::before { background: linear-gradient(90deg, transparent, var(--danger), #f09baa, var(--danger), transparent); animation: liveFlash 2s ease-in-out infinite; }
@keyframes liveFlash { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
@keyframes cardSlideIn {
  0% { opacity: 0; transform: translateY(18px) scale(0.98); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.005); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.card-num-badge {
  flex-shrink: 0;
  width: 30px; height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent-soft), rgba(94, 207, 177, 0.05));
  border: 1px solid rgba(74, 168, 216, 0.35);
  border-radius: 50%;
  color: var(--accent);
  font-size: 13px;
  font-weight: 800;
  margin-top: 1px;
  font-family: 'JetBrains Mono', monospace;
  box-shadow: 0 0 14px var(--accent-glow), inset 0 1px 0 var(--card-hi);
}
.card-teams-block { flex: 1; min-width: 0; }
.card-team { font-size: 15px; font-weight: 800; line-height: 1.35; word-break: break-word; overflow-wrap: break-word; color: var(--text); }
.card-team + .card-team { margin-top: 3px; color: var(--text-dim); font-weight: 700; }
.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 14px;
  font-weight: 700;
  flex-wrap: wrap;
  padding-top: 12px;
  border-top: 1px dashed var(--border-mid);
}
.card-meta .meta-item { display: flex; align-items: center; gap: 4px; }
.card-meta .meta-item.league { color: var(--gold); font-weight: 800; }
.card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-box {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.1));
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 5px 12px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
body.light-theme .stat-box { background: linear-gradient(180deg, rgba(74, 168, 216, 0.05), rgba(74, 168, 216, 0.02)); }
.stat-box::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 50%; height: 2px;
  border-radius: 2px;
}
.stat-box.blue::before { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
.stat-box.green::before { background: var(--success); box-shadow: 0 0 10px var(--success-glow); }
.stat-box.gold::before { background: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
.stat-box .label { font-size: 10px; color: var(--text-mute); text-transform: uppercase; font-weight: 800; letter-spacing: 1.2px; margin-bottom: 6px; }
.stat-box .value { font-family: 'JetBrains Mono', monospace; font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.4px; }
.stat-box.blue .value { color: var(--accent); text-shadow: 0 0 18px var(--accent-glow); }
.stat-box.green .value { color: var(--success); text-shadow: 0 0 18px var(--success-glow); }
.stat-box.gold .value { color: var(--gold); text-shadow: 0 0 18px var(--gold-glow); }
.outcome-line {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 14px;
  background: var(--accent-soft);
  border: 1px solid rgba(74, 168, 216, 0.22);
  border-radius: 12px;
  font-size: 13px;
  margin-bottom: 6px;
}
.outcome-line:last-child { margin-bottom: 0; }
.outcome-line.double { background: var(--gold-soft); border-color: rgba(229, 185, 106, 0.22); }
.outcome-line .label { color: var(--text-dim); font-weight: 700; display: flex; align-items: center; gap: 5px; }
.outcome-line .fav { color: var(--accent); font-weight: 900; font-size: 14px; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.3px; text-shadow: 0 0 10px var(--accent-glow); }
.outcome-line.double .fav { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
.live-badge {
  display: inline-block;
  padding: 3px 9px;
  background: var(--danger);
  color: #fff;
  font-size: 10px;
  font-weight: 900;
  border-radius: 6px;
  letter-spacing: 0.5px;
  animation: livePulse 1.5s infinite;
  box-shadow: 0 0 14px var(--danger-glow);
}
@keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
.skeleton-card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  overflow: hidden;
  position: relative;
}
.skeleton-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(74, 168, 216, 0.08) 50%, transparent 100%);
  animation: skeletonShimmer 1.8s ease-in-out infinite;
}
@keyframes skeletonShimmer { 0% { left: -100%; } 100% { left: 100%; } }
.skeleton-line { height: 13px; background: rgba(74, 168, 216, 0.1); border-radius: 7px; margin-bottom: 12px; }
.skeleton-line.w-70 { width: 70%; }
.skeleton-line.w-50 { width: 50%; }
.skeleton-line.w-100 { width: 100%; }
.skeleton-line.h-18 { height: 17px; }
.skeleton-balls { display: flex; justify-content: center; gap: 12px; padding: 20px 0; }
.skeleton-ball {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(74, 168, 216, 0.25), rgba(74, 168, 216, 0.06));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  animation: ballBounce 1.4s ease-in-out infinite;
  box-shadow: 0 0 18px rgba(74, 168, 216, 0.25);
}
.skeleton-ball:nth-child(2) { animation-delay: 0.2s; }
.skeleton-ball:nth-child(3) { animation-delay: 0.4s; }
@keyframes ballBounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-12px); opacity: 1; } }
.yesterday-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.yesterday-stat {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 10px;
  text-align: center;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  backdrop-filter: blur(10px);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22), inset 0 1px 0 var(--card-hi);
  position: relative;
  overflow: hidden;
}
.yesterday-stat::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%; height: 2px;
  border-radius: 2px;
}
.yesterday-stat.win::before { background: var(--success); box-shadow: 0 0 10px var(--success-glow); }
.yesterday-stat.lose::before { background: var(--danger); box-shadow: 0 0 10px var(--danger-glow); }
.yesterday-stat.acc::before { background: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
.yesterday-stat .ys-num { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 900; display: block; margin-bottom: 5px; line-height: 1; }
.yesterday-stat .ys-label { font-size: 11px; color: var(--text-dim); font-weight: 800; }
.yesterday-stat.win .ys-num { color: var(--success); text-shadow: 0 0 18px var(--success-glow); }
.yesterday-stat.lose .ys-num { color: var(--danger); text-shadow: 0 0 18px var(--danger-glow); }
.yesterday-stat.acc .ys-num { color: var(--gold); text-shadow: 0 0 18px var(--gold-glow); }
.express-hero {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(229, 185, 106, 0.3), transparent 60%),
    linear-gradient(135deg, #4a3418 0%, #6e4d1e 50%, #8a6128 100%);
  border-radius: 22px;
  padding: 30px 22px;
  color: #fff;
  text-align: center;
  margin-bottom: 18px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 16px 48px rgba(110, 77, 30, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  animation: cardSlideIn 0.6s ease;
  border: 1px solid rgba(229, 185, 106, 0.3);
}
.express-hero::before {
  content: '🏆';
  position: absolute;
  top: 20px; right: 24px;
  font-size: 40px;
  opacity: 0.35;
  filter: drop-shadow(0 0 16px rgba(229, 185, 106, 0.5));
}
.express-hero-title { font-size: 20px; font-weight: 900; letter-spacing: 3px; position: relative; z-index: 1; }
.express-hero-sub { font-size: 11px; opacity: 0.85; margin-top: 6px; letter-spacing: 2px; position: relative; z-index: 1; }
.express-hero-odd {
  font-family: 'JetBrains Mono', monospace;
  font-size: 60px; font-weight: 900; margin-top: 14px;
  background: linear-gradient(180deg, #fef3d8, #e5b96a, #c99440);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 3px 16px rgba(229, 185, 106, 0.4));
}
.express-hero-label { font-size: 10px; opacity: 0.85; letter-spacing: 4px; margin-top: 10px; text-transform: uppercase; font-weight: 800; position: relative; z-index: 1; }
.express-items-title { text-align: center; font-size: 12px; color: var(--text-dim); margin-bottom: 14px; font-weight: 800; letter-spacing: 1.5px; }
.express-card {
  background: linear-gradient(160deg, var(--card-1) 0%, var(--card-2) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 18px;
  margin-bottom: 10px;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28), inset 0 1px 0 var(--card-hi);
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}
.express-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--mint), var(--accent), transparent);
  opacity: 0.6;
}
.express-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.express-num {
  display: inline-flex; align-items: center; justify-content: center;

function getCache(tab) {
  try { const r = localStorage.getItem('tb25_v30_' + tab); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function setCache(tab, version, data) {
  try {
    localStorage.setItem('tb25_v30_' + tab, JSON.stringify({ version, data, ts: Date.now() }));
    localStorage.setItem('tb25_last_update', new Date().toISOString());
  } catch(e){}
}
function updateSyncLine() {
  const el = document.getElementById('syncLine');
  if (!el) return;
  try {
    const iso = localStorage.getItem('tb25_last_update');
    if (!iso) { el.textContent = ''; return; }
    const d = new Date(iso);
    const now = new Date();
    const diffMin = Math.floor((now - d) / 60000);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    let ago = '';
    if (diffMin < 1) ago = 'только что';
    else if (diffMin < 60) ago = diffMin + ' мин назад';
    else if (diffMin < 1440) ago = Math.floor(diffMin / 60) + ' ч назад';
    else ago = Math.floor(diffMin / 1440) + ' дн назад';
    el.textContent = '🕐 Обновлено: ' + hh + ':' + mm + ' · ' + day + '.' + month + ' (' + ago + ')';
  } catch (e) { el.textContent = ''; }
}
function showSkeleton() {
  return '<div class="skeleton-card"><div class="skeleton-balls"><div class="skeleton-ball">⚽</div><div class="skeleton-ball">⚽</div><div class="skeleton-ball">⚽</div></div><div class="skeleton-line w-70 h-18"></div><div class="skeleton-line w-50"></div><div class="skeleton-line w-100"></div></div>';
}
async function loadData() {
  const content = document.getElementById('content');
  if (currentTab === 'faq') { renderFaq(); updateSyncLine(); return; }
  if (currentTab === 'bonus') { renderBonus(); updateSyncLine(); return; }
  const cached = getCache(currentTab);
  if (cached) {
    renderTab(currentTab, cached.data);
    updateSyncLine();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = showSkeleton();
  }
  try {
    const uid = getUserId();
    const resp = await fetch(API_URL + '?action=' + currentTab + '&uid=' + uid);
    const result = await resp.json();
    if (result.error) throw new Error(result.error);
    const serverVersion = result.version || '1';
    const serverData = result.data !== undefined ? result.data : result;
    if (!cached || cached.version !== serverVersion) {
      setCache(currentTab, serverVersion, serverData);
      renderTab(currentTab, serverData);
      updateSyncLine();
    } else {
      setCache(currentTab, serverVersion, serverData);
      updateSyncLine();
    }
  } catch (e) {
    if (!cached) content.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
  }
}
function renderTab(tab, data) {
  if (tab === 'today' || tab === 'tomorrow') renderMatches(Array.isArray(data) ? data : []);
  else if (tab === 'yesterday') renderYesterday(data);
  else if (tab === 'express') renderExpress(data);
  else if (tab === 'stats') renderStats(data);
}
function cardClass(p) { return p >= 70 ? 'card-hot' : p >= 65 ? 'card-mid' : ''; }
function renderMatches(data) {
  const content = document.getElementById('content');
  if (!Array.isArray(data) || !data.length) { content.innerHTML = '<div class="empty">Нет матчей</div>'; return; }
  const sorted = data.slice().sort((a, b) => {
    const pa = parseInt(a.probability) || 0;
    const pb = parseInt(b.probability) || 0;
    if (pb !== pa) return pb - pa;
    return (parseFloat(a.odd) || 0) - (parseFloat(b.odd) || 0);
  });
  let html = '';
  sorted.forEach((m, idx) => {
    const prob = parseInt(m.probability) || 0;
    const live = String(m.result || '').includes('Live');
    let outcomeHtml = '';
    if (m.outcome) {
      const o = m.outcome;
      const p1 = o.p1 || 0, px = o.x || 0, p2 = o.p2 || 0;
      const best = Math.max(p1, px, p2);
      let mainLabel = 'X';
      if (best === p1) mainLabel = 'П1';
      else if (best === p2) mainLabel = 'П2';
      const chance1X = p1 + px, chance2X = p2 + px, chance12 = p1 + p2;
      let doubleLabel = '1X', bestDouble = chance1X;
      if (chance2X > bestDouble) { doubleLabel = '2X'; bestDouble = chance2X; }
      if (chance12 > bestDouble) { doubleLabel = '12'; bestDouble = chance12; }
      outcomeHtml = '<div class="outcome-line"><span class="label">🏆 Прогноз</span><span class="fav">' + mainLabel + ' · ' + best + '%</span></div><div class="outcome-line double" style="margin-bottom:0;"><span class="label">🎯 Двойной шанс</span><span class="fav">' + doubleLabel + ' · ' + bestDouble + '%</span></div>';
    }
    html += '<div class="card ' + cardClass(prob) + ' ' + (live ? 'card-live' : '') + '" style="animation-delay:' + (idx * 0.05) + 's;">';
    html += '<div class="card-header"><span class="card-num-badge">' + (idx + 1) + '</span><div class="card-teams-block"><div class="card-team">' + m.home + '</div><div class="card-team">' + m.away + '</div></div></div>';
    html += '<div class="card-meta"><div class="meta-item league">🏆 ' + m.league + '</div><div class="meta-item">📅 ' + (m.date || '') + (m.time ? ' · ' + m.time : '') + '</div>' + (live ? '<div class="meta-item"><span class="live-badge">LIVE</span></div>' : '') + '</div>';
    html += '<div class="card-stats"><div class="stat-box blue"><div class="label">Тотал</div><div class="value">' + m.total + '</div></div><div class="stat-box green"><div class="label">Вероят.</div><div class="value" style="color:' + probColor(prob) + ';text-shadow:0 0 18px ' + probGlow(prob) + '">' + prob + '%</div></div><div class="stat-box gold"><div class="label">Кэф</div><div class="value">' + m.odd + '</div></div></div>';
    html += outcomeHtml + '</div>';
  });
  content.innerHTML = html;
}
function renderYesterday(data) {

async function openHistory(filter) {
  haptic('medium');
  const content = document.getElementById('content');
  content.innerHTML = showSkeleton();
  const titles = { wins: '✅ ЗАШЕДШИЕ', loses: '❌ НЕЗАШЕДШИЕ', all: '📋 ВСЕ МАТЧИ' };
  try {
    const uid = getUserId();
    const resp = await fetch(API_URL + '?action=history&filter=' + filter + '&uid=' + uid);
    const raw = await resp.json();
    const data = Array.isArray(raw) ? raw : (raw.data || []);
    let html = '<button style="margin-bottom:14px;padding:9px 18px;border-radius:22px;font-size:12px;font-weight:800;background:var(--glass);color:var(--text-dim);border:1px solid var(--border-mid);cursor:pointer;font-family:inherit;backdrop-filter:blur(12px);" onclick="switchTabDirect(\'stats\')">← Назад</button>';
    html += '<div class="section-title">' + titles[filter] + '</div>';
    html += '<div class="section-sub">Найдено: ' + data.length + '</div>';
    if (!data.length) {
      html += '<div class="empty">Пока нет матчей</div>';
    } else {
      data.forEach((m, idx) => {
        const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
        const winnerHtml = m.winner ? '<div class="winner-badge">🏆 ' + m.winner + '</div>' : '';
        html += '<div class="card" style="animation-delay:' + (idx * 0.04) + 's;"><div class="card-header"><div class="card-teams-block" style="padding-left:4px;"><div class="card-team">' + m.home + '</div><div class="card-team">' + m.away + '</div></div><span style="font-size:19px;font-weight:900;font-family:\'JetBrains Mono\',monospace;">' + (m.score || '—') + '</span></div><div class="card-meta"><div class="meta-item league">🏆 ' + m.league + '</div>' + (m.date ? '<div class="meta-item">📅 ' + m.date + (m.time ? ' · ' + m.time : '') + '</div>' : '') + '<div class="meta-item">⚽ ' + m.total + '</div></div><div class="outcome-line" style="margin-bottom:0;"><span class="label">' + emoji + ' ' + m.prediction + '</span><span class="fav">' + emoji + '</span></div>' + winnerHtml + '</div>';
      });
    }
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
  }
}
