<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Прогнозы ТБ 2.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #090d14;
  --surface: #111823;
  --surface-hi: #192333;
  --card-bg: #131c29;
  --border: rgba(255, 255, 255, 0.08);
  --border-hi: rgba(16, 185, 129, 0.35);
  --text: #f8fafc;
  --text-dim: #94a3b8;
  --text-mute: #64748b;
  --mint: #10b981;
  --mint-glow: rgba(16, 185, 129, 0.18);
  --gold: #f59e0b;
  --gold-glow: rgba(245, 158, 11, 0.2);
  --danger: #f43f5e;
  --danger-glow: rgba(244, 63, 94, 0.2);
  --radius: 20px;
  --nav-h: 68px;
}

body.light-theme {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-hi: #e2e8f0;
  --card-bg: #ffffff;
  --border: rgba(15, 23, 42, 0.08);
  --border-hi: rgba(5, 150, 105, 0.35);
  --text: #0f172a;
  --text-dim: #475569;
  --text-mute: #94a3b8;
  --mint: #059669;
  --mint-glow: rgba(5, 150, 105, 0.12);
  --gold: #d97706;
  --gold-glow: rgba(217, 119, 6, 0.14);
  --danger: #e11d48;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 0 0 calc(var(--nav-h) + 24px);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.25s, color 0.25s;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--text-mute); border-radius: 10px; }

/* Шапка */
.header { padding: 20px 16px 14px; display: flex; align-items: center; justify-content: space-between; }
.header-left, .header-right { display: flex; align-items: center; gap: 8px; width: 44px; }
.header-center { text-align: center; flex: 1; }
.header h1 {
  font-size: 22px; font-weight: 900; letter-spacing: 1.5px;
  background: linear-gradient(90deg, var(--text), var(--mint));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.header .sub { font-size: 10px; letter-spacing: 2.5px; color: var(--mint); margin-top: 4px; text-transform: uppercase; font-weight: 800; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: var(--text-dim);
  cursor: pointer; transition: all 0.2s;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 19px; height: 19px; transition: transform 0.5s; }
.icon-btn.spinning svg { animation: spin 0.9s linear infinite; color: var(--mint); }
.icon-btn.success { border-color: var(--mint); color: var(--mint); box-shadow: 0 0 12px var(--mint-glow); }
@keyframes spin { 100% { transform: rotate(360deg); } }

/* Вкладки */
.tabs-wrap {
  position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding: 10px 16px; z-index: 20; border-bottom: 1px solid var(--border);
}
.tabs { display: flex; gap: 6px; background: var(--surface); padding: 4px; border-radius: 14px; border: 1px solid var(--border); }
.tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 10px; border-radius: 10px; font-size: 13px; font-weight: 700;
  color: var(--text-dim); cursor: pointer; transition: all 0.2s;
}
.tab.active { background: var(--surface-hi); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
.tab-badge { font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 2px 6px; border-radius: 6px; background: var(--mint-glow); color: var(--mint); }

/* Панель фильтров */
.filters-container { padding: 10px 16px 2px; display: flex; flex-direction: column; gap: 8px; }
.prob-filters, .league-filters { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.prob-filters::-webkit-scrollbar, .league-filters::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto; padding: 7px 13px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 100px; font-size: 12px; font-weight: 700; color: var(--text-dim);
  cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
}
.chip.active { background: var(--mint); color: #fff; border-color: var(--mint); box-shadow: 0 4px 12px var(--mint-glow); }
.chip-count { font-size: 10px; opacity: 0.85; font-family: 'JetBrains Mono', monospace; }

#content { padding: 14px 16px; min-height: 55vh; transition: opacity 0.2s; }

/* КАРТОЧКА МАТЧА */
.match-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 14px; position: relative; overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12); animation: slideUp 0.28s ease both;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.match-card.prob-high { border-color: rgba(245, 158, 11, 0.45); box-shadow: 0 8px 26px var(--gold-glow); }
.match-card.prob-high::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), #fbbf24); }
.match-card.prob-mid { border-color: var(--border-hi); }
.match-card.prob-mid::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--mint), #34d399); }

.mc-top-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
.mc-league-badge { font-size: 11px; font-weight: 800; color: var(--mint); background: var(--mint-glow); padding: 4px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72%; }
.mc-date { font-size: 11px; font-weight: 700; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
.mc-live { background: var(--danger); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; animation: pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity: 0.6; } }

.mc-matchup { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
.mc-team { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 36%; text-align: center; }
.mc-logo { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-hi); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: var(--text); border: 1px solid var(--border); letter-spacing: 0.5px; }
.mc-name { font-size: 13px; font-weight: 800; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mc-time-center { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.mc-time { font-size: 19px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: var(--text); background: var(--surface); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); }
.mc-odd-pill { font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--gold); }

/* Блок ТБ 2.5 */
.mc-total-main { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.mc-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.mc-total-title { font-size: 11px; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
.mc-total-val { font-size: 26px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: var(--mint); line-height: 1; }
.mc-total-val.high { color: var(--gold); }
.mc-total-val.low { color: var(--text-dim); }

.mc-conf-badge { font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 8px; }
.conf-high { background: var(--gold-glow); color: var(--gold); }
.conf-mid { background: var(--mint-glow); color: var(--mint); }
.conf-low { background: rgba(148,163,184,0.12); color: var(--text-dim); }

.prob-progress-bg { width: 100%; height: 6px; background: var(--surface-hi); border-radius: 99px; overflow: hidden; }
.prob-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--mint), #34d399); transition: width 0.4s ease; }
.prob-progress-fill.high { background: linear-gradient(90deg, var(--gold), #fbbf24); }

/* Скелетон и пустые состояния */
.skeleton { background: var(--surface); border-radius: var(--radius); margin-bottom: 14px; height: 210px; position: relative; overflow: hidden; border: 1px solid var(--border); }
.skeleton::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent); animation: shimmer 1.4s infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.empty { text-align: center; padding: 48px 20px; color: var(--text-dim); font-weight: 600; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty button { margin-top: 14px; padding: 10px 22px; background: var(--mint); border: none; color: #fff; border-radius: 100px; font-weight: 800; cursor: pointer; }

/* Модалки и нижнее меню */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(6px); z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; width: 100%; max-width: 380px; }
.modal-title { font-size: 19px; font-weight: 900; text-align: center; margin-bottom: 14px; }
.modal-btn { display: block; width: 100%; padding: 13px; background: var(--mint); color: #fff; border: none; border-radius: 14px; font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 10px; }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; background: none; border: none; color: var(--text-mute); font-size: 10px; font-weight: 700; cursor: pointer; transition: color 0.2s; }
.nav-btn svg { width: 20px; height: 20px; stroke-width: 2.2; }
.nav-btn.active { color: var(--mint); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
  </div>
  <div class="header-center">
    <h1>ПРОГНОЗЫ</h1>
    <div class="sub" id="headerDate">Тотал больше 2.5</div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="refreshBtn" onclick="manualRefresh()" title="Обновить данные">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
  </div>
</div>

<div class="tabs-wrap" id="topTabsWrap">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="today">Сегодня <span class="tab-badge" id="badge-today" style="display:none">0</span></div>
    <div class="tab" data-tab="tomorrow">Завтра <span class="tab-badge" id="badge-tomorrow" style="display:none">0</span></div>
    <div class="tab" data-tab="express">Экспресс</div>
  </div>
</div>

<div class="filters-container" id="filtersWrap" style="display:none;">
  <div class="prob-filters" id="probFilters"></div>
  <div class="league-filters" id="leagueFilters"></div>
</div>

<div id="content"></div>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn active" data-nav="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    <span>Матчи</span>
  </button>
  <button class="nav-btn" data-nav="yesterday">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    <span>Вчера</span>
  </button>
  <button class="nav-btn" data-nav="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 12l4-4 4 4 5-5"/></svg>
    <span>Стата</span>
  </button>
  <button class="nav-btn" data-nav="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/><circle cx="5" cy="12" r="1.5" fill="currentColor"/></svg>
    <span>Ещё</span>
  </button>
</nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';
const BOT_URL = 'https://t.me/total25_signals_bot';
const CACHE_VERSION = 'v56';

let currentTab = 'today';
let currentLeagueFilter = 'all';
let currentMinProb = 0;
let isLoading = false;
let abortCtrl = null;
let autoRefreshTimer = null;

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
if (localStorage.getItem('tb25_theme') === 'light') document.body.classList.add('light-theme');

function toggleTheme() {
  const isLight = document.body.classList.toggle('light-theme');
  localStorage.setItem('tb25_theme', isLight ? 'light' : 'dark');
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function parseProb(val) {
  if (val === undefined || val === null || val === '') return 0;
  if (typeof val === 'number') return val > 0 && val <= 1 ? Math.round(val * 100) : Math.round(val);
  const clean = String(val).trim().replace(',', '.').replace(/[^0-9.]/g, '');
  const num = parseFloat(clean);
  if (isNaN(num)) return 0;
  return num > 0 && num <= 1 ? Math.round(num * 100) : Math.round(num);
}

function normalizeMatch(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const home = raw.home || raw.team1 || raw.homeTeam || raw['Команда 1'] || raw['Хозяева'] || '';
  const away = raw.away || raw.team2 || raw.awayTeam || raw['Команда 2'] || raw['Гости'] || '';
  if (!home && !away) return null;

  const probRaw = raw.probability ?? raw.prob ?? raw.tb25 ?? raw.totalProb ?? raw['ТБ 2.5'] ?? raw['Вероятность'] ?? 0;
  const league = String(raw.league || raw.tournament || raw['Лига'] || 'Лига').trim();
  const dateRaw = raw.date || raw.datetime || raw['Дата'] || '';
  const timeRaw = raw.time || raw['Время'] || '';

  return {
    ...raw,
    home: String(home).trim(),
    away: String(away).trim(),
    league,
    prob: parseProb(probRaw),
    odd: parseFloat(String(raw.odd || raw.coef || raw['Кэф'] || 0).replace(',', '.')) || 0,
    parsedDate: parseDate(dateRaw, timeRaw)
  };
}

function parseDate(rawDate, rawTime) {
  let timeStr = '';
  let dateStr = '';

  if (rawTime) {
    const tm = String(rawTime).match(/(\d{1,2}):(\d{2})/);
    if (tm) timeStr = tm[1].padStart(2, '0') + ':' + tm[2];
  }

  if (!rawDate) return { time: timeStr || '--:--', date: '' };
  const str = String(rawDate).trim();

  const ruMatch = str.match(/^(\d{1,2})[./-](\d{1,2})(?:[./-](\d{2,4}))?(?:\s+(\d{1,2}):(\d{2}))?/);
  if (ruMatch) {
    dateStr = ruMatch[1].padStart(2, '0') + '.' + ruMatch[2].padStart(2, '0');
    if (ruMatch[4] && ruMatch[5] && !timeStr) {
      timeStr = ruMatch[4].padStart(2, '0') + ':' + ruMatch[5];
    }
    return { time: timeStr || '--:--', date: dateStr };
  }

  const onlyTime = str.match(/^(\d{1,2}):(\d{2})/);
  if (onlyTime && str.length <= 8) {
    return { time: onlyTime[1].padStart(2, '0') + ':' + onlyTime[2], date: '' };
  }

  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    const t = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    if (d.getFullYear() < 2000) {
      return { time: timeStr || t, date: '' };
    }
    return { time: timeStr || t, date: `${day}.${month}` };
  }

  return { time: timeStr || str.substring(0, 5), date: '' };
}

function extractMatchesArray(data) {
  if (!data) return [];
  if (Array.isArray(data)) return data;
  if (Array.isArray(data.matches)) return data.matches;
  if (Array.isArray(data.data)) return data.data;
  if (Array.isArray(data.rows)) return data.rows;
  if (Array.isArray(data.items)) return data.items;
  return [];
}

function getUserId() { return tg?.initDataUnsafe?.user?.id || 'guest'; }

function checkDailyWelcome() {
  const today = new Date().toISOString().slice(0, 10);
  if (localStorage.getItem('tb25_last_seen') === today) return;
  localStorage.setItem('tb25_last_seen', today);
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `<div class="modal-box">
    <div class="modal-title">⚽ ДОБРО ПОЖАЛОВАТЬ</div>
    <div style="font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:18px;text-align:center;">
      Аналитика футбольных матчей по модели <strong>xG + Пуассон</strong> для поиска игр с высокой вероятностью <strong>ТБ 2.5</strong>.
    </div>
    <button class="modal-btn" onclick="this.closest('.modal-overlay').remove()">ПОНЯЛ 🚀</button>
  </div>`;
  document.body.appendChild(modal);
}

function switchTab(tabName) {
  if (tabName === 'more') {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `<div class="modal-box">
      <div class="modal-title">Дополнительно</div>
      <button class="modal-btn" style="background:var(--surface-hi);color:var(--text)" onclick="switchTab('bonus');this.closest('.modal-overlay').remove()">🎁 Приветственный бонус</button>
      <button class="modal-btn" style="background:var(--surface-hi);color:var(--text)" onclick="switchTab('faq');this.closest('.modal-overlay').remove()">❓ Как работает алгоритм</button>
      <button class="modal-btn" style="background:var(--surface-hi);color:var(--text)" onclick="if(tg&&tg.openTelegramLink)tg.openTelegramLink('${BOT_URL}?start=donate');this.closest('.modal-overlay').remove()">⭐ Поддержать проект</button>
      <button class="modal-btn" style="background:transparent;color:var(--text-mute);margin-bottom:0" onclick="this.closest('.modal-overlay').remove()">Закрыть</button>
    </div>`;
    document.body.appendChild(modal);
    return;
  }

  currentTab = tabName;
  currentLeagueFilter = 'all';

  const isTopTab = ['today', 'tomorrow', 'express'].includes(tabName);
  document.getElementById('topTabsWrap').style.display = isTopTab ? 'block' : 'none';

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tabName));
  document.querySelectorAll('.nav-btn').forEach(n => {
    const activeNav = isTopTab ? 'today' : (['bonus', 'faq'].includes(tabName) ? 'more' : tabName);
    n.classList.toggle('active', n.dataset.nav === activeNav);
  });

  loadData();
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) switchTab(tab.dataset.tab);
});

document.getElementById('bottomNav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (btn) switchTab(btn.dataset.nav);
});

function getCache(tab) {
  try {
    const r = localStorage.getItem('tb25_' + CACHE_VERSION + '_' + tab);
    return r ? JSON.parse(r) : null;
  } catch(e) { return null; }
}

function setCache(tab, data) {
  try {
    const hash = JSON.stringify(data);
    localStorage.setItem('tb25_' + CACHE_VERSION + '_' + tab, JSON.stringify({ hash, data, ts: Date.now() }));
  } catch(e) {}
}

async function fetchWithRetry(url, retries = 1) {
  for (let i = 0; i <= retries; i++) {
    try {
      const sep = url.includes('?') ? '&' : '?';
      const bustUrl = `${url}${sep}_t=${Date.now()}`;
      const resp = await fetch(bustUrl, { signal: abortCtrl?.signal, cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return await resp.json();
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      if (i === retries) throw e;
      await new Promise(r => setTimeout(r, 1200));
    }
  }
}

function setProbFilter(minProb) {
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  currentMinProb = minProb;
  const cached = getCache(currentTab);
  if (cached) renderTab(currentTab, cached.data);
}

function setLeagueFilter(league) {
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  currentLeagueFilter = league;
  const cached = getCache(currentTab);
  if (cached) renderTab(currentTab, cached.data);
}

async function loadData(forceNetwork = false) {
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  isLoading = true;

  const content = document.getElementById('content');
  document.getElementById('filtersWrap').style.display = 'none';

  if (currentTab === 'faq') { renderFaq(); isLoading = false; return; }
  if (currentTab === 'bonus') { renderBonus(); isLoading = false; return; }

  const cached = !forceNetwork ? getCache(currentTab) : null;
  if (cached) {
    renderTab(currentTab, cached.data);
  } else {
    content.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  }

  try {
    const uid = getUserId();
    const result = await fetchWithRetry(`${API_URL}?action=${currentTab}&uid=${uid}`);
    const serverData = result.data !== undefined ? result.data : result;
    const newHash = JSON.stringify(serverData);

    if (!cached || cached.hash !== newHash) {
      setCache(currentTab, serverData);
      renderTab(currentTab, serverData);
    }
  } catch (e) {
    if (e.name === 'AbortError') return;
    if (!cached) {
      content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div>Не удалось загрузить данные из таблицы<br><button onclick="loadData(true)">Повторить</button></div>`;
    }
  } finally {
    isLoading = false;
  }
}

async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.classList.remove('success');

  try {
    localStorage.removeItem('tb25_' + CACHE_VERSION + '_' + currentTab);
    await loadData(true);
    btn.classList.remove('spinning');
    btn.classList.add('success');
    setTimeout(() => btn.classList.remove('success'), 1800);
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch(e) {
    btn.classList.remove('spinning');
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
  }
}

async function silentRefresh() {
  if (document.hidden || !navigator.onLine || isLoading) return;
  if (['faq', 'bonus'].includes(currentTab)) return;

  try {
    const uid = getUserId();
    const resp = await fetch(`${API_URL}?action=${currentTab}&uid=${uid}&_t=${Date.now()}`, { cache: 'no-store' });
    if (!resp.ok) return;
    const result = await resp.json();
    const serverData = result.data !== undefined ? result.data : result;
    const newHash = JSON.stringify(serverData);
    const cached = getCache(currentTab);

    if (!cached || cached.hash !== newHash) {
      setCache(currentTab, serverData);
      const scrollY = window.scrollY;
      renderTab(currentTab, serverData);
      window.scrollTo(0, scrollY);
    }
  } catch (e) {}
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(silentRefresh, 60000);
}

function getLogoPlaceholder(teamName) {
  if (!teamName) return '?';
  return teamName.replace(/[^a-zA-Zа-яА-ЯёЁ0-9]/g, '').substring(0, 3).toUpperCase();
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderTab(tab, data) {
  if (tab === 'today' || tab === 'tomorrow') {
    const list = extractMatchesArray(data);
    renderMatches(list, tab);
  } else if (tab === 'yesterday') {
    renderYesterday(data);
  } else if (tab === 'express') {
    renderExpress(data);
  } else if (tab === 'stats') {
    renderStats(data);
  }
}

function renderMatches(rawList, tabName) {
  const content = document.getElementById('content');
  const filtersWrap = document.getElementById('filtersWrap');
  const probFiltersEl = document.getElementById('probFilters');
  const leagueFiltersEl = document.getElementById('leagueFilters');

  const allMatches = rawList.map(normalizeMatch).filter(Boolean);

  const badgeEl = document.getElementById(`badge-${tabName}`);
  if (badgeEl) {
    badgeEl.textContent = allMatches.length;
    badgeEl.style.display = allMatches.length > 0 ? 'inline-block' : 'none';
  }

  if (!allMatches.length) {
    filtersWrap.style.display = 'none';
    content.innerHTML = `<div class="empty"><div class="empty-icon">⚽</div>В таблице пока нет матчей на ${tabName === 'today' ? 'сегодня' : 'завтра'}</div>`;
    return;
  }

  filtersWrap.style.display = 'flex';

  const count60 = allMatches.filter(m => m.prob >= 60).length;
  const count75 = allMatches.filter(m => m.prob >= 75).length;

  probFiltersEl.innerHTML = `
    <div class="chip ${currentMinProb === 0 ? 'active' : ''}" data-prob="0">Все матчи <span class="chip-count">${allMatches.length}</span></div>
    <div class="chip ${currentMinProb === 60 ? 'active' : ''}" data-prob="60">🔥 60%+ <span class="chip-count">${count60}</span></div>
    <div class="chip ${currentMinProb === 75 ? 'active' : ''}" data-prob="75">💎 Топ 75%+ <span class="chip-count">${count75}</span></div>
  `;
  probFiltersEl.onclick = e => {
    const chip = e.target.closest('.chip');
    if (chip) setProbFilter(Number(chip.dataset.prob));
  };

  let byProb = allMatches.filter(m => m.prob >= currentMinProb);

  const leagues = [...new Set(byProb.map(m => m.league).filter(Boolean))];
  if (currentLeagueFilter !== 'all' && !leagues.includes(currentLeagueFilter)) {
    currentLeagueFilter = 'all';
  }

  if (leagues.length > 1) {
    leagueFiltersEl.style.display = 'flex';
    let lHtml = `<div class="chip ${currentLeagueFilter === 'all' ? 'active' : ''}" data-league="all">Все лиги</div>`;
    leagues.forEach(l => {
      const cnt = byProb.filter(m => m.league === l).length;
      lHtml += `<div class="chip ${currentLeagueFilter === l ? 'active' : ''}" data-league="${escapeHtml(l)}">${escapeHtml(l)} <span class="chip-count">${cnt}</span></div>`;
    });
    leagueFiltersEl.innerHTML = lHtml;
    leagueFiltersEl.onclick = e => {
      const chip = e.target.closest('.chip');
      if (chip) setLeagueFilter(chip.dataset.league);
    };
  } else {
    leagueFiltersEl.style.display = 'none';
  }

  let filtered = currentLeagueFilter === 'all'
    ? byProb
    : byProb.filter(m => m.league === currentLeagueFilter);

  if (!filtered.length) {
    content.innerHTML = `<div class="empty">
      <div class="empty-icon">🔍</div>
      Нет матчей под выбранный фильтр (${currentMinProb}%+)
      <br><button onclick="setProbFilter(0)">Показать все (${allMatches.length})</button>
    </div>`;
    return;
  }

  const sorted = [...filtered].sort((a, b) => b.prob - a.prob);

  let html = '';
  sorted.forEach((m, i) => {
    const prob = m.prob;
    const cls = prob >= 75 ? 'prob-high' : prob >= 65 ? 'prob-mid' : '';
    const live = String(m.result || m.status || '').toLowerCase().includes('live');
    const { time, date } = m.parsedDate;

    html += `<div class="match-card ${cls}" style="animation-delay:${Math.min(i, 8) * 0.035}s">
      <div class="mc-top-info">
        <div class="mc-league-badge">${escapeHtml(m.league)}</div>
        ${live ? '<div class="mc-live">● LIVE</div>' : `<div class="mc-date">${escapeHtml(date || (tabName === 'today' ? 'Сегодня' : 'Завтра'))}</div>`}
      </div>

      <div class="mc-matchup">
        <div class="mc-team">
          <div class="mc-logo">${escapeHtml(getLogoPlaceholder(m.home))}</div>
          <div class="mc-name">${escapeHtml(m.home)}</div>
        </div>
        <div class="mc-time-center">
          <div class="mc-time">${escapeHtml(time)}</div>
          ${m.odd > 1 ? `<div class="mc-odd-pill">Кэф ${m.odd.toFixed(2)}</div>` : ''}
        </div>
        <div class="mc-team">
          <div class="mc-logo">${escapeHtml(getLogoPlaceholder(m.away))}</div>
          <div class="mc-name">${escapeHtml(m.away)}</div>
        </div>
      </div>

      <div class="mc-total-main">
        <div class="mc-total-row">
          <div>
            <div class="mc-total-title">Тотал Больше 2.5</div>
            <div class="mc-total-val ${prob >= 75 ? 'high' : (prob < 60 ? 'low' : '')}">${prob}%</div>
          </div>
          <div class="mc-conf-badge ${prob >= 75 ? 'conf-high' : (prob >= 65 ? 'conf-mid' : 'conf-low')}">
            ${prob >= 75 ? '🔥 Высокая' : (prob >= 65 ? '✅ Оптимально' : '⚡ Повышенный риск')}
          </div>
        </div>
        <div class="prob-progress-bg">
          <div class="prob-progress-fill ${prob >= 75 ? 'high' : ''}" style="width:${Math.min(100, Math.max(8, prob))}%"></div>
        </div>
      </div>
    </div>`;
  });

  content.innerHTML = html;
}

function renderYesterday(data) {
  const content = document.getElementById('content');
  const matches = extractMatchesArray(data);
  if (!matches.length) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">📅</div>За вчерашний день данных нет</div>';
    return;
  }

  const wins = matches.filter(m => m.status === 'win').length;
  const loses = matches.filter(m => m.status === 'lose').length;
  const total = wins + loses;
  const accuracy = total > 0 ? Math.round((wins / total) * 100) : 0;

  let html = `<div style="text-align:center;margin-bottom:20px;background:var(--surface);padding:20px;border-radius:var(--radius);border:1px solid var(--border);">
    <div style="font-family:'JetBrains Mono';font-size:44px;font-weight:900;color:var(--mint);">${accuracy}%</div>
    <div style="font-size:11px;color:var(--text-dim);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:4px;">
      Точность за вчера (✅ ${wins} / ❌ ${loses})
    </div>
  </div>`;

  matches.forEach(m => {
    const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
    const scoreColor = m.status === 'win' ? 'var(--mint)' : m.status === 'lose' ? 'var(--danger)' : 'var(--text)';
    html += `<div class="match-card" style="padding:16px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-size:14px;font-weight:800">${escapeHtml(m.home)} — ${escapeHtml(m.away)}</div>
        <div style="font-family:'JetBrains Mono';font-size:16px;font-weight:900;color:${scoreColor}">${escapeHtml(m.score || '—')}</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-weight:600;">
        <span>⚽ голов: ${escapeHtml(m.total ?? '-')}</span>
        <span>${emoji} ${escapeHtml(m.prediction || 'ТБ 2.5')}</span>
      </div>
    </div>`;
  });
  content.innerHTML = html;
}

function renderExpress(data) {
  const content = document.getElementById('content');
  const rawItems = extractMatchesArray(data);
  const items = rawItems.map(normalizeMatch).filter(Boolean);

  if (!items.length) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">🔥</div>Экспресс дня ещё формируется</div>';

  let totalOdd = 1;

  let html = `<div style="background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:20px;padding:24px;text-align:center;margin-bottom:16px;border:1px solid rgba(255,255,255,0.12);">

    <div style="font-size:11px;color:#c7d2fe;font-weight:600;">Итоговый коэффициент (${items.length} событий)</div>
  </div>`;

  items.forEach((m, i) => {
    const odd = m.odd > 1 ? m.odd : 1.5;
    html += `<div class="match-card" style="padding:16px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <div style="width:24px;height:24px;background:var(--mint);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;">${i + 1}</div>
        <div style="font-weight:800;font-size:13px">${escapeHtml(m.home)} — ${escapeHtml(m.away)}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="background:var(--surface);padding:10px;border-radius:10px;border:1px solid var(--border);">
          <div style="font-size:10px;color:var(--text-mute);font-weight:700">ВЕРОЯТНОСТЬ ТБ 2.5</div>
          <div style="font-family:'JetBrains Mono';font-size:18px;font-weight:800;color:var(--mint);margin-top:2px;">${m.prob}%</div>
        </div>
        <div style="background:var(--surface);padding:10px;border-radius:10px;border:1px solid var(--border);">
          <div style="font-size:10px;color:var(--text-mute);font-weight:700">КОЭФФИЦИЕНТ</div>
          <div style="font-family:'JetBrains Mono';font-size:18px;font-weight:800;color:var(--gold);margin-top:2px;">${odd.toFixed(2)}</div>
        </div>
      </div>
    </div>`;
  });

  html += `<div style="margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;">
    <label style="font-size:11px;font-weight:800;color:var(--text-dim);text-transform:uppercase;">💰 Калькулятор потенциального выигрыша</label>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px;">
      <input type="number" inputmode="numeric" id="calcInput" placeholder="1000" oninput="calcWin(${totalOdd})" style="flex:1;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'JetBrains Mono';font-size:16px;font-weight:700;outline:none;">
      <div id="calcResult" style="font-family:'JetBrains Mono';font-size:20px;font-weight:900;color:var(--gold);">—</div>
    </div>
  </div>`;
  content.innerHTML = html;
}

function calcWin(odd) {
  const input = document.getElementById('calcInput');
  const result = document.getElementById('calcResult');
  if (!input || !result) return;
  const val = parseFloat(input.value);
  if (isNaN(val) || val <= 0) { result.textContent = '—'; return; }
  result.textContent = '≈ ' + Math.round(val * odd).toLocaleString('ru-RU') + ' ₽';
}

    <div style="padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;text-align:center;">

  if (leagues.length) {

        <div style="font-size:11px;color:var(--text-mute);font-weight:600">✅ ${lg.wins || 0} · ❌ ${lg.loses || 0}</div>
      </div>`;
    });
  }
  content.innerHTML = html;
}
