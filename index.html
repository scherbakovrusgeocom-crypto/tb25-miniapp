<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ Прогнозы ТБ 2.5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #05140a;
  --card: #0e2916;
  --card2: #123821;
  --border: rgba(74, 222, 128, 0.15);
  --border-strong: rgba(74, 222, 128, 0.35);
  --text: #ffffff;
  --text-dim: #86efac;
  --text-mute: #65a30d;
  --green: #22c55e;
  --green-bright: #4ade80;
  --gold: #f59e0b;
  --gold-bright: #fbbf24;
  --red: #ef4444;
  --cyan: #06b6d4;
  --purple: #8b5cf6;
  --purple-bright: #a78bfa;
  --header-bg-1: #0a2412;
  --header-bg-2: #05140a;
  --tabs-bg: rgba(5, 20, 10, 0.95);
}
body.light-theme {
  --bg: #f0fdf4;
  --card: #ffffff;
  --card2: #ecfdf5;
  --border: rgba(34, 197, 94, 0.2);
  --border-strong: rgba(34, 197, 94, 0.4);
  --text: #052e16;
  --text-dim: #166534;
  --text-mute: #16a34a;
  --header-bg-1: #dcfce7;
  --header-bg-2: #f0fdf4;
  --tabs-bg: rgba(240, 253, 244, 0.95);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 0 0 30px;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -webkit-touch-callout: none;
  transition: background 0.3s ease, color 0.3s ease;
}
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(circle at 50% 0%, rgba(34, 197, 94, 0.12) 0%, transparent 50%),
    radial-gradient(circle at 10% 90%, rgba(34, 197, 94, 0.06) 0%, transparent 40%);
  pointer-events: none;
  z-index: 0;
  opacity: 1;
  transition: opacity 0.3s ease;
}
body.light-theme::before { opacity: 0.5; }

/* ===== ШАПКА ===== */
.header {
  position: relative;
  padding: 22px 20px 18px;
  text-align: center;
  background: linear-gradient(180deg, var(--header-bg-1) 0%, var(--header-bg-2) 100%);
  border-bottom: 1px solid var(--border);
  z-index: 1;
  transition: background 0.3s ease;
}
.header-top {
  position: absolute;
  top: 14px;
  right: 14px;
  display: flex;
  gap: 8px;
  z-index: 5;
}
.theme-btn {
  width: 36px;
  height: 36px;
  background: rgba(74, 222, 128, 0.1);
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  color: var(--green-bright);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.25s;
}
.theme-btn:active { transform: scale(0.9) rotate(20deg); }
.theme-btn svg { width: 18px; height: 18px; stroke-width: 2; }

.ball-wrap {
  position: relative;
  width: 64px;
  height: 64px;
  margin: 0 auto 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, rgba(34, 197, 94, 0.2), transparent 70%);
  border-radius: 50%;
  animation: ballPulse 2s ease-in-out infinite;
}
@keyframes ballPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.ball-emoji {
  font-size: 44px;
  line-height: 1;
  filter: drop-shadow(0 4px 16px rgba(34, 197, 94, 0.7));
  animation: ballRotate 6s ease-in-out infinite;
}
@keyframes ballRotate {
  0%, 100% { transform: rotate(-15deg); }
  50% { transform: rotate(15deg); }
}
.header h1 {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 3px;
  color: var(--green-bright);
  text-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
  font-family: 'Arial Black', 'Impact', sans-serif;
  transition: color 0.3s ease;
}
.header .sub {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text-dim);
  margin-top: 5px;
  text-transform: uppercase;
  font-weight: 700;
}

/* ===== ЧИПЫ ===== */
.header-chips {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
  position: relative;
  z-index: 2;
}
.header-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
  border-radius: 20px;
  color: var(--green-bright);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  -webkit-user-select: none;
}
.header-chip svg { width: 14px; height: 14px; stroke-width: 2.2; }
.header-chip:active { transform: scale(0.95); background: rgba(34, 197, 94, 0.25); }

.header-chip.bonus-chip {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg,
    rgba(255, 255, 255, 0.12) 0%,
    rgba(255, 255, 255, 0.04) 50%,
    rgba(255, 255, 255, 0.12) 100%);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    inset 0 -1px 0 rgba(255, 255, 255, 0.08),
    0 4px 12px rgba(0, 0, 0, 0.25);
}
.header-chip.bonus-chip::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
  animation: glassShimmer 6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes glassShimmer {
  0%, 80% { left: -100%; }
  85% { left: 100%; }
  100% { left: 100%; }
}
.header-chip.bonus-chip svg { position: relative; z-index: 1; }
.header-chip.bonus-chip span { position: relative; z-index: 1; }

/* ===== ТАБЫ ===== */
.tabs-wrap {
  position: sticky;
  top: 0;
  background: var(--tabs-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 10px 12px;
  z-index: 10;
  border-bottom: 1px solid var(--border);
  transition: background 0.3s ease;
}
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; justify-content: space-between; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 4px;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 800;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid transparent;
  transition: all 0.25s;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.tab svg { width: 18px; height: 18px; stroke-width: 2.2; }
.tab.active {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(74, 222, 128, 0.15));
  border-color: var(--green);
  color: var(--green-bright);
  box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
}

#content { padding: 14px 16px; position: relative; z-index: 1; }

/* ===== КАРТОЧКА ===== */
.card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  position: relative;
  animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
}
body.light-theme .card { box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }

@keyframes cardSlideIn {
  0% { opacity: 0; transform: translateY(20px) scale(0.96); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.card.card-hot { border-color: rgba(245, 158, 11, 0.5); box-shadow: 0 4px 24px rgba(245, 158, 11, 0.15); }
.card.card-mid { border-color: rgba(34, 197, 94, 0.4); }
.card.card-live { border-color: rgba(239, 68, 68, 0.5); animation: cardSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1), livePulse 2s ease-in-out infinite; }
@keyframes livePulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.15); }
  50% { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35); }
}

.card-teams { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding-right: 70px; }
.team {
  flex: 1;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  min-width: 0;
}
.team.right { text-align: right; }
.vs {
  font-size: 10px;
  font-weight: 900;
  color: var(--text-mute);
  padding: 3px 8px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 6px;
  flex-shrink: 0;
}
body.light-theme .vs { background: rgba(0, 0, 0, 0.06); }

.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 12px;
  font-weight: 600;
  flex-wrap: wrap;
}
.card-meta .meta-item { display: flex; align-items: center; gap: 4px; }

.card-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}
.stat-box {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  transition: background 0.3s ease;
}
body.light-theme .stat-box { background: rgba(34, 197, 94, 0.08); }
.stat-box .label {
  font-size: 9px;
  color: var(--text-mute);
  text-transform: uppercase;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.stat-box .value {
  font-size: 16px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.stat-box.blue .value { color: #22d3ee; }
.stat-box.green .value { color: var(--green-bright); }
.stat-box.gold .value { color: var(--gold-bright); }
body.light-theme .stat-box.blue .value { color: #0891b2; }
body.light-theme .stat-box.green .value { color: #16a34a; }
body.light-theme .stat-box.gold .value { color: #d97706; }

.outcome-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 14px;
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(34, 197, 94, 0.2);
  border-radius: 10px;
  font-size: 12px;
  margin-bottom: 6px;
}
.outcome-line:last-child { margin-bottom: 0; }
.outcome-line.double {
  background: rgba(139, 92, 246, 0.08);
  border-color: rgba(139, 92, 246, 0.2);
}
.outcome-line .label { color: var(--text-dim); font-weight: 700; }
.outcome-line .fav { color: var(--green-bright); font-weight: 900; }
.outcome-line.double .fav { color: var(--purple-bright); }
body.light-theme .outcome-line .fav { color: #16a34a; }
body.light-theme .outcome-line.double .fav { color: #7c3aed; }

.card-actions {
  position: absolute;
  top: 12px; right: 12px;
  display: flex;
  gap: 6px;
  z-index: 2;
}
.icon-btn {
  width: 30px; height: 30px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  user-select: none;
}
body.light-theme .icon-btn { background: rgba(34, 197, 94, 0.1); }
.icon-btn:active { transform: scale(0.85); }
.icon-btn.active {
  color: var(--gold-bright);
  border-color: var(--gold-bright);
  background: rgba(245, 158, 11, 0.15);
}

.live-badge {
  display: inline-block;
  padding: 2px 7px;
  background: var(--red);
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  border-radius: 5px;
  letter-spacing: 0.5px;
  animation: livePulse 1.5s infinite;
}

/* ===== СКЕЛЕТОНЫ ===== */
.skeleton-card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  overflow: hidden;
  position: relative;
}
.skeleton-card::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
  animation: skeletonShimmer 1.6s ease-in-out infinite;
}
@keyframes skeletonShimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}
.skeleton-line {
  height: 12px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  margin-bottom: 10px;
}
body.light-theme .skeleton-line { background: rgba(34, 197, 94, 0.1); }
.skeleton-line.w-70 { width: 70%; }
.skeleton-line.w-50 { width: 50%; }
.skeleton-line.w-100 { width: 100%; }
.skeleton-line.h-16 { height: 16px; }
.skeleton-balls {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 20px 0;
}
.skeleton-ball {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(74, 222, 128, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  animation: ballBounce 1.2s ease-in-out infinite;
}
.skeleton-ball:nth-child(2) { animation-delay: 0.15s; }
.skeleton-ball:nth-child(3) { animation-delay: 0.3s; }
@keyframes ballBounce {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(-8px); opacity: 1; }
}

/* ===== СВОДКА ВЧЕРА ===== */
.yesterday-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}
.yesterday-stat {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 8px;
  text-align: center;
  animation: cardSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.yesterday-stat .ys-num {
  font-size: 24px;
  font-weight: 900;
  display: block;
  margin-bottom: 4px;
  font-variant-numeric: tabular-nums;
}
.yesterday-stat .ys-label {
  font-size: 10px;
  color: var(--text-dim);
  font-weight: 800;
  letter-spacing: 0.3px;
}
.yesterday-stat.win {
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(74, 222, 128, 0.08));
  border-color: rgba(34, 197, 94, 0.4);
}
.yesterday-stat.win .ys-num { color: var(--green-bright); }
.yesterday-stat.lose {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(244, 63, 94, 0.08));
  border-color: rgba(239, 68, 68, 0.4);
}
.yesterday-stat.lose .ys-num { color: #f87171; }
.yesterday-stat.acc .ys-num { color: var(--gold-bright); }

/* ===== ЭКСПРЕСС ===== */
.express-hero {
  background: linear-gradient(135deg, #78350f 0%, #b45309 50%, #d97706 100%);
  border-radius: 20px;
  padding: 24px 20px;
  color: #fff;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(217, 119, 6, 0.4);
  animation: cardSlideIn 0.5s ease;
}
.express-hero-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
.express-hero-sub { font-size: 10px; opacity: 0.9; margin-top: 4px; }
.express-hero-odd {
  font-size: 52px; font-weight: 900; margin-top: 12px;
  background: linear-gradient(180deg, #fef9c3, #fbbf24, #f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
}
.express-hero-label {
  font-size: 9px; opacity: 0.85; letter-spacing: 2px; margin-top: 6px;
  text-transform: uppercase; font-weight: 700;
}
.express-items-title {
  text-align: center; font-size: 12px; color: var(--text-dim);
  margin-bottom: 12px; font-weight: 800; letter-spacing: 1px;
}
.express-card {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 8px;
  animation: cardSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.express-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.express-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  background: var(--green);
  color: #fff; font-size: 11px; font-weight: 900;
  border-radius: 50%; flex-shrink: 0;
}
.express-match { font-size: 13px; font-weight: 800; }
.express-league { font-size: 10px; color: var(--text-dim); margin-left: 34px; margin-bottom: 10px; }
.express-card-body {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; background: rgba(0, 0, 0, 0.25);
  border-radius: 10px; padding: 10px 6px;
}
body.light-theme .express-card-body { background: rgba(34, 197, 94, 0.08); }
.express-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.express-stat-label { font-size: 9px; color: var(--text-mute); text-transform: uppercase; font-weight: 800; }
.express-stat-value { font-size: 13px; font-weight: 900; }
.express-odd { font-size: 15px; font-weight: 900; color: var(--gold-bright); }
.express-footer {
  background: linear-gradient(135deg, #0a2412, #143d24);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 16px 20px;
  margin-top: 14px;
}
.express-footer-row {
  display: flex; justify-content: space-between;
  font-size: 13px; padding: 7px 0;
  color: var(--text-dim); font-weight: 600;
}
.express-footer-row:last-child {
  margin-top: 6px; padding-top: 12px;
  border-top: 1px solid rgba(34, 197, 94, 0.3);
  color: var(--text); font-size: 14px;
}
.express-footer-odd { font-size: 24px; font-weight: 900; color: var(--gold-bright); }

/* ===== СТАТИСТИКА ===== */
.stats-wrap { padding: 10px 0; }
.stats-big {
  text-align: center; font-size: 66px; font-weight: 900;
  background: linear-gradient(135deg, var(--green-bright), var(--green));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1;
  margin-bottom: 6px;
}
.stats-label {
  text-align: center; color: var(--text-dim);
  font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; font-weight: 800;
  margin-bottom: 24px;
}
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.stats-box {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 16px;
  text-align: center;
  animation: cardSlideIn 0.4s ease;
}
.stats-box.clickable:active { transform: scale(0.97); }
.stats-box .num { font-size: 28px; font-weight: 900; display: block; margin-bottom: 4px; }
.stats-box .name { font-size: 11px; color: var(--text-dim); font-weight: 800; }
.stats-box.win .num { color: var(--green-bright); }
.stats-box.lose .num { color: #f87171; }

/* ===== СТАТИСТИКА ПО ЛИГАМ ===== */
.leagues-title {
  font-size: 13px;
  font-weight: 900;
  color: var(--green-bright);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
  margin-top: 24px;
}
.league-item {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: cardSlideIn 0.4s ease;
}
.league-name {
  flex: 1;
  font-size: 12px;
  font-weight: 800;
  line-height: 1.3;
}
.league-stats {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 11px;
  font-weight: 800;
}
.league-win { color: var(--green-bright); }
.league-lose { color: #f87171; }
.league-acc {
  background: rgba(34, 197, 94, 0.15);
  color: var(--green-bright);
  padding: 3px 8px;
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
}

/* ===== FAQ ===== */
.faq-header { text-align: center; padding: 16px 0 20px; }
.faq-header-icon {
  width: 60px; height: 60px;
  margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(34, 197, 94, 0.15);
  border: 2px solid var(--green);
  border-radius: 50%;
  font-size: 30px;
}
.faq-header-title {
  font-size: 22px; font-weight: 900; letter-spacing: 2px;
  color: var(--green-bright);
  margin-bottom: 4px;
}
.faq-header-sub {
  font-size: 11px; color: var(--text-dim);
  letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
}
.faq-section { margin-bottom: 20px; }
.faq-section-title {
  font-size: 11px; font-weight: 900;
  color: var(--green-bright);
  text-transform: uppercase; letter-spacing: 1.5px;
  margin-bottom: 10px;
}
.faq-item {
  background: linear-gradient(135deg, var(--card) 0%, var(--card2) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  animation: cardSlideIn 0.4s ease;
}
.faq-q {
  font-size: 13px; font-weight: 800;
  margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 8px;
  line-height: 1.3;
}
.faq-q-icon {
  flex-shrink: 0;
  width: 20px; height: 20px;
  background: var(--green);
  color: #fff; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 900; margin-top: 2px;
}
.faq-a {
  font-size: 12px; color: var(--text-dim);
  line-height: 1.55; padding-left: 28px;
}
.faq-a strong { color: var(--green-bright); font-weight: 800; }
.faq-a ul { margin-top: 6px; padding-left: 16px; }
.faq-a li { margin-bottom: 4px; }
.faq-stat {
  display: inline-block; padding: 2px 8px;
  background: rgba(34, 197, 94, 0.15);
  color: var(--green-bright);
  border-radius: 6px; font-size: 11px; font-weight: 800;
  margin: 0 2px;
}
.faq-highlight {
  background: rgba(34, 197, 94, 0.06);
  border-radius: 8px;
  padding: 10px 12px; margin-top: 10px;
  font-size: 12px; line-height: 1.5;
}

/* ===== ДИСКЛЕЙМЕР ===== */
.disclaimer {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(239, 68, 68, 0.05));
  border: 1px solid rgba(245, 158, 11, 0.3);
  border-radius: 14px;
  padding: 14px 16px;
  margin-top: 14px;
}
.disclaimer-title {
  font-size: 12px;
  font-weight: 900;
  color: var(--gold-bright);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.disclaimer-title::before { content: '⚠️'; font-size: 16px; }
.disclaimer-text {
  font-size: 11px;
  color: var(--text);
  line-height: 1.6;
  opacity: 0.95;
}
.disclaimer-text strong { color: var(--gold-bright); }

/* ===== БОНУС ===== */
.bonus-card {
  background: linear-gradient(135deg, #7c2d12, #b45309, #d97706);
  border-radius: 20px;
  padding: 26px 20px;
  color: #fff;
  text-align: center;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(217, 119, 6, 0.4);
  animation: cardSlideIn 0.5s ease;
}
.bonus-card::before {
  content: '🎁';
  position: absolute;
  top: 12px; right: 16px;
  font-size: 36px;
  opacity: 0.4;
}
.bonus-title {
  font-size: 20px; font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.bonus-text {
  font-size: 13px;
  opacity: 0.95;
  line-height: 1.6;
  margin-bottom: 18px;
}
.bonus-btn {
  display: inline-block;
  padding: 12px 30px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #78350f;
  text-decoration: none;
  border-radius: 28px;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.5px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  border: none;
  cursor: pointer;
  transition: 0.2s;
}
.bonus-btn:active { transform: scale(0.96); }

/* ===== EMPTY / ERROR ===== */
.empty {
  text-align: center; color: var(--text-mute);
  padding: 70px 20px; font-size: 13px; font-weight: 700;
}
.empty::before {
  content: '⚽'; font-size: 56px;
  display: block; margin-bottom: 14px; opacity: 0.4;
}
.error {
  text-align: center; color: #f87171;
  padding: 20px; font-size: 13px;
  background: rgba(239, 68, 68, 0.08);
  border-radius: 14px; font-weight: 600;
}

.winner-badge {
  display: inline-block;
  padding: 4px 10px;
  background: rgba(34, 197, 94, 0.12);
  color: var(--green-bright);
  border-radius: 8px;
  font-size: 11px; font-weight: 800;
  margin-top: 6px;
}
body.light-theme .winner-badge { color: #16a34a; }

.sync-line {
  text-align: center;
  font-size: 10px;
  color: var(--text-mute);
  padding: 16px 16px 8px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.section-title {
  font-size: 20px; font-weight: 900;
  text-align: center; margin-bottom: 4px;
  letter-spacing: 1px; color: var(--green-bright);
}
.section-sub {
  font-size: 11px; color: var(--text-dim);
  text-align: center; margin-bottom: 16px;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="theme-btn" onclick="toggleTheme()" title="Сменить тему">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

      </svg>
    </div>
  </div>

  <div class="ball-wrap">
    <div class="ball-emoji">⚽</div>
  </div>
  <h1>ПРОГНОЗЫ</h1>
  <div class="sub">ТОТАЛ БОЛЬШЕ 2.5</div>

  <div class="header-chips">
    <div class="header-chip bonus-chip" onclick="switchTabDirect('bonus')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

        <path d="M12 8v13M3 12h18"/>
        <path d="M7.5 8a2.5 2.5 0 010-5c1.5 0 2.5 1 4.5 5"/>
        <path d="M16.5 8a2.5 2.5 0 000-5c-1.5 0-2.5 1-4.5 5"/>
      </svg>
      <span>Бонус</span>
    </div>
    <div class="header-chip" onclick="switchTabDirect('faq')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
        <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
      </svg>
      FAQ
    </div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Сегодня
    </div>
    <div class="tab" data-tab="tomorrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Завтра
    </div>
    <div class="tab" data-tab="yesterday">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Вчера
    </div>
    <div class="tab" data-tab="express">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Экспресс
    </div>
    <div class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 12l4-4 4 4 5-5"/></svg>
      Стата
    </div>
  </div>
</div>

<div id="content"></div>
<div class="sync-line" id="syncLine"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxW52PKcn0Mh2L6yjQ5-5IiuCdds8FksK1XzY6F_iElSnFuAH4f5Hz9JH97pEDD1hcw/exec';
const AD_URL = 'https://baltbet.ru/account/register?refpromo=1221753';

const CACHE_TTL = 30 * 60 * 1000;
let currentTab = 'today';

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ===== ТЕМА ===== */
function initTheme() {
  const saved = localStorage.getItem('tb25_theme') || 'dark';
  if (saved === 'light') document.body.classList.add('light-theme');
  updateThemeIcon(saved);
}
function toggleTheme() {
  haptic('medium');
  const isLight = document.body.classList.toggle('light-theme');
  const theme = isLight ? 'light' : 'dark';
  localStorage.setItem('tb25_theme', theme);
  updateThemeIcon(theme);
}
function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  if (theme === 'light') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
  }
}
initTheme();

function haptic(s) {
  if (tg?.HapticFeedback) try {
    if (s === 'medium') tg.HapticFeedback.impactOccurred('medium');
    else if (s === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
    else tg.HapticFeedback.impactOccurred('light');
  } catch(e){}
}

function switchTabDirect(tabName) {
  haptic('medium');
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabName);
  });
  currentTab = tabName;
  loadData();
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  haptic('medium');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentTab = tab.dataset.tab;
  loadData();
});

function getCache(tab) {
  try { const r = localStorage.getItem(`tb25_v20_${tab}`); return r ? JSON.parse(r) : null; } catch(e){ return null; }
}
function setCache(tab, version, data) {
  try {
    localStorage.setItem(`tb25_v20_${tab}`, JSON.stringify({ version, data, ts: Date.now() }));
    localStorage.setItem('tb25_last_update', new Date().toISOString());
  } catch(e){}
}

function updateSyncLine() {
  const el = document.getElementById('syncLine');
  if (!el) return;
  try {
    const iso = localStorage.getItem('tb25_last_update');
    if (!iso) { el.textContent = ''; return; }
    const d = new Date(iso);
    const now = new Date();
    const diffMin = Math.floor((now - d) / 60000);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    let ago = '';
    if (diffMin < 1) ago = 'только что';
    else if (diffMin < 60) ago = `${diffMin} мин назад`;
    else if (diffMin < 1440) ago = `${Math.floor(diffMin / 60)} ч назад`;
    else ago = `${Math.floor(diffMin / 1440)} дн назад`;
    el.textContent = `🕐 Обновлено: ${hh}:${mm} · ${day}.${month} (${ago})`;
  } catch (e) { el.textContent = ''; }
}

function showSkeleton() {
  return `
    <div class="skeleton-card">
      <div class="skeleton-balls">
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
      </div>
      <div class="skeleton-line w-70 h-16"></div>
      <div class="skeleton-line w-50"></div>
      <div class="skeleton-line w-100"></div>
      <div class="skeleton-line w-70"></div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton-balls">
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
        <div class="skeleton-ball">⚽</div>
      </div>
      <div class="skeleton-line w-70 h-16"></div>
      <div class="skeleton-line w-50"></div>
      <div class="skeleton-line w-100"></div>
      <div class="skeleton-line w-70"></div>
    </div>
  `;
}

async function loadData() {
  const content = document.getElementById('content');

  if (currentTab === 'faq') { renderFaq(); updateSyncLine(); return; }
  if (currentTab === 'bonus') { renderBonus(); updateSyncLine(); return; }

  const cached = getCache(currentTab);

  if (cached) {
    renderTab(currentTab, cached.data);
    updateSyncLine();
    if ((Date.now() - cached.ts) < CACHE_TTL) return;
  } else {
    content.innerHTML = showSkeleton();
  }

  try {
    const resp = await fetch(`${API_URL}?action=${currentTab}`);
    const result = await resp.json();
    if (result.error) throw new Error(result.error);
    const serverVersion = result.version || '1';
    const serverData = result.data !== undefined ? result.data : result;
    if (!cached || cached.version !== serverVersion) {
      setCache(currentTab, serverVersion, serverData);
      renderTab(currentTab, serverData);
      updateSyncLine();
    } else {
      setCache(currentTab, serverVersion, serverData);
      updateSyncLine();
    }
  } catch (e) {
    if (!cached) content.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

function renderTab(tab, data) {
  if (tab === 'today' || tab === 'tomorrow') {
    renderMatches(Array.isArray(data) ? data : []);
  }
  else if (tab === 'yesterday') renderYesterday(data);
  else if (tab === 'express') renderExpress(data);
  else if (tab === 'stats') renderStats(data);
  else if (tab === 'faq') renderFaq();
  else if (tab === 'bonus') renderBonus();
}

function cardClass(p) { return p >= 70 ? 'card-hot' : p >= 65 ? 'card-mid' : ''; }

/* ===== ПОДЕЛИТЬСЯ ===== */
function shareMatch(home, away, total, prob, odd, prediction) {
  haptic('medium');
  const text = `⚽ ${home} — ${away}\n📊 Тотал: ${total} · Вероятность: ${prob}%\n💰 Кэф: ${odd}\n🏆 Прогноз: ${prediction}\n\n📱 От @total25_signals_bot`;
  if (tg?.switchInlineQuery) {
    tg.switchInlineQuery(text, ['users', 'groups']);
  } else {
    navigator.clipboard?.writeText(text).then(() => {
      alert('Скопировано:\n\n' + text);
    }).catch(() => alert(text));
  }
}

/* ===== МАТЧИ ===== */
function renderMatches(data) {
  const content = document.getElementById('content');
  if (!Array.isArray(data) || !data.length) {
    content.innerHTML = '<div class="empty">Нет матчей</div>';
    return;
  }

  let html = '';
  data.forEach((m, idx) => {
    const prob = parseInt(m.probability) || 0;
    const live = String(m.result || '').includes('Live');

    let outcomeHtml = '';
    let predLabel = 'ТБ 2.5';
    if (m.outcome) {
      const o = m.outcome;
      const p1 = o.p1 || 0, px = o.x || 0, p2 = o.p2 || 0;
      const best = Math.max(p1, px, p2);
      let mainLabel = 'X';
      if (best === p1) mainLabel = 'П1';
      else if (best === p2) mainLabel = 'П2';
      predLabel = mainLabel + ' ' + best + '%';

      const chance1X = p1 + px;
      const chance2X = p2 + px;
      const chance12 = p1 + p2;
      let doubleLabel = '1X';
      let bestDouble = chance1X;
      if (chance2X > bestDouble) { doubleLabel = '2X'; bestDouble = chance2X; }
      if (chance12 > bestDouble) { doubleLabel = '12'; bestDouble = chance12; }

      outcomeHtml = `
        <div class="outcome-line">
          <span class="label">🏆 Прогноз</span>
          <span class="fav">${mainLabel} · ${best}%</span>
        </div>
        <div class="outcome-line double" style="margin-bottom:0;">
          <span class="label">🎯 Двойной шанс</span>
          <span class="fav">${doubleLabel} · ${bestDouble}%</span>
        </div>
      `;
    }

    const mHomeEsc = String(m.home).replace(/'/g, "\\'");
    const mAwayEsc = String(m.away).replace(/'/g, "\\'");
    const mPredEsc = String(predLabel).replace(/'/g, "\\'");

    html += `
      <div class="card ${cardClass(prob)} ${live ? 'card-live' : ''}" style="animation-delay: ${idx * 0.05}s;">
        <div class="card-actions">
          <button class="icon-btn" onclick="shareMatch('${mHomeEsc}','${mAwayEsc}','${m.total}','${prob}','${m.odd}','${mPredEsc}')" title="Поделиться">📤</button>
        </div>
        <div class="card-teams">
          <div class="team">${m.home}</div>
          <div class="vs">VS</div>
          <div class="team right">${m.away}</div>
        </div>
        <div class="card-meta">
          <div class="meta-item">🏆 ${m.league}</div>
          <div class="meta-item">📅 ${m.time}</div>
          ${live ? '<div class="meta-item"><span class="live-badge">LIVE</span></div>' : ''}
        </div>
        <div class="card-stats">
          <div class="stat-box blue"><div class="label">Тотал</div><div class="value">${m.total}</div></div>
          <div class="stat-box green"><div class="label">Вероят.</div><div class="value">${prob}%</div></div>
          <div class="stat-box gold"><div class="label">Кэф</div><div class="value">${m.odd}</div></div>
        </div>
        ${outcomeHtml}
      </div>
    `;
  });
  content.innerHTML = html;
}

function renderYesterday(data) {
  const content = document.getElementById('content');

  let matches = [];
  let wins = 0, loses = 0, accuracy = 0, total = 0;
  let dateStr = '';
  let isYesterday = true;

  if (Array.isArray(data)) {
    matches = data;
    matches.forEach(m => { if (m.status === 'win') wins++; else if (m.status === 'lose') loses++; });
    total = wins + loses;
    accuracy = total > 0 ? Math.round(wins / total * 100) : 0;
  } else if (data && data.matches) {
    matches = data.matches || [];
    wins = data.wins || 0;
    loses = data.loses || 0;
    accuracy = data.accuracy || 0;
    total = data.total || 0;
    dateStr = data.date || '';
    isYesterday = data.isYesterday !== false;
  }

  if (!matches.length) {
    content.innerHTML = '<div class="empty">Вчера матчей не было</div>';
    return;
  }

  const titleText = isYesterday ? '✅ ВЧЕРА' : '📅 ПОСЛЕДНИЕ МАТЧИ';
  const subtitleText = isYesterday
    ? `${dateStr} · ${total} матчей`
    : `Последние ${total} матчей из архива`;

  let html = `
    <div class="section-title">${titleText}</div>
    <div class="section-sub">${subtitleText}</div>

    <div class="yesterday-summary">
      <div class="yesterday-stat win">
        <div class="ys-num">${wins}</div>
        <div class="ys-label">✅ Зашло</div>
      </div>
      <div class="yesterday-stat lose">
        <div class="ys-num">${loses}</div>
        <div class="ys-label">❌ Не зашло</div>
      </div>
      <div class="yesterday-stat acc">
        <div class="ys-num">${accuracy}%</div>
        <div class="ys-label">🎯 Точность</div>
      </div>
    </div>
  `;

  matches.forEach((m, idx) => {
    const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
    const cls = m.status === 'win' ? 'card-win' : m.status === 'lose' ? 'card-lose' : '';
    const winnerHtml = m.winner ? `<div class="winner-badge">🏆 ${m.winner}</div>` : '';

    html += `
      <div class="card ${cls}" style="animation-delay: ${idx * 0.05}s;">
        <div class="card-teams">
          <div class="team">${m.home}</div>
          <div class="vs">${m.score || '—'}</div>
          <div class="team right">${m.away}</div>
        </div>
        <div class="card-meta">
          <div class="meta-item">🏆 ${m.league}</div>
          <div class="meta-item">⚽ ${m.total} голов</div>
          ${m.date ? `<div class="meta-item">📅 ${m.date} ${m.time || ''}</div>` : ''}
        </div>
        <div class="outcome-line" style="margin-bottom:0;">
          <span class="label">${emoji} Прогноз</span>
          <span class="fav">${m.prediction}</span>
        </div>
        ${winnerHtml}
      </div>
    `;
  });

  content.innerHTML = html;
}

function renderExpress(data) {
  const content = document.getElementById('content');
  if (!data || !data.matches || !data.matches.length) {
    content.innerHTML = '<div class="empty">Экспресс ещё не собран</div>';
    return;
  }
  let html = `
    <div class="express-hero">
      <div class="express-hero-title">🔥 ТОП-ЭКСПРЕСС</div>
      <div class="express-hero-sub">🎯 Все события на ТБ 2.5</div>
      <div class="express-hero-odd">${data.totalOdd}</div>
      <div class="express-hero-label">итоговый коэффициент</div>
    </div>
    <div class="express-items-title">📊 СОБЫТИЯ (${data.count})</div>
  `;
  data.matches.forEach((m, i) => {
    const prob = parseInt(m.probability) || 0;
    const oddNum = parseFloat(m.odd) || 1;
    html += `
      <div class="express-card" style="animation-delay: ${i * 0.08}s;">
        <div class="express-card-head">
          <span class="express-num">${i + 1}</span>
          <span class="express-match">${m.home} — ${m.away}</span>
        </div>
        <div class="express-league">🏆 ${m.league}</div>
        <div class="express-card-body">
          <div class="express-stat"><div class="express-stat-label">Тотал</div><div class="express-stat-value">${m.total}</div></div>
          <div class="express-stat"><div class="express-stat-label">Вероят.</div><div class="express-stat-value" style="color:${prob>=65?'#4ade80':'#fbbf24'}">${prob}%</div></div>
          <div class="express-stat"><div class="express-stat-label">Кэф</div><div class="express-odd">${oddNum.toFixed(2)}</div></div>
        </div>
      </div>
    `;
  });
  html += `
    <div class="express-footer">
      <div class="express-footer-row"><span>🎯 Стратегия</span><span>Тотал Больше 2.5</span></div>
      <div class="express-footer-row"><span>📊 Событий</span><span>${data.count}</span></div>
      <div class="express-footer-row"><span>💰 Общий кэф</span><span class="express-footer-odd">${data.totalOdd}</span></div>
    </div>
  `;
  content.innerHTML = html;
}

/* ===== СТАТИСТИКА ===== */
function renderStats(data) {
  if (!data) { document.getElementById('content').innerHTML = '<div class="empty">Статистики пока нет</div>'; return; }

  let html = `
    <div class="stats-wrap">
      <div class="stats-big">${data.accuracy}%</div>
      <div class="stats-label">Точность прогнозов</div>
      <div class="stats-grid">
        <div class="stats-box win clickable" onclick="openHistory('wins')">
          <span class="num">${data.wins}</span>
          <span class="name">✅ Зашло →</span>
        </div>
        <div class="stats-box lose clickable" onclick="openHistory('loses')">
          <span class="num">${data.loses}</span>
          <span class="name">❌ Не зашло →</span>
        </div>
      </div>
      <div class="stats-box clickable" onclick="openHistory('all')" style="margin-top:12px;">
        <span class="num">${data.total}</span>
        <span class="name">📈 Всего матчей →</span>
      </div>
  `;

  // Статистика по лигам
  if (data.leagues && data.leagues.length) {
    html += `<div class="leagues-title">📊 ПО ЛИГАМ</div>`;
    data.leagues.forEach((lg, i) => {
      html += `
        <div class="league-item" style="animation-delay: ${i * 0.05}s;">
          <div class="league-name">🏆 ${lg.name}</div>
          <div class="league-stats">
            <span class="league-win">✅ ${lg.wins}</span>
            <span class="league-lose">❌ ${lg.loses}</span>
            <span class="league-acc">${lg.accuracy}%</span>
          </div>
        </div>
      `;
    });
  }

  html += `
      <div class="disclaimer">
        <div class="disclaimer-title">Важно</div>
        <div class="disclaimer-text">
          Все прогнозы — это <strong>сбор информации и аналитика</strong>. Они <strong>не являются гарантией победы</strong>. Играйте ответственно.
        </div>
      </div>
    </div>
  `;

  document.getElementById('content').innerHTML = html;
}

async function openHistory(filter) {
  haptic('medium');
  const content = document.getElementById('content');
  content.innerHTML = showSkeleton();
  const titles = { wins: '✅ ЗАШЕДШИЕ', loses: '❌ НЕЗАШЕДШИЕ', all: '📋 ВСЕ МАТЧИ' };
  try {
    const resp = await fetch(`${API_URL}?action=history&filter=${filter}`);
    const raw = await resp.json();
    const data = Array.isArray(raw) ? raw : (raw.data || []);
    let html = `<button style="margin-bottom:14px;padding:6px 14px;border-radius:18px;font-size:11px;font-weight:700;background:var(--card);color:var(--text-dim);border:1px solid var(--border);cursor:pointer;font-family:inherit;" onclick="loadData()">← Назад</button>`;
    html += `<div class="section-title">${titles[filter]}</div>`;
    html += `<div class="section-sub">Найдено: ${data.length}</div>`;
    if (!data.length) {
      html += '<div class="empty">Пока нет матчей</div>';
    } else {
      data.forEach((m, idx) => {
        const emoji = m.status === 'win' ? '✅' : m.status === 'lose' ? '❌' : '⏳';
        const winnerHtml = m.winner ? `<div class="winner-badge">🏆 ${m.winner}</div>` : '';
        html += `
          <div class="card" style="animation-delay: ${idx * 0.05}s;">
            <div class="card-teams">
              <div class="team">${m.home}</div>
              <div class="vs">${m.score || '—'}</div>
              <div class="team right">${m.away}</div>
            </div>
            <div class="card-meta">
              <div class="meta-item">🏆 ${m.league}</div>
              <div class="meta-item">📅 ${m.date}</div>
              <div class="meta-item">⚽ ${m.total}</div>
            </div>
            <div class="outcome-line" style="margin-bottom:0;">
              <span class="label">${emoji} ${m.prediction}</span>
              <span class="fav">${emoji}</span>
            </div>
            ${winnerHtml}
          </div>
        `;
      });
    }
    content.innerHTML = html;
  } catch (e) {
    content.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}
